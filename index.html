<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>紫微斗数 - 手机精修版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/iztro@2.5.3/dist/iztro.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        /* iOS 输入框重置 */
        input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; min-height: 44px; background-color: #fff; }
        select { -webkit-appearance: none; appearance: none; background-color: #fff; }
        .card { transition: all 0.3s ease; }
        .pattern-tag { background: linear-gradient(to right, #8b5cf6, #6366f1); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-right: 5px; margin-bottom: 4px; }
        .loading { border: 3px solid #e2e8f0; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md overflow-hidden border border-slate-100">
        <!-- 头部 -->
        <div class="bg-slate-900 p-6 text-center relative">
            <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-indigo-600/30 to-purple-600/30 z-0"></div>
            <h1 class="text-xl font-bold text-white relative z-10">🔮 紫微斗数 · 手机版</h1>
            <p class="text-slate-300 text-xs mt-1 relative z-10">v6.0 适配 iOS/安卓 · 智能格局</p>
        </div>

        <!-- 输入区 -->
        <div class="p-5 space-y-4 bg-slate-50/50">
            <div class="grid grid-cols-2 gap-3">
                <!-- 日期 -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">出生日期</label>
                    <input type="date" id="birthDate" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm">
                </div>
                <!-- 时间 -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">出生时间</label>
                    <input type="time" id="birthTime" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <!-- 地点 -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">出生城市</label>
                    <input type="text" id="location" placeholder="如: 周口" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm" style="min-height: 44px;">
                </div>
                <!-- 性别 -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">性别</label>
                    <div class="relative">
                        <select id="gender" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm appearance-none bg-white" style="min-height: 44px;">
                            <option value="女">女</option>
                            <option value="男">男</option>
                        </select>
                        <!-- 自定义下拉箭头 -->
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 text-sm mt-2">
                🚀 开始排盘
            </button>
            
            <p id="solarTimeHint" class="text-[10px] text-slate-400 text-center min-h-[15px]"></p>
        </div>

        <!-- 结果区 -->
        <div id="resultArea" class="hidden bg-white border-t border-slate-100">
            <div id="loading" class="hidden py-8 text-center"><div class="loading"></div><p class="text-xs text-slate-400 mt-2">正在推演天机...</p></div>
            <div id="forecastContent" class="p-5 space-y-6"></div>
            <div id="errorMsg" class="hidden m-4 text-rose-500 text-center text-sm p-3 bg-rose-50 rounded-lg border border-rose-100"></div>
        </div>
    </div>

    <script>
        const CITY_LONGITUDES = {
            '北京': 116.40, '上海': 121.47, '天津': 117.20, '重庆': 106.55, 
            '周口': 114.65, '郑州': 113.62, '开封': 114.30, '洛阳': 112.45, '平顶山': 113.19, '安阳': 114.39, '新乡': 113.92, '许昌': 113.85, '漯河': 114.01, '南阳': 112.52, '商丘': 115.65, '信阳': 114.09, '驻马店': 114.02,
            '武汉': 114.31, '长沙': 112.93, '广州': 113.26, '深圳': 114.05, '成都': 104.06, '西安': 108.93, '南京': 118.78, '杭州': 120.15, '沈阳': 123.43, '哈尔滨': 126.63, '济南': 117.02, '香港': 114.16, '台北': 121.50, '河南': 113.62
        };

        const STAR_DESC = {
            'huaLu': { name: '化禄', type: 'lucky', w: 2, desc: '财禄、情缘' },
            'huaQuan': { name: '化权', type: 'lucky', w: 2, desc: '掌权、升迁' },
            'huaKe': { name: '化科', type: 'lucky', w: 2, desc: '名声、科甲' },
            'huaJi': { name: '化忌', type: 'unlucky', w: -3, desc: '是非、阻滞' },
            'luCun': { name: '禄存', type: 'lucky', w: 1.5, desc: '真财、积蓄' },
            'tianMa': { name: '天马', type: 'neutral', w: 0, desc: '奔波、变动' },
            'zuoFu': { name: '左辅', type: 'lucky', w: 1, desc: '助力' },
            'youBi': { name: '右弼', type: 'lucky', w: 1, desc: '助力' },
            'tianKui': { name: '天魁', type: 'lucky', w: 1, desc: '贵人' },
            'tianYue': { name: '天钺', type: 'lucky', w: 1, desc: '机遇' },
            'qingYang': { name: '擎羊', type: 'unlucky', w: -1.5, desc: '刑伤' },
            'tuoLuo': { name: '陀罗', type: 'unlucky', w: -1.5, desc: '拖延' },
            'huoXing': { name: '火星', type: 'unlucky', w: -1.5, desc: '暴躁' },
            'lingXing': { name: '铃星', type: 'unlucky', w: -1.5, desc: '暗亏' },
            'diKong': { name: '地空', type: 'unlucky', w: -2, desc: '破耗' },
            'diJie': { name: '地劫', type: 'unlucky', w: -2, desc: '劫失' }
        };

        const PATTERNS = [
            { name: '火贪格', check: (stars) => stars.has('贪狼') && (stars.has('火星') || stars.has('铃星')), score: 5, desc: '🔥 火贪格：爆发运，利于突发横财' },
            { name: '禄马交驰', check: (stars) => (stars.has('禄存') || stars.has('化禄')) && stars.has('天马'), score: 4, desc: '🐎 禄马交驰：动中求财，越忙越有钱' },
            { name: '阳梁昌禄', check: (stars) => stars.has('太阳') && stars.has('天梁') && stars.has('文昌') && stars.has('禄存'), score: 5, desc: '📚 阳梁昌禄：考运亨通，利于考试' },
            { name: '辅弼拱主', check: (stars) => stars.has('紫微') && (stars.has('左辅') || stars.has('右弼')), score: 3, desc: '👑 辅弼拱主：得道多助，事半功倍' },
            { name: '空劫夹/照', check: (stars) => stars.has('地空') && stars.has('地劫'), score: -4, desc: '🌪️ 空劫同临：财来财去，宜修身养性' },
            { name: '巨火羊', check: (stars) => stars.has('巨门') && stars.has('火星') && stars.has('擎羊'), score: -5, desc: '⚡ 巨火羊：防重大口舌冲突、意外' },
            { name: '刑忌夹印', check: (stars) => stars.has('天相') && stars.has('化忌') && stars.has('擎羊'), score: -4, desc: '📜 刑忌夹印：小心文书合同陷阱' },
            { name: '铃昌陀武', check: (stars) => stars.has('铃星') && stars.has('文昌') && stars.has('陀罗') && stars.has('武曲'), score: -6, desc: '🌊 铃昌陀武：重大挫折信号，投资谨慎' },
            { name: '禄逢冲破', check: (stars) => (stars.has('化禄') || stars.has('禄存')) && (stars.has('地空') || stars.has('地劫') || stars.has('化忌')), score: -3, desc: '💸 禄逢冲破：看着赚钱实际赔钱' }
        ];

        function getSolarOffset(locationName) {
            let longitude = 120; 
            for (let city in CITY_LONGITUDES) {
                if (locationName.includes(city)) {
                    longitude = CITY_LONGITUDES[city];
                    break;
                }
            }
            return (longitude - 120) * 4;
        }

        function getTrueSolarTimeIndex(dateStr, timeStr, offsetMinutes) {
            const dt = new Date(`${dateStr}T${timeStr}:00`);
            dt.setMinutes(dt.getMinutes() + offsetMinutes);
            const h = dt.getHours();
            let index = Math.floor((h + 1) / 2);
            if (index >= 12) index = 0; 
            const fixedTimeStr = `${String(h).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
            return { index, fixedTimeStr };
        }

        async function calculate() {
            const dateStr = document.getElementById('birthDate').value;
            const timeStr = document.getElementById('birthTime').value;
            const location = document.getElementById('location').value || '';
            const genderVal = document.getElementById('gender').value;
            const resultArea = document.getElementById('resultArea');
            const loading = document.getElementById('loading');
            const content = document.getElementById('forecastContent');
            const errorMsg = document.getElementById('errorMsg');
            const hint = document.getElementById('solarTimeHint');

            content.innerHTML = '';
            resultArea.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            // 滚动到结果区
            setTimeout(() => { resultArea.scrollIntoView({behavior: "smooth", block: "start"}); }, 100);

            if (!dateStr || !timeStr) {
                errorMsg.textContent = "请先填好日期和时间哦~";
                errorMsg.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');

            setTimeout(() => {
                try {
                    const offset = getSolarOffset(location);
                    const { index: timeIndex, fixedTimeStr } = getTrueSolarTimeIndex(dateStr, timeStr, offset);
                    
                    hint.textContent = Math.abs(offset) > 1 
                        ? `*真太阳时: ${fixedTimeStr} (偏差${Math.round(offset)}分)` 
                        : `*使用标准时间`;

                    if (typeof iztro === 'undefined') throw new Error("网络小差，请刷新再试");

                    const gender = genderVal === '男' ? '男' : '女';
                    const astrolabe = iztro.astro.bySolar(dateStr, timeIndex, gender, true, 'zh-CN');

                    const today = new Date();
                    for (let i = 0; i < 3; i++) {
                        let targetDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
                        const targetStr = `${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-15 12:00:00`;
                        content.innerHTML += generateDeepAnalysis(astrolabe, targetDate, targetStr);
                    }
                } catch (e) {
                    console.error(e);
                    errorMsg.textContent = "出错了: " + e.message;
                    errorMsg.classList.remove('hidden');
                }
                loading.classList.add('hidden');
            }, 500);
        }

        function getStarSetAndList(astrolabe, scope) {
            const monthIndex = scope.monthly.index;
            const indices = [monthIndex, (monthIndex+6)%12, (monthIndex+4)%12, (monthIndex+8)%12];
            
            let starSet = new Set(); 
            let starList = []; 

            indices.forEach((idx, i) => {
                const p = astrolabe.palace(idx);
                const isBenGong = i === 0;
                const majors = p.majorStars || [];
                const minors = p.minorStars || [];
                [...majors, ...minors].forEach(s => {
                    starSet.add(s.name);
                    starList.push({ name: s.name, src: isBenGong ? '本宫' : '三方', type: 'static' });
                });
            });

            const mutagens = scope.monthly.mutagens || [];
            mutagens.forEach(m => {
                starSet.add(m.name + m.mutagen); 
                starSet.add(m.mutagen); 
                starSet.add(m.name); 
                starList.push({ name: m.name + m.mutagen, src: '流变', type: 'mutagen', rawType: m.mutagen });
            });

            return { starSet, starList };
        }

        function generateDeepAnalysis(astrolabe, dateObj, dateStr) {
            const scope = astrolabe.horoscope(dateStr);
            if (!scope || !scope.monthly) return '';

            const monthIndex = scope.monthly.index;
            const palaceName = astrolabe.palace(monthIndex).name;
            const { starSet, starList } = getStarSetAndList(astrolabe, scope);
            const lunarDate = scope.lunarDate ? `${scope.lunarDate.month}月${scope.lunarDate.day}` : '';

            let matchedPatterns = [];
            PATTERNS.forEach(p => {
                if (p.check(starSet)) matchedPatterns.push(p);
            });

            let totalScore = 0;
            matchedPatterns.forEach(p => totalScore += p.score);
            starList.forEach(s => {
                let key = '';
                if (s.name.includes('化禄')) key = 'huaLu';
                else if (s.name.includes('化权')) key = 'huaQuan';
                else if (s.name.includes('化科')) key = 'huaKe';
                else if (s.name.includes('化忌')) key = 'huaJi';
                else key = Object.keys(STAR_DESC).find(k => STAR_DESC[k].name === s.name);
                
                if (key && STAR_DESC[key]) totalScore += STAR_DESC[key].w;
            });

            let summaryTitle = "", summaryColor = "", summaryText = "";
            if (totalScore >= 6) { summaryTitle = "🚀 运势强劲"; summaryColor = "text-emerald-600"; summaryText = "机遇显著，利于进攻。"; }
            else if (totalScore >= 2) { summaryTitle = "📈 稳中向好"; summaryColor = "text-blue-600"; summaryText = "吉多凶少，积极争取。"; }
            else if (totalScore >= -2) { summaryTitle = "⚖️ 平稳过渡"; summaryColor = "text-slate-600"; summaryText = "吉凶相当，心态平和。"; }
            else if (totalScore >= -6) { summaryTitle = "🌪️ 阻力显现"; summaryColor = "text-orange-600"; summaryText = "环境不善，低调保守。"; }
            else { summaryTitle = "🛑 严阵以待"; summaryColor = "text-red-600"; summaryText = "风险较高，凡事三思。"; }

            return `
                <div class="bg-white rounded-xl border border-slate-100 p-4 shadow-sm mb-4">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-3 mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">
                                ${dateObj.getMonth()+1}月
                                <span class="text-xs font-normal text-slate-500 ml-1">(农历${lunarDate})</span>
                            </h3>
                            <div class="text-xs text-slate-500 mt-0.5">流月【${palaceName}】</div>
                        </div>
                        <div class="text-right mt-1">
                             <span class="text-sm font-bold ${summaryColor}">${summaryTitle}</span>
                        </div>
                    </div>

                    ${matchedPatterns.length > 0 ? `
                        <div class="mb-3 bg-indigo-50 rounded-lg p-2.5 border border-indigo-100">
                            <div class="space-y-1">
                                ${matchedPatterns.map(p => `
                                    <div class="flex flex-col">
                                        <div class="flex items-center"><span class="pattern-tag">格局</span><span class="text-xs font-bold text-indigo-900">${p.name}</span></div>
                                        <span class="text-xs text-slate-600 pl-1">${p.desc.split('：')[1]}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="bg-emerald-50/50 p-2 rounded-lg">
                            <h4 class="text-[10px] font-bold text-emerald-600 mb-1.5 uppercase">有利</h4>
                            <div class="flex flex-wrap gap-1.5">
                                ${getStarTags(starList, 'good') || '<span class="text-[10px] text-slate-300">无明显吉星</span>'}
                            </div>
                        </div>
                        <div class="bg-rose-50/50 p-2 rounded-lg">
                            <h4 class="text-[10px] font-bold text-rose-600 mb-1.5 uppercase">警惕</h4>
                            <div class="flex flex-wrap gap-1.5">
                                ${getStarTags(starList, 'bad') || '<span class="text-[10px] text-slate-300">无明显煞星</span>'}
                            </div>
                        </div>
                    </div>
                    <div class="text-xs text-slate-600">💡 <strong>建议：</strong>${summaryText}</div>
                </div>
            `;
        }

        function getStarTags(list, type) {
            let filtered = [], seen = new Set();
            list.forEach(s => {
                let isGood = false, isBad = false;
                if (s.rawType) { 
                    if (['化禄','化权','化科'].includes(s.rawType)) isGood = true;
                    if (s.rawType === '化忌') isBad = true;
                } else { 
                    const def = Object.values(STAR_DESC).find(d => d.name === s.name);
                    if (def) {
                        if (def.type === 'lucky') isGood = true;
                        if (def.type === 'unlucky') isBad = true;
                    }
                }
                if (type === 'good' && isGood && !seen.has(s.name)) {
                    filtered.push(`<span class="px-1.5 py-0.5 bg-white border border-emerald-100 text-emerald-700 rounded text-[10px] font-medium shadow-sm">${s.name}</span>`);
                    seen.add(s.name);
                }
                if (type === 'bad' && isBad && !seen.has(s.name)) {
                    filtered.push(`<span class="px-1.5 py-0.5 bg-white border border-rose-100 text-rose-700 rounded text-[10px] font-medium shadow-sm">${s.name}</span>`);
                    seen.add(s.name);
                }
            });
            return filtered.join('');
        }
    </script>
</body>
</html>
