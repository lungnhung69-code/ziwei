        }

        function calculateBaZiData(solarDate) {
            const solar = Solar.fromYmdHms(solarDate.getFullYear(), solarDate.getMonth() + 1, solarDate.getDate(), solarDate.getHours(), solarDate.getMinutes(), solarDate.getSeconds());
            const lunar = solar.getLunar();
            const baZi = lunar.getEightChar();
            return {
                lunarStr: `${lunar.getYearShengXiao()}年 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`,
                baziStr: `${baZi.getYear()} / ${baZi.getMonth()} / ${baZi.getDay()} / ${baZi.getTime()}`,
                zwYearStem: lunar.getYearGan() 
            };
        }

        const SI_HUA_MAP = {
            '甲': { '廉贞': '禄', '破军': '权', '武曲': '科', '太阳': '忌' },
            '乙': { '天机': '禄', '天梁': '权', '紫微': '科', '太阴': '忌' },
            '丙': { '天同': '禄', '天机': '权', '文昌': '科', '廉贞': '忌' },
            '丁': { '太阴': '禄', '天同': '权', '天机': '科', '巨门': '忌' },
            '戊': { '贪狼': '禄', '太阴': '权', '右弼': '科', '天机': '忌' },
            '己': { '武曲': '禄', '贪狼': '权', '天梁': '科', '文曲': '忌' },
            '庚': { '太阳': '禄', '武曲': '权', '太阴': '科', '天同': '忌' },
            '辛': { '巨门': '禄', '太阳': '权', '文曲': '科', '文昌': '忌' },
            '壬': { '天梁': '禄', '紫微': '权', '左辅': '科', '武曲': '忌' },
            '癸': { '破军': '禄', '巨门': '权', '太阴': '科', '贪狼': '忌' }
        };
        
        function getSiHua(starName, stem) {
            const map = SI_HUA_MAP[stem];
            if (!map) return null;
            for (let [s, type] of Object.entries(map)) {
                if (s === starName) return type;
            }
            return null;
        }

        // === 3. 深度分析推理引擎 (核心修改处) ===
        function analyzePalaceDeeply(palace, astrolabe, birthStem) {
            const pConfig = PALACE_CONFIG[palace.name] || { type: 'general', label: palace.name };
            const majors = palace.majorStars.map(s => s.name);
            const minors = palace.minorStars.map(s => s.name);
            const borrow = majors.length === 0;
            
            const pDui = astrolabe.palace((palace.index + 6) % 12);
            const activeStars = borrow ? pDui.majorStars.map(s => s.name) : majors;
            const sanFangStars = [
                ...astrolabe.palace((palace.index + 4) % 12).majorStars,
                ...astrolabe.palace((palace.index + 8) % 12).majorStars,
                ...pDui.majorStars
            ].map(s => s.name);

            let coreText = "";
            let starTraits = [];
            
            if (activeStars.length === 0) {
                coreText = "此宫位无主星，格局较弱，易受环境影响，缺乏定性。";
            } else {
                // 优先使用特定场景描述（如疾厄宫），如果没有则使用通用描述
                const specificDesc = activeStars.map(s => (SMART_ANALYSIS[pConfig.type] || {})[s]).filter(Boolean);
                
                if (specificDesc.length > 0) {
                    coreText = specificDesc.join(' '); // 直接显示健康/财运的具体描述
                } else {
                    activeStars.forEach(star => {
                        const base = STAR_BASE[star];
                        if (base) starTraits.push(base.title);
                    });
                    coreText = `主星坐守【${activeStars.join('、')}】，呈现${starTraits.join('、')}之象。`;
                    activeStars.forEach(s => { if(STAR_BASE[s]) coreText += STAR_BASE[s].trait; });
                }
                
                if (borrow) coreText = `(借对宫)${coreText}`;
            }

            let patternText = "";
            let sihuaTags = [];
            
            activeStars.forEach(star => {
                const type = getSiHua(star, birthStem);
                if (type) {
                    const info = SI_HUA_DICT[type];
                    patternText += `<b>${star}${info.label}</b>：${info.effect}<br>`;
                    sihuaTags.push(`<span class="${info.color} bg-white border px-1 rounded text-xs">${info.label}</span>`);
                }
            });

            const lucky = sanFangStars.filter(s => ['左辅','右弼','天魁','天钺','文昌','文曲'].includes(s));
            const unlucky = minors.filter(s => ['擎羊','陀罗','火星','铃星','地空','地劫'].includes(s));
            
            if (lucky.length > 0) patternText += `三方会照【${lucky.slice(0,2).join('+')}】，外力支援强，有人脉助力。<br>`;
            if (unlucky.length > 0) patternText += `本宫或对宫见【${unlucky.join('、')}】干扰，需防突发阻碍或小人破坏。`;
            if (!patternText) patternText = "格局相对平稳，无剧烈吉凶冲照，按部就班发展即可。";

            // 智能建议逻辑
            let adviceText = "";
            const hasJi = activeStars.some(s => getSiHua(s, birthStem) === '忌');
            const hasLu = activeStars.some(s => getSiHua(s, birthStem) === '禄');
            const hasSha = unlucky.length > 0;

            // 针对不同宫位类型的特殊建议
            if (pConfig.type === 'wealth') {
                if (hasJi || hasSha) adviceText = "财运有破损风险，切忌借贷、担保或高风险投机。宜积谷防饥，稳健理财。";
                else if (hasLu) adviceText = "财气顺遂，可适当扩大投资，通过专业技能或人际关系变现。";
                else adviceText = "正财为主，多劳多得，不宜妄想横财，踏实工作回报最稳。";
            } else if (pConfig.type === 'career') {
                if (hasJi) adviceText = "职场易有口舌或变动，建议低调行事，凡事留痕，避免背锅。";
                else if (activeStars.includes('七杀') || activeStars.includes('破军')) adviceText = "事业宜动不宜静，适合开拓新市场或创业，不宜死守枯木。";
                else adviceText = "事业运势平稳，适合在现有领域深耕，积累资历等待晋升。";
            } else if (pConfig.type === 'health') { // 修复：疾厄宫专属建议
                if (hasJi || hasSha) adviceText = "身体抵抗力稍弱，需定期体检。注意作息规律，避免过度透支，防慢性病隐患。";
                else adviceText = "体质总体健康，精力充沛。保持良好的生活习惯，适度运动即可。";
            } else if (pConfig.type === 'asset') { // 修复：田宅宫专属建议
                if (hasJi) adviceText = "置业需谨慎，注意合同陷阱或房屋漏水等隐患。居家环境宜简单明亮。";
                else adviceText = "家运安宁，利于置产或装修。居住环境能为您带来正向能量。";
            } else {
                if (hasSha) adviceText = "当前运势稍显动荡，凡事多做一手准备，心态宜宽不宜急。";
                else adviceText = "运势平顺，可顺势而为，抓住生活中的小确幸。";
            }

            return {
                core: coreText,
                pattern: patternText,
                advice: adviceText,
                stars: activeStars,
                sihuaTags: sihuaTags,
                isBorrowed: borrow
            };
        }

        // === 4. UI 渲染逻辑 ===
        
        function calculate() {
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                const tstRes = getTrueSolarDate(`${y}-${m}-${d} ${t}`, loc);
                document.getElementById('solarHint').innerHTML = `<i class="fas fa-clock"></i> 真太阳时：${tstRes.date.getHours()}:${String(tstRes.date.getMinutes()).padStart(2,'0')} (经度修正)`;

                const dateData = calculateBaZiData(tstRes.date);
                document.getElementById('birthStemDisplay').innerHTML = `
                    <span>农历：${dateData.lunarStr}</span> | 
                    <span>八字：${dateData.baziStr}</span>
                `;

                const tstY = tstRes.date.getFullYear();
                const tstM = String(tstRes.date.getMonth()+1).padStart(2,'0');
                const tstD = String(tstRes.date.getDate()).padStart(2,'0');
                const timeIndex = Math.floor((tstRes.date.getHours() + 1) / 2) % 12;
                
                const astrolabe = iztro.astro.bySolar(`${tstY}-${tstM}-${tstD}`, timeIndex, gender, true, 'zh-CN');

                renderDeepReport(astrolabe, dateData.zwYearStem);
                renderFortune(astrolabe);

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1'); 

            } catch(e) { console.error(e); alert('排盘失败，请检查输入'); }
        }

        function renderDeepReport(astrolabe, birthStem) {
            const container = document.getElementById('profileContent');
            container.innerHTML = '';
            // 调整展示顺序，将疾厄和田宅也纳入重点展示
            const focusPalaces = ['命宫', '财帛', '官禄', '迁移', '夫妻', '疾厄', '田宅', '福德'];
            
            focusPalaces.forEach(pName => {
                const palace = astrolabe.palaces.find(p => p.name === pName);
                if (!palace) return;
                const config = PALACE_CONFIG[pName];
                const analysis = analyzePalaceDeeply(palace, astrolabe, birthStem);
                const card = document.createElement('div');
                card.className = 'synthesis-card fade-in';
                
                let starBadges = analysis.stars.map(s => `<span class="keyword-box">${s}</span>`).join('');
                if (analysis.isBorrowed) starBadges = `<span class="text-xs text-gray-400 mr-2">(借对宫)</span>` + starBadges;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon"><i class="fas ${config.icon}"></i></div>
                        <div>
                            <div class="card-title">${pName} <span class="text-sm font-normal text-slate-400">(${palace.earthlyBranch})</span></div>
                            <div class="text-xs text-slate-500">${config.label}</div>
                        </div>
                        <div class="ml-auto flex flex-col items-end gap-1">
                            <div>${starBadges}</div>
                            <div class="flex gap-1">${analysis.sihuaTags.join('')}</div>
                        </div>
                    </div>
                    <div class="deep-section ds-core">
                        <div class="ds-title"><i class="fas fa-gem"></i> 核心特质</div>
                        <div class="ds-content">${analysis.core}</div>
                    </div>
                    <div class="deep-section ds-pattern">
                        <div class="ds-title"><i class="fas fa-chess-board"></i> 格局分析</div>
                        <div class="ds-content">${analysis.pattern}</div>
                    </div>
                    <div class="deep-section ds-advice">
                        <div class="ds-title"><i class="fas fa-lightbulb"></i> 运势建议</div>
                        <div class="ds-content">${analysis.advice}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderFortune(astrolabe) {
            const now = new Date();
            const currentYear = now.getFullYear();
            const yearStr = currentYear + '-06-01 12:00:00'; 
            let yearlyScope; try { yearlyScope = astrolabe.horoscope(yearStr); } catch(e){}

            if (yearlyScope && yearlyScope.yearly) {
                const yearStem = yearlyScope.yearly.heavenlyStem; 
                const yIndex = yearlyScope.yearly.index;
                const yPalace = astrolabe.palace(yIndex);
                
                const mStars = _getStars(yPalace);
                const dStars = _getStars(astrolabe.palace((yIndex+6)%12));
                const finalStars = mStars.length > 0 ? mStars : dStars;
                const starKey = finalStars.length > 0 ? finalStars[0].name : 'empty';
                
                document.getElementById('yearTitle').innerText = `${currentYear} ${yearStem}${yearlyScope.yearly.earthlyBranch}年`;
                document.getElementById('yearSub').innerText = `流年命宫 · ${yPalace.name}`;

                const yearLogic = TIME_LOGIC[starKey] || {text:'今年运势平稳，按部就班。重点在于利用三方资源。', tag:'平稳·积累'};
                let tagHtml = `<span class="year-tag yt-purple">${yearLogic.tag}</span>`;
                const allNames = finalStars.map(s=>s.name);
                if(allNames.some(n=>n.includes('杀')||n.includes('破'))) tagHtml += `<span class="year-tag yt-blue">变动</span>`;
                if(allNames.some(n=>n.includes('桃')||n.includes('红'))) tagHtml += `<span class="year-tag yt-blue">桃花</span>`;
                document.getElementById('yearTags').innerHTML = tagHtml;

                let coreText = yearLogic.text;
                const minors = _getMinors(yPalace).map(s=>s.name);
                if(minors.includes('化忌')) coreText += " <br><b>⚠️ 特别注意：</b>流年化忌入命，凡事多阻碍，心态易纠结，宜守不宜攻。";
                else if(minors.includes('擎羊') || minors.includes('火星')) coreText += " <br><b>⚠️ 特别注意：</b>煞星入命，脾气较大或突发状况多，注意防受伤和口舌。";
                document.getElementById('yearCoreText').innerHTML = coreText;

                const sihua = SI_HUA_MAP[yearStem] || {};
                let sihuaHTML = '';
                astrolabe.palaces.forEach(p => {
                    p.majorStars.forEach(star => {
                        if (sihua[star.name]) {
                            const type = sihua[star.name];
                            const flowNames = ['命','父','福','田','官','友','迁','疾','财','子','夫','兄'];
                            const relIdx = (p.index - yIndex + 12) % 12;
                            if(type==='忌' || type==='禄') {
                                const color = type==='忌'?'text-red-600 font-bold':'text-green-600';
                                sihuaHTML += `<div>${star.name}化${type} <span class="${color}">入流年${flowNames[relIdx]}</span></div>`;
                            }
                        }
                    });
                });
                document.getElementById('yearSiHua').innerHTML = sihuaHTML || '无重要四化入三方';
                
                const cai = astrolabe.palace((yIndex+4)%12);
                const guan = astrolabe.palace((yIndex+8)%12);
                const getStarStr = (p) => {
                    const s = _getStars(p);
                    if(s.length>0) return s.map(x=>x.name).join('');
                    return '借'+_getStars(astrolabe.palace((p.index+6)%12)).map(x=>x.name).join('');
                }
                document.getElementById('yearSanFang').innerHTML = `
                    <div>流财：${getStarStr(cai)}</div>
                    <div>流官：${getStarStr(guan)}</div>
                `;
            }

            const container = document.getElementById('monthlyForecast');
            container.innerHTML = '';
            
            for (let i = 0; i < 3; i++) {
                const fDate = new Date(); fDate.setMonth(now.getMonth() + i);
                const year = fDate.getFullYear();
                const month = fDate.getMonth() + 1;
                const fStr = `${year}-${String(month).padStart(2,'0')}-15 12:00:00`;
                
                let scope; try { scope = astrolabe.horoscope(fStr); } catch(e) { continue; }

                if (scope && scope.monthly) {
                    const mPalace = astrolabe.palace(scope.monthly.index);
                    const allStars = [...mPalace.majorStars, ...mPalace.minorStars];
                    const starNames = allStars.map(s => s.name);
                    
                    let mainStar = mPalace.majorStars.length > 0 ? mPalace.majorStars[0].name : '';
                    if (!mainStar && mPalace.majorStars.length === 0) {
                        const pDui = astrolabe.palace((mPalace.index + 6) % 12);
                        mainStar = pDui.majorStars.length > 0 ? pDui.majorStars[0].name : '天同'; 
                    }
                    
                    const rule = MONTH_RULES[mainStar] || { w:'平稳', c:'平稳', l:'平稳', h:'平稳' };
                    let warning = null;
                    let modW = rule.w, modC = rule.c, modL = rule.l, modH = rule.h;
                    
                    if (starNames.includes('化忌')) {
                        warning = '化忌冲守，诸事保守';
                        modW = '<span class="text-rose-600">防破财</span>';
                        modC = '<span class="text-rose-600">易出错</span>';
                    } else if (starNames.includes('地空') || starNames.includes('地劫')) {
                        warning = '空劫入命，得不偿失';
                        modW = '虚耗多';
                    } else if (starNames.includes('擎羊') || starNames.includes('火星')) {
                        warning = '火羊相激，控制脾气';
                        modC = '压力大';
                    }

                    const lunarObj = Solar.fromYmd(year, month, 15).getLunar();
                    const lunarText = lunarObj.getMonthInChinese(); 

                    const card = document.createElement('div');
                    card.className = 'moon-card fade-in';
                    card.innerHTML = `
                        <div class="moon-header border-b border-slate-100 pb-2 mb-2">
                            <div>
                                <h2 class="text-lg font-black text-slate-800 flex items-center gap-2">
                                    ${year}年${month}月 <span class="text-xs font-normal text-slate-400 bg-slate-100 px-2 py-0.5 rounded">农历${lunarText}月</span>
                                </h2>
                                <div class="text-xs text-slate-500 mt-0.5">流月命宫：${mPalace.name} (${mainStar})</div>
                            </div>
                            ${warning ? `<div class="text-xs font-bold text-rose-500 bg-rose-50 px-2 py-1 rounded border border-rose-100">${warning}</div>` : ''}
                        </div>
                        
                        <div class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded bg-yellow-100 text-yellow-600 flex items-center justify-center text-xs"><i class="fas fa-coins"></i></div>
                                <div class="flex-1">
                                    <div class="text-xs text-slate-400">财运</div>
                                    <div class="font-bold text-slate-700">${modW}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded bg-blue-100 text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-briefcase"></i></div>
                                <div class="flex-1">
                                    <div class="text-xs text-slate-400">事业</div>
                                    <div class="font-bold text-slate-700">${modC}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded bg-pink-100 text-pink-600 flex items-center justify-center text-xs"><i class="fas fa-heart"></i></div>
                                <div class="flex-1">
                                    <div class="text-xs text-slate-400">感情</div>
                                    <div class="font-bold text-slate-700">${modL}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs"><i class="fas fa-notes-medical"></i></div>
                                <div class="flex-1">
                                    <div class="text-xs text-slate-400">健康</div>
                                    <div class="font-bold text-slate-700">${modH}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
        }

        function switchTab(id) {
            ['tab1','tab2'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        (function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1950; i--) y.add(new Option(i+'年', i));
            y.value = 1995; 
            for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=15;
        })();
    </script>
</body>
</html>
