            '七杀': { base: '将星，主肃杀、冲刺。', core: '性格急躁，喜怒无常，敢打敢拼。', wealth: '暴发暴败，适合赚快钱。', career: '适合创业、军警、外科、重工。', love: '感情闪婚闪离率高，配偶刚烈。', health: '注意外伤、肺部。' },
            '破军': { base: '耗星，主破坏、先锋。', core: '不破不立，喜新厌旧，反叛心强。', wealth: '破财多，花钱如流水，大起大落。', career: '适合破坏后重建、装修、创新。', love: '感情大破大立，不按常理出牌。', health: '注意生殖系统、心脏。' }
        };

        const SI_HUA_MAP = {
            '甲': { '廉贞': '禄', '破军': '权', '武曲': '科', '太阳': '忌' },
            '乙': { '天机': '禄', '天梁': '权', '紫微': '科', '太阴': '忌' },
            '丙': { '天同': '禄', '天机': '权', '文昌': '科', '廉贞': '忌' },
            '丁': { '太阴': '禄', '天同': '权', '天机': '科', '巨门': '忌' },
            '戊': { '贪狼': '禄', '太阴': '权', '右弼': '科', '天机': '忌' },
            '己': { '武曲': '禄', '贪狼': '权', '天梁': '科', '文曲': '忌' },
            '庚': { '太阳': '禄', '武曲': '权', '太阴': '科', '天同': '忌' },
            '辛': { '巨门': '禄', '太阳': '权', '文曲': '科', '文昌': '忌' },
            '壬': { '天梁': '禄', '紫微': '权', '左辅': '科', '武曲': '忌' },
            '癸': { '破军': '禄', '巨门': '权', '太阴': '科', '贪狼': '忌' }
        };

        const CITY_LONGITUDES={'北京':116.40,'上海':121.47,'广州':113.23,'深圳':114.05,'成都':104.06,'武汉':114.31,'西安':108.95,'周口':114.65,'郑州':113.65};
        // 农历映射表
        const LUNAR_MAP = ["正","二","三","四","五","六","七","八","九","十","十一","十二"];
        // 吉凶星分类 (用于流月)
        const LUCKY_STARS = ['紫微','天府','太阳','太阴','天相','天梁','天同','左辅','右弼','天魁','天钺','文昌','文曲','化禄','化权','化科','禄存'];
        const UNLUCKY_STARS = ['擎羊','陀罗','火星','铃星','地空','地劫','化忌','七杀','破军','廉贞','贪狼','巨门'];

        // === 2. 核心函数 ===

        function _getStars(p) { return p?.majorStars || []; }
        function _getMinors(p) { return p?.minorStars || []; }

        // 获取四化描述
        function getSiHuaDesc(starName, stem) {
            if (!stem || !starName) return null;
            const map = SI_HUA_MAP[stem];
            if (!map) return null;
            for (let [key, val] of Object.entries(map)) {
                if (key === starName) {
                    const dict = { '禄': '化禄·缘起/财富', '权': '化权·掌控/变动', '科': '化科·名声/贵人', '忌': '化忌·波折/亏欠' };
                    const css = { '禄': 'hua-lu', '权': 'hua-quan', '科': 'hua-ke', '忌': 'hua-ji' };
                    return { type: val, label: dict[val], css: css[val] };
                }
            }
            return null;
        }

        // V30: 核心分析函数 (深度12宫)
        function analyzePalaceFull(palace, astrolabe, birthYearStem) {
            if (!palace) return { text: '宫位数据错误', tags: [], stars: [], sihua: [], sfText: '' };

            const majorStars = _getStars(palace);
            const minorStars = _getMinors(palace);
            const isBodyPalace = astrolabe.bodyPalace && palace.name === astrolabe.bodyPalace.name;
            const isLifePalace = astrolabe.lifePalace && palace.name === astrolabe.lifePalace.name;
            
            // 1. 三方四正获取
            const idx = palace.index;
            const pDui = astrolabe.palace((idx + 6) % 12); 
            const pSan1 = astrolabe.palace((idx + 4) % 12); 
            const pSan2 = astrolabe.palace((idx + 8) % 12); 
            
            const sanFangStars = [
                ..._getStars(pDui), ..._getStars(pSan1), ..._getStars(pSan2)
            ].map(s => s.name);
            
            const sanFangMinors = [
                 ..._getMinors(pDui), ..._getMinors(pSan1), ..._getMinors(pSan2)
            ].map(s => s.name);

            // 2. 主星逻辑 (含借星)
            let analysis = {
                palaceName: palace.name,
                isEmpty: majorStars.length === 0,
                stars: majorStars.map(s => s.name),
                borrowed: false,
                text: '',
                tags: [],
                sihua: [],
                sfText: ''
            };

            if (isBodyPalace) analysis.tags.push('身宫所在');
            if (isLifePalace) analysis.tags.push('命宫所在');

            let activeStars = majorStars;
            if (analysis.isEmpty && pDui) {
                activeStars = _getStars(pDui);
                analysis.borrowed = true;
                analysis.stars = activeStars.map(s => s.name);
            }

            // 3. 构建解释文本
            const contextKey = getContextKey(palace.name); 
            let mainDesc = "";
            
            if (activeStars.length === 0) {
                mainDesc = "此宫位无主星，且对宫也无主星，为典型的【弱宫】，易受环境左右，缺乏定性。";
            } else {
                activeStars.forEach(star => {
                    const db = INTERPRETATION_DB[star.name];
                    if (db) {
                        mainDesc += `<b>【${star.name}】</b>：${db[contextKey] || db.base}`;
                    }
                    // 核心修正：只有在Tab1我们才用“生年四化”去判断吉凶
                    const sh = getSiHuaDesc(star.name, birthYearStem);
                    if (sh) {
                        analysis.sihua.push({ star: star.name, ...sh });
                        if(sh.type === '忌') mainDesc += `<span class="text-rose-600 font-bold">（本命化忌：多波折，需注意）</span>`;
                        if(sh.type === '禄') mainDesc += `<span class="text-green-600 font-bold">（本命化禄：机缘佳）</span>`;
                    }
                });
            }
            if (analysis.borrowed) mainDesc = `(本宫空亡，借对宫<b>${analysis.stars.join('+')}</b>论断，力量减半)：` + mainDesc;
            analysis.text = mainDesc;

            // 4. 三方四正格局
            let pattern = [];
            if (sanFangStars.includes('左辅') || sanFangStars.includes('右弼')) pattern.push('辅弼拱照(有人帮)');
            if (sanFangStars.includes('文昌') || sanFangStars.includes('文曲')) pattern.push('昌曲拱照(利文书)');
            if (sanFangStars.includes('天魁') || sanFangStars.includes('天钺')) pattern.push('魁钺拱照(遇贵人)');
            if (sanFangMinors.some(s=>['擎羊','陀罗','火星','铃星','地空','地劫'].includes(s))) pattern.push('煞星冲照(有隐患)');
            
            // 四化冲照
            sanFangStars.forEach(sName => {
                const sh = getSiHuaDesc(sName, birthYearStem);
                if(sh && sh.type === '忌') pattern.push(`对宫/三合${sName}化忌冲入`);
                if(sh && sh.type === '禄') pattern.push(`对宫/三合${sName}化禄照入`);
            });

            analysis.sfText = pattern.length > 0 ? pattern.join(' · ') : '三方四正格局平稳';

            return analysis;
        }

        function getContextKey(pName) {
            const map = {
                '命宫': 'core', '迁移': 'core', 
                '财帛': 'wealth', '田宅': 'wealth',
                '官禄': 'career',
                '夫妻': 'love', '子女': 'love',
                '疾厄': 'health', '福德': 'health'
            };
            return map[pName] || 'base';
        }

        // V29: 流月宜忌逻辑
        function getAdvice(stars, type) {
            const DICT = {
                '天机':{yi:'策划',ji:'纠结'}, '太阳':{yi:'社交',ji:'过劳'}, '武曲':{yi:'理财',ji:'借钱'},
                '天同':{yi:'聚餐',ji:'懒散'}, '廉贞':{yi:'公关',ji:'官非'}, '贪狼':{yi:'应酬',ji:'投机'},
                '巨门':{yi:'演讲',ji:'吵架'}, '七杀':{yi:'冲刺',ji:'受伤'}, '破军':{yi:'创新',ji:'破财'},
                '天马':{yi:'出差',ji:'安逸'}, '擎羊':{yi:'果断',ji:'发火'}, '陀罗':{yi:'研究',ji:'拖延'},
                '化忌':{yi:'低调',ji:'逞强'}, '化禄':{yi:'投资',ji:'浪费'}
            };
            for(let s of stars) {
                if(DICT[s]) return DICT[s][type];
                const key = Object.keys(DICT).find(k => s.includes(k)); // 模糊匹配
                if(key) return DICT[key][type];
            }
            return type==='yi'?'安分':'冒险';
        }

        // === 3. 主程序逻辑 ===

        function calculate() {
            if (typeof iztro === 'undefined') { alert("资源加载中，请稍候..."); return; }
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                // 1. 太阳时计算
                let lng = 120; for(let c in CITY_LONGITUDES) if(loc.includes(c)) lng=CITY_LONGITUDES[c];
                const offset = (lng - 120) * 4;
                const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
                if (isNaN(dateObj.getTime())) throw new Error("日期无效");
                dateObj.setMinutes(dateObj.getMinutes() + offset);
                let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;
                document.getElementById('solarHint').innerText = `✅ 真太阳时: ${loc} (${lng>120?'+':''}${Math.round(offset)}分)`;

                // 2. 排盘
                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                // 3. 修复：精准获取生年天干 (用于Tab1本命四化)
                // iztro 返回的 chineseDate.yearly 可能是 "甲子" 字符串，取第一个字
                let birthStem = '甲'; 
                try {
                    const yearlyStr = astrolabe.chineseDate.yearly; // 例如 "癸亥"
                    birthStem = yearlyStr.charAt(0); // 取 "癸"
                    document.getElementById('birthStemDisplay').innerText = `本命生年：${yearlyStr} (${birthStem}干)`;
                } catch(e) {
                    console.error("天干获取失败", e);
                    birthStem = '甲'; // 只有完全失败才兜底
                }

                // 4. 渲染
                renderFullProfile(astrolabe, birthStem); // Tab 1
                renderFortuneV29(astrolabe); // Tab 2 (复刻V29逻辑)

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1');

            } catch(e) { console.error(e); alert('排盘错误: ' + e.message); }
        }

        // Tab 1: 全12宫位深度解析
        function renderFullProfile(astrolabe, birthStem) {
            const container = document.getElementById('profileContent');
            container.innerHTML = '';
            const groups = { core: [], people: [], body: [] };
            
            astrolabe.palaces.forEach(p => {
                const def = PALACE_DEFS[p.name] || { group: 'body', icon: 'fa-star', desc: '其他宫位' };
                const data = analyzePalaceFull(p, astrolabe, birthStem);
                if (groups[def.group]) groups[def.group].push({ p, def, data });
            });

            for (const [gKey, items] of Object.entries(groups)) {
                if (items.length === 0) continue;
                const groupTitle = document.createElement('div');
                groupTitle.className = 'group-title';
                groupTitle.innerHTML = GROUP_NAMES[gKey] || '其他';
                container.appendChild(groupTitle);

                items.forEach(item => {
                    const { p, def, data } = item;
                    let tagsHtml = data.tags.map(t => `<span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded mr-1">${t}</span>`).join('');
                    let starsHtml = data.stars.map(s => `<span class="keyword-box">${s}</span>`).join('');
                    if (data.stars.length === 0) starsHtml = `<span class="text-xs text-gray-400">无主星</span>`;
                    
                    let sihuaHtml = '';
                    if (data.sihua.length > 0) {
                        sihuaHtml = `<div class="mt-2 flex flex-wrap gap-2">` + 
                            data.sihua.map(sh => `<span class="${sh.css} text-xs border border-current opacity-90">${sh.label}</span>`).join('') + 
                            `</div>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'synthesis-card fade-in';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-icon"><i class="fas ${def.icon}"></i></div>
                            <div>
                                <div class="card-title">${p.name} <span class="text-sm font-normal text-slate-500">(${p.earthlyBranch})</span></div>
                                <div class="text-xs text-slate-400">${def.desc}</div>

                            <div class="ml-auto flex flex-col items-end">
                                <div>${tagsHtml}</div>
                            </div>
                        </div>
                        <div class="infer-section">
                            <div class="infer-label">格局配置</div>
                            <div class="mb-2">${starsHtml}</div>
                            <div class="infer-text">${data.text}</div>
                            ${sihuaHtml}
                        </div>
                        <div class="sanfang-box">
                            <i class="fas fa-network-wired mr-1"></i> <b>三方四正互动：</b>${data.sfText}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // Tab 2: 恢复 V29 丰富的流年流月
        function renderFortuneV29(astrolabe) {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            // --- 流年 ---
            const yearStr = currentYear + '-06-01 12:00:00'; 
            let yearlyScope; try { yearlyScope = astrolabe.horoscope(yearStr); } catch(e){}

            if (yearlyScope && yearlyScope.yearly) {
                const yearStem = yearlyScope.yearly.heavenlyStem; // 流年天干 (例如 2025是乙)
                const yIndex = yearlyScope.yearly.index;
                const yPalace = astrolabe.palace(yIndex);
                
                // 借星逻辑用于标签判断
                const mStars = _getStars(yPalace);
                const dStars = _getStars(astrolabe.palace((yIndex+6)%12));
                const finalStars = mStars.length > 0 ? mStars : dStars;
                const starKey = finalStars.length > 0 ? finalStars[0].name : 'empty';
                
                // 1. 标题
                document.getElementById('yearTitle').innerText = `${currentYear} ${yearStem}${yearlyScope.yearly.earthlyBranch}年`;
                document.getElementById('yearSub').innerText = `流年命宫 · ${yPalace.name}`;

                // 2. 标签
                const yearLogic = TIME_LOGIC[starKey] || {text:'今年运势平稳，按部就班。重点在于利用三方资源。', tag:'平稳·积累'};
                let tagHtml = `<span class="year-tag yt-purple">${yearLogic.tag}</span>`;
                const allNames = finalStars.map(s=>s.name);
                if(allNames.some(n=>n.includes('杀')||n.includes('破'))) tagHtml += `<span class="year-tag yt-blue">变动</span>`;
                if(allNames.some(n=>n.includes('桃')||n.includes('红'))) tagHtml += `<span class="year-tag yt-blue">桃花</span>`;
                document.getElementById('yearTags').innerHTML = tagHtml;

                // 3. 核心解读
                let coreText = yearLogic.text;
                const minors = _getMinors(yPalace).map(s=>s.name);
                // 流年煞星提示
                if(minors.includes('化忌')) coreText += " <br><b>⚠️ 特别注意：</b>流年化忌入命，凡事多阻碍，心态易纠结，宜守不宜攻。";
                else if(minors.includes('擎羊') || minors.includes('火星')) coreText += " <br><b>⚠️ 特别注意：</b>煞星入命，脾气较大或突发状况多，注意防受伤和口舌。";
                document.getElementById('yearCoreText').innerHTML = coreText;

                // 4. 流年四化 (使用流年天干)
                const sihua = SI_HUA_MAP[yearStem] || {};
                let sihuaHTML = '';
                astrolabe.palaces.forEach(p => {
                    p.majorStars.forEach(star => {
                        if (sihua[star.name]) {
                            const type = sihua[star.name];
                            // 只显示三方四正的四化，或者全部显示
                            // 这里简单点，显示化忌在哪里，化禄在哪里
                            const flowNames = ['命','父','福','田','官','友','迁','疾','财','子','夫','兄'];
                            // 计算流年盘的相对宫位
                            const relIdx = (p.index - yIndex + 12) % 12;
                            if(type==='忌' || type==='禄') {
                                const color = type==='忌'?'text-rose-600 font-bold':'text-emerald-600';
                                sihuaHTML += `<div>${star.name}化${type} <span class="${color}">入流年${flowNames[relIdx]}</span></div>`;
                            }
                        }
                    });
                });
                document.getElementById('yearSiHua').innerHTML = sihuaHTML || '无重要四化入三方';
                
                // 5. 三方支援
                const cai = astrolabe.palace((yIndex+4)%12);
                const guan = astrolabe.palace((yIndex+8)%12);
                const getStarStr = (p) => {
                    const s = _getStars(p);
                    if(s.length>0) return s.map(x=>x.name).join('');
                    return '借'+_getStars(astrolabe.palace((p.index+6)%12)).map(x=>x.name).join('');
                }
                document.getElementById('yearSanFang').innerHTML = `
                    <div>流财：${getStarStr(cai)}</div>
                    <div>流官：${getStarStr(guan)}</div>
                `;
            }

            // --- 流月 (敏感算法复刻) ---
            const container = document.getElementById('monthlyForecast');
            container.innerHTML = '';
            
            for (let i = 0; i < 3; i++) {
                const fDate = new Date(); fDate.setMonth(now.getMonth() + i);
                const year = fDate.getFullYear();
                const month = fDate.getMonth() + 1;
                const fStr = `${year}-${String(month).padStart(2,'0')}-15 12:00:00`;
                
                let scope; try { scope = astrolabe.horoscope(fStr); } catch(e) { continue; }

                if (scope && scope.monthly) {
                    const mPalace = astrolabe.palace(scope.monthly.index);
                    const allStars = [...mPalace.majorStars, ...mPalace.minorStars];
                    const names = allStars.map(s => s.name);
                    
                    // 状态判定
                    let st = { label: '平稳过渡', css: 'st-safe', icon: '<i class="fas fa-coffee"></i>' };
                    if (names.includes('化忌') || (names.includes('地空') && names.includes('地劫'))) {
                        st = { label: '严阵以待', css: 'st-danger', icon: '<i class="fas fa-exclamation-triangle"></i>' };
                    } else if (names.some(n=>['火星','铃星','擎羊','陀罗'].includes(n))) {
                        st = { label: '忙碌纠结', css: 'st-busy', icon: '<i class="fas fa-fire"></i>' };
                    } else if (names.some(n=>['贪狼','廉贞','红鸾','天喜'].includes(n))) {
                        st = { label: '社交桃花', css: 'st-social', icon: '<i class="fas fa-glass-cheers"></i>' };
                    } else if (names.some(n=>['紫微','天府','化禄','化权'].includes(n))) {
                        st = { label: '吉星高照', css: 'st-good', icon: '<i class="fas fa-star"></i>' };
                    }

                    // 动态评语
                    let patternTitle = "本月格局";
                    let patternDesc = "运势平稳，按部就班。";
                    if (names.includes('化忌')) { patternTitle = "化忌冲守"; patternDesc = "阻碍较多，心情郁闷，宜守不宜攻，凡事看开。"; }
                    else if (names.includes('天马')) { patternTitle = "天马行空"; patternDesc = "在外奔波多，身体累但心情不错，利于出差旅游。"; }
                    else if (mPalace.majorStars.length === 0) { patternTitle = "命无正曜"; patternDesc = "心绪不宁，容易受环境左右，建议不要做重大决定。"; }

                    // 胶囊
                    const renderPills = (list, css) => list.map(n => {
                        const trait = STAR_TRAITS[n] || '';
                        return `<span class="star-pill ${css}">${n} <span class="star-sub">${trait.split('/')[0]}</span></span>`;
                    }).join('');
                    
                    const goods = names.filter(n => LUCKY_STARS.some(ls=>n.includes(ls)));
                    const bads = names.filter(n => UNLUCKY_STARS.some(us=>n.includes(us)));

                    // 农历显示
                    let lunarText = scope.lunarDate ? (LUNAR_MAP[scope.lunarDate.month - 1] || scope.lunarDate.month) : "未知";

                    const card = document.createElement('div');
                    card.className = 'moon-card fade-in';
                    card.innerHTML = `
                        <div class="moon-header">
                            <div>
                                <h2 class="text-lg font-bold text-slate-800">${year}年${month}月</h2>
                                <div class="text-xs text-slate-400">农历${lunarText}月 · ${mPalace.name}</div>
                            </div>
                            <div class="moon-status ${st.css}">${st.icon} ${st.label}</div>
                        </div>
                        <div class="pattern-box">
                            <span class="pattern-title">${patternTitle}</span>
                            <span class="pattern-desc">${patternDesc}</span>
                        </div>
                        <div class="mb-2">
                            <div class="text-xs font-bold text-emerald-600 mb-1">吉象</div>
                            <div>${renderPills(goods, 'pill-good') || '<span class="text-xs text-gray-300">无明显吉星</span>'}</div>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-rose-600 mb-1">凶象</div>
                            <div>${renderPills(bads, 'pill-bad') || '<span class="text-xs text-gray-300">无明显凶星</span>'}</div>
                        </div>
                        <div class="action-grid">
                            <div class="act-item"><div class="act-icon bg-emerald-500"><i class="fas fa-check"></i></div>宜：${getAdvice(names, 'yi')}</div>
                            <div class="act-item"><div class="act-icon bg-rose-500"><i class="fas fa-times"></i></div>忌：${getAdvice(names, 'ji')}</div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
        }

        function switchTab(id) {
            ['tab1','tab2'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        (function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1940; i--) y.add(new Option(i+'年', i));
            y.value = 1995; for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=15;
        })();
    </script>
</body>
</html>
