            '太阴': { text: '今年是“内修年”。利于理财、美容、家居生活。男性异性缘佳。', tag: '财富·内务' },
            '贪狼': { text: '今年是“欲望年”。利于学习才艺、交际应酬，但忌投机。', tag: '应酬·欲望' },
            '巨门': { text: '今年是“口舌年”。利于演讲、教学、谈判。否则易招惹是非。', tag: '口才·是非' },
            '天相': { text: '今年是“辅助年”。适合做副手、中间人。能得贵人提拔。', tag: '辅助·人缘' },
            '天梁': { text: '今年是“解厄年”。先难后易，适合通过解决麻烦来体现价值。', tag: '清高·解难' },
            '七杀': { text: '今年是“冲刺年”。宜动不宜静，压力大，但突破也大。注意受伤。', tag: '魄力·突破' },
            '破军': { text: '今年是“破立年”。不破不立，可能会换工作或大额消费。', tag: '创新·消耗' }
        };

        const SI_HUA_MAP = {
            '甲': { '廉贞': '禄', '破军': '权', '武曲': '科', '太阳': '忌' },
            '乙': { '天机': '禄', '天梁': '权', '紫微': '科', '太阴': '忌' },
            '丙': { '天同': '禄', '天机': '权', '文昌': '科', '廉贞': '忌' },
            '丁': { '太阴': '禄', '天同': '权', '天机': '科', '巨门': '忌' },
            '戊': { '贪狼': '禄', '太阴': '权', '右弼': '科', '天机': '忌' },
            '己': { '武曲': '禄', '贪狼': '权', '天梁': '科', '文曲': '忌' },
            '庚': { '太阳': '禄', '武曲': '权', '太阴': '科', '天同': '忌' },
            '辛': { '巨门': '禄', '太阳': '权', '文曲': '科', '文昌': '忌' },
            '壬': { '天梁': '禄', '紫微': '权', '左辅': '科', '武曲': '忌' },
            '癸': { '破军': '禄', '巨门': '权', '太阴': '科', '贪狼': '忌' }
        };

        const CITY_LONGITUDES={'北京':116.40,'上海':121.47,'广州':113.23,'深圳':114.05,'成都':104.06,'武汉':114.31,'西安':108.95,'周口':114.65,'郑州':113.65};
        const LUCKY_STARS = ['紫微','天府','太阳','太阴','天相','天梁','天同','左辅','右弼','天魁','天钺','文昌','文曲','化禄','化权','化科','禄存'];
        const UNLUCKY_STARS = ['擎羊','陀罗','火星','铃星','地空','地劫','化忌','七杀','破军','廉贞','贪狼','巨门'];

        // === 2. 核心函数 ===

        function _getStars(p) { return p?.majorStars || []; }
        function _getMinors(p) { return p?.minorStars || []; }
        
        function _analyzeStars(palace, astrolabe) {
            if (!palace) return { stars: [], type: 'error', starStr: '未知' };
            const majors = _getStars(palace);
            if (majors.length > 0) {
                const names = majors.map(s => s.name);
                return { stars: majors, type: 'solid', key: names.join('+'), starStr: names.join('、') };
            }
            // 借对宫
            const duiIdx = (palace.index + 6) % 12;
            const duiPalace = astrolabe.palace(duiIdx);
            const duiMajors = _getStars(duiPalace);
            const names = duiMajors.map(s => s.name);
            const comboKey = names.join('+') || '无主星';
            return { stars: duiMajors, type: 'empty', key: comboKey, starStr: names.join('、'), duiName: duiPalace.name };
        }

        // V30 智能文案生成器 (核心逻辑更新)
        function synthesize(data, category) {
            let text = "";
            
            // 1. 精确匹配组合 (如天同+天梁)
            if (COMBO_LOGIC[data.key]) {
                if (COMBO_LOGIC[data.key][category]) return COMBO_LOGIC[data.key][category];
                if (COMBO_LOGIC[data.key]['base']) return COMBO_LOGIC[data.key]['base'];
            }
            
            // 2. 智能拼接 (针对未收录的组合，如太阳+巨门)
            // 遍历所有主星，提取对应类别的描述
            let descriptions = [];
            data.stars.forEach(s => {
                const info = STAR_DETAILS[s.name];
                if (info) {
                    if (category === 'base' && info.desc) descriptions.push(`<b>${s.name}：</b>${info.desc}`);
                    else if (category === 'career' && info.career) descriptions.push(`<b>${s.name}：</b>${info.career}`);
                    else if (category === 'love' && info.love) descriptions.push(`<b>${s.name}：</b>${info.love}`);
                }
            });

            if (descriptions.length > 0) {
                text = descriptions.join('<br>');
            } else {
                // 3. 兜底逻辑
                data.stars.forEach(s => {
                    const trait = STAR_TRAITS_SIMPLE[s.name];
                    if (trait) text += `<b>${s.name}</b>主${trait}。`;
                });
            }

            if (data.type === 'empty') {
                text = `(本宫无主星，借对宫【${data.starStr}】) <br>` + text;
                text += `<br><span class="text-xs text-slate-500">注：借星安宫意味着该领域力量较弱，更容易受外部环境或对方（对宫）的影响。</span>`;
            }
            
            return text || "星象组合较为复杂，建议结合具体四化分析。";
        }

        function calculate() {
            if (typeof iztro === 'undefined') { alert("资源加载中..."); return; }
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                let lng = 120; for(let c in CITY_LONGITUDES) if(loc.includes(c)) lng=CITY_LONGITUDES[c];
                const offset = (lng - 120) * 4;
                const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
                dateObj.setMinutes(dateObj.getMinutes() + offset);
                let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;
                
                document.getElementById('solarHint').innerText = `✅ 真太阳时: ${loc} (${lng>120?'+':''}${Math.round(offset)}分)`;

                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                renderProfile(astrolabe);
                renderFortune(astrolabe, parseInt(y));

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1');

            } catch(e) { console.error(e); alert('排盘错误: ' + e.message); }
        }

        // === Tab 1: 全息画像 (内容增强版) ===
        function renderProfile(astrolabe) {
            const pMing = astrolabe.palaces.find(p=>p.name==='命宫');
            const pGuan = astrolabe.palaces.find(p=>p.name==='官禄');
            const pCai = astrolabe.palaces.find(p=>p.name==='财帛');
            const pFu = astrolabe.palaces.find(p=>p.name==='夫妻');

            const dMing = _analyzeStars(pMing, astrolabe);
            const dGuan = _analyzeStars(pGuan, astrolabe);
            const dCai = _analyzeStars(pCai, astrolabe);
            const dFu = _analyzeStars(pFu, astrolabe);

            // 1. 命宫
            let mingHTML = `<p>您是<span class="keyword">${dMing.starStr}</span>坐命。`;
            mingHTML += `<div class="mt-2">${synthesize(dMing, 'base')}</div>`;
            
            // 动态建议生成
            let advice = "发挥您的主星优势，扬长避短。";
            if(dMing.key.includes('机')) advice = "思维太快易焦虑，建议多冥想，注意神经系统保养。";
            else if(dMing.key.includes('同')) advice = "福气虽好但易懒散，逼自己一把，将人缘转化为资源。";
            else if(dMing.key.includes('杀')||dMing.key.includes('破')) advice = "一生变动大，宜动不宜静，学一门过硬的技术傍身。";
            else if(dMing.type === 'empty') advice = "多听取他人建议，不要固执己见，找一个强大的平台依附。";

            mingHTML += `<div class="suggestion-box">💡 <b>发展建议：</b>${advice}</div>`;
            document.getElementById('logicMing').innerHTML = mingHTML;

            // 2. 财官
            let careerHTML = `<p><b>格局判断：</b>您的事业宫（${dGuan.starStr}）与财帛宫（${dCai.starStr}）互动。</p>`;
            if (dGuan.type === 'empty' && dCai.type === 'empty') careerHTML += `<p><b>“双空”格局：</b>事业财富变数大，适合自由职业、中介或依附大平台。</p>`;
            else careerHTML += `<div class="mt-2">${synthesize(dCai, 'career')}</div>`; // 使用career库
            
            if (_getMinors(pCai).some(s=>s.name==='擎羊')) careerHTML += `<p class="highlight mt-2">注意：财帛宫有擎羊，代表赚的都是辛苦钱，或易因冲动投资破财。</p>`;
            document.getElementById('logicCareer').innerHTML = careerHTML;

            // 3. 婚姻
            let loveHTML = `<p><b>缘分逻辑：</b>夫妻宫坐${dFu.starStr}。</p>`;
            loveHTML += `<div class="mt-2">${synthesize(dFu, 'love')}</div>`;
            if (dFu.key.includes('阳') && dFu.key.includes('梁')) loveHTML += `<div class="special-tip"><b>提示：</b>阳梁在夫妻，配偶正直有名望，但感情像亲情，少浪漫。</div>`;
            else if (dFu.stars.some(s=>s.name==='巨门')) loveHTML += `<div class="special-tip"><b>提示：</b>巨门入夫妻，口舌是非多，相处之道在于少说多做，或聚少离多。</div>`;
            document.getElementById('logicLove').innerHTML = loveHTML;
        }

        // === Tab 2: 流年与流月 (V29 逻辑保持不变) ===
        function renderFortune(astrolabe, birthYear) {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            // 流年
            const yearStr = currentYear + '-06-01 12:00:00'; 
            let yearlyScope; try { yearlyScope = astrolabe.horoscope(yearStr); } catch(e){}

            if (yearlyScope && yearlyScope.yearly) {
                const yearStem = yearlyScope.yearly.heavenlyStem;
                const yIndex = yearlyScope.yearly.index;
                const yPalace = astrolabe.palace(yIndex);
                const yStars = _analyzeStars(yPalace, astrolabe);

                document.getElementById('yearTitle').innerText = `${currentYear} ${yearStem}${yearlyScope.yearly.earthlyBranch}年`;
                document.getElementById('yearSub').innerText = `流年命宫 · ${yPalace.name}`;

                let tagHtml = '';
                const starKey = yStars.type==='empty'?'empty': (yStars.stars[0]?.name || 'empty');
                const yearLogic = TIME_LOGIC[starKey] || {text:'运势平稳，按部就班。', tag:'平稳·积累'};
                tagHtml += `<span class="year-tag yt-purple">${yearLogic.tag}</span>`;
                if(yStars.key.includes('杀')||yStars.key.includes('破')) tagHtml += `<span class="year-tag yt-blue">变动</span>`;
                if(yStars.key.includes('桃')||yStars.key.includes('红')) tagHtml += `<span class="year-tag yt-blue">桃花</span>`;
                document.getElementById('yearTags').innerHTML = tagHtml;

                let coreText = yearLogic.text;
                const minors = _getMinors(yPalace).map(s=>s.name);
                if(minors.includes('化忌')) coreText += " <br><b>注意：</b>流年化忌，凡事多阻碍，宜守不宜攻。";
                document.getElementById('yearCoreText').innerHTML = coreText;

                const sihua = SI_HUA_MAP[yearStem] || {};
                let sihuaHTML = '';
                astrolabe.palaces.forEach(p => {
                    p.majorStars.forEach(star => {
                        if (sihua[star.name]) {
                            const type = sihua[star.name];
                            if(type==='忌' || [0,4,8,6].includes((p.index - yIndex + 12)%12)) {
                                const idx = (p.index - yIndex + 12) % 12;
                                const names = ['命','父','福','田','官','友','迁','疾','财','子','夫','兄'];
                                const color = type==='忌'?'text-red-500 font-bold':'text-green-600';
                                sihuaHTML += `<div>${star.name}化${type} <span class="${color}">入${names[idx]}</span></div>`;
                            }
                        }
                    });
                });
                document.getElementById('yearSiHua').innerHTML = sihuaHTML || '无重要四化';
                document.getElementById('yearSanFang').innerHTML = `<div>财：${_analyzeStars(astrolabe.palace((yIndex+4)%12),astrolabe).starStr}</div><div>官：${_analyzeStars(astrolabe.palace((yIndex+8)%12),astrolabe).starStr}</div>`;
            }

            // 流月
            const container = document.getElementById('monthlyForecast');
            container.innerHTML = '';
            const LUNAR_MAP = ["正","二","三","四","五","六","七","八","九","十","十一","十二"];

            for (let i = 0; i < 3; i++) {
                const fDate = new Date(); fDate.setMonth(now.getMonth() + i);
                const fStr = `${fDate.getFullYear()}-${String(fDate.getMonth()+1).padStart(2,'0')}-15 12:00:00`;
                let scope; try { scope = astrolabe.horoscope(fStr); } catch(e) { continue; }

                if (scope && scope.monthly) {
                    const mPalace = astrolabe.palace(scope.monthly.index);
                    const allStars = [...mPalace.majorStars, ...mPalace.minorStars];
                    const names = allStars.map(s => s.name);
                    
                    let st = { label: '平稳过渡', css: 'st-safe', icon: '<i class="fas fa-coffee"></i>' };
                    if (names.includes('化忌')) st = { label: '严阵以待', css: 'st-danger', icon: '<i class="fas fa-exclamation-triangle"></i>' };
                    else if (names.some(n=>['火星','铃星','擎羊','陀罗'].includes(n))) st = { label: '忙碌焦躁', css: 'st-busy', icon: '<i class="fas fa-fire"></i>' };
                    else if (names.some(n=>['紫微','天府','化禄'].includes(n))) st = { label: '吉星高照', css: 'st-good', icon: '<i class="fas fa-star"></i>' };

                    let lunarText = "未知";
                    if (scope.lunarDate) lunarText = LUNAR_MAP[scope.lunarDate.month - 1] || scope.lunarDate.month;

                    const renderPills = (list, css) => list.map(n => `<span class="star-pill ${css}">${n} <span class="star-sub">${(STAR_TRAITS_SIMPLE[n]||'').split('/')[0]}</span></span>`).join('');
                    const goods = names.filter(n => LUCKY_STARS.some(ls=>n.includes(ls)));
                    const bads = names.filter(n => UNLUCKY_STARS.some(us=>n.includes(us)));

                    const card = document.createElement('div');
                    card.className = 'moon-card fade-in';
                    card.innerHTML = `
                        <div class="moon-header">
                            <div>
                                <h2 class="text-lg font-bold text-slate-800">${fDate.getFullYear()}年${fDate.getMonth()+1}月</h2>
                                <div class="text-xs text-slate-400">农历${lunarText}月 · ${mPalace.name}</div>
                            </div>
                            <div class="moon-status ${st.css}">${st.icon} ${st.label}</div>
                        </div>
                        <div class="mb-2">
                            <div class="text-xs font-bold text-emerald-600 mb-1">吉象</div>
                            <div>${renderPills(goods, 'pill-good') || '<span class="text-xs text-gray-300">无</span>'}</div>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-rose-600 mb-1">凶象</div>
                            <div>${renderPills(bads, 'pill-bad') || '<span class="text-xs text-gray-300">无</span>'}</div>
                        </div>
                        <div class="action-grid">
                            <div class="act-item"><div class="act-icon bg-emerald-500"><i class="fas fa-check"></i></div>宜：${getAdvice(names, 'yi')}</div>
                            <div class="act-item"><div class="act-icon bg-rose-500"><i class="fas fa-times"></i></div>忌：${getAdvice(names, 'ji')}</div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
        }

        function getAdvice(stars, type) {
            const DICT = { '天机':{yi:'策划',ji:'纠结'}, '太阳':{yi:'社交',ji:'过劳'}, '武曲':{yi:'理财',ji:'借钱'}, '天同':{yi:'聚餐',ji:'懒散'}, '廉贞':{yi:'公关',ji:'官非'}, '贪狼':{yi:'应酬',ji:'投机'}, '巨门':{yi:'演讲',ji:'吵架'}, '七杀':{yi:'冲刺',ji:'受伤'}, '破军':{yi:'创新',ji:'破财'}, '天马':{yi:'出差',ji:'安逸'}, '擎羊':{yi:'果断',ji:'发火'}, '化忌':{yi:'低调',ji:'逞强'}, '化禄':{yi:'投资',ji:'浪费'} };
            for(let s of stars) {
                if(DICT[s]) return DICT[s][type];
                const key = Object.keys(DICT).find(k => s.includes(k));
                if(key) return DICT[key][type];
            }
            return type==='yi'?'安分':'冒险';
        }

        function switchTab(id) {
            ['tab1','tab2'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        (function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1940; i--) y.add(new Option(i+'年', i));
            y.value = 1995; for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=15;
        })();
    </script>
</body>
