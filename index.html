<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>紫微斗数 - 全能详解版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/iztro@2.5.3/dist/iztro.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        select { -webkit-appearance: none; appearance: none; background-color: #fff; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3E%3Cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3E%3C/svg%3E"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem; }
        .tab-active { color: #4f46e5; border-bottom: 2px solid #4f46e5; font-weight: bold; }
        .tab-inactive { color: #64748b; }
        .star-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin-right: 4px; margin-bottom: 4px; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen pb-20 flex flex-col items-center">

    <!-- 顶部 -->
    <div class="w-full bg-slate-900 p-6 text-center text-white shadow-lg sticky top-0 z-20">
        <h1 class="text-lg font-bold tracking-wide">🔮 紫微斗数 · 全能版</h1>
        <p class="text-xs text-slate-400 mt-1">v15.1 修复报错 · 字典补全</p>
    </div>

    <div class="w-full max-w-md p-4 space-y-4">
        
        <!-- 输入卡片 -->
        <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-100">
            <div class="flex flex-col space-y-3">
                <!-- 姓名 & 历史 -->
                <div class="flex gap-2">
                    <input type="text" id="userName" placeholder="姓名(选填)" class="w-2/3 border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    <button onclick="toggleHistory()" class="w-1/3 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">📂 历史记录</button>
                </div>
                <!-- 历史列表(默认隐藏) -->
                <div id="historyPanel" class="hidden bg-slate-50 p-2 rounded-lg text-xs space-y-2 max-h-40 overflow-y-auto"></div>

                <!-- 日期 -->
                <div class="flex space-x-2">
                    <select id="selYear" class="w-[38%] border border-slate-300 rounded-lg px-3 py-2 text-sm h-10"></select>
                    <select id="selMonth" class="w-[30%] border border-slate-300 rounded-lg px-3 py-2 text-sm h-10"></select>
                    <select id="selDay" class="w-[32%] border border-slate-300 rounded-lg px-3 py-2 text-sm h-10"></select>
                </div>
                <!-- 时间 & 性别 -->
                <div class="flex space-x-2">
                    <input type="time" id="birthTime" value="12:00" class="w-2/3 border border-slate-300 rounded-lg px-3 py-2 text-sm h-10">
                    <select id="gender" class="w-1/3 border border-slate-300 rounded-lg px-3 py-2 text-sm h-10">
                        <option value="女">女</option>
                        <option value="男">男</option>
                    </select>
                </div>
                <!-- 城市 -->
                <input type="text" id="location" placeholder="出生地 (如: 河南周口)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm h-10">
                
                <button id="calcBtn" onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition">
                    🚀 开始全盘解析
                </button>
                <p id="solarTimeHint" class="text-[10px] text-slate-400 text-center"></p>
            </div>
        </div>

        <!-- 结果区域 -->
        <div id="resultArea" class="hidden space-y-4">
            
            <!-- 导航栏 -->
            <div class="bg-white rounded-xl shadow-sm p-1 flex justify-around text-sm sticky top-[80px] z-10">
                <button onclick="switchTab('tab1')" id="btn-tab1" class="tab-active flex-1 py-2 text-center">人生底色</button>
                <button onclick="switchTab('tab2')" id="btn-tab2" class="tab-inactive flex-1 py-2 text-center">十二宫详解</button>
                <button onclick="switchTab('tab3')" id="btn-tab3" class="tab-inactive flex-1 py-2 text-center">运势预测</button>
            </div>

            <!-- Tab 1: 人生底色 -->
            <div id="tab1" class="space-y-4 fade-in">
                <div id="fateBasic" class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-purple-500"></div>
                <div id="fateLaiYin" class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-amber-500"></div>
                <div id="fateSiHua" class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-blue-500"></div>
            </div>

            <!-- Tab 2: 十二宫详解 -->
            <div id="tab2" class="hidden space-y-4 fade-in">
                <div class="text-xs text-slate-400 text-center mb-2">👇 深度扫描您人生的十二个领域 👇</div>
                <div id="palacesList" class="grid grid-cols-1 gap-3"></div>
            </div>

            <!-- Tab 3: 运势 -->
            <div id="tab3" class="hidden space-y-4 fade-in">
                <div id="decadeFortune" class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl shadow-lg p-5 text-white"></div>
                <div class="text-sm font-bold text-slate-500 mt-4 pl-2 border-l-4 border-slate-300">未来三个月流月指引</div>
                <div id="forecastContent" class="space-y-4"></div>
            </div>

        </div>
    </div>

    <script>
        // 全局错误捕获 (防崩溃)
        window.onerror = function(msg, url, line) {
            alert("程序遇到问题，请截图:\n" + msg);
            return true;
        };

        // === 1. 数据字典 (补全缺失变量) ===
        const CITY_LONGITUDES = {'北京':116.40,'上海':121.47,'天津':117.20,'重庆':106.55,'周口':114.65,'郑州':113.62,'开封':114.30,'武汉':114.31,'长沙':112.93,'广州':113.26,'深圳':114.05,'成都':104.06,'西安':108.93,'南京':118.78,'杭州':120.15,'沈阳':123.43,'哈尔滨':126.63,'济南':117.02,'香港':114.16,'台北':121.50,'河南':113.62};
        
        // **补全：命宫主星关键词 (用于Tab2详解)**
        const MING_STAR_KEYWORDS = {
            '紫微': '尊贵/领导/爱面子', '天机': '智慧/谋略/变动', '太阳': '博爱/公益/奔波', '武曲': '刚毅/执行/财星', '天同': '福气/享乐/温和', '廉贞': '交际/原则/桃花',
            '天府': '财库/稳重/保守', '太阴': '细腻/内敛/财富', '贪狼': '欲望/多才/圆滑', '巨门': '口才/是非/暗昧', '天相': '辅助/公正/形象', '天梁': '荫庇/原则/长者', '七杀': '肃杀/冲劲/孤独', '破军': '先破后立/变动'
        };

        // **补全：身宫解释**
        const BODY_PALACE_DESC = {'命宫': '【命运自主】身命同宫，主观性强，命运掌握在自己手里。', '夫妻宫': '【情缘为重】受婚姻感情影响大，配偶是关键贵人。', '财帛宫': '【财富至上】看重经济基础，中晚年为钱忙碌，财运佳。', '迁移宫': '【动荡人生】注定在外奔波，闲不住，适应环境能力强。', '官禄宫': '【事业为本】工作狂，事业心极强，通过成就感获得满足。', '福德宫': '【享受生活】重视精神享受和兴趣，晚运不错，懂生活。'};

        // **补全：来因宫解释**
        const LAI_YIN_DESC = {'命宫': '【自力更生】凡事亲力亲为。', '兄弟宫': '【手足助力】靠合作或借贷起家。', '夫妻宫': '【成也萧何】运势随婚姻而变。', '子女宫': '【合伙奔波】因子女或桃花变动。', '财帛宫': '【金钱至上】赚钱欲望强，适合经商。', '疾厄宫': '【身心磨练】靠技术手艺赚钱。', '迁移宫': '【动中求财】利于外出，离家越远越好。', '交友宫': '【众生之缘】靠人脉经营，适合服务业。', '官禄宫': '【事业为本】工作狂，重视名声。', '田宅宫': '【家运兴衰】适合不动产，重视家庭。', '福德宫': '【因果福报】有祖荫，靠兴趣赚钱。', '父母宫': '【公家之缘】长辈提拔，适合公职。'};

        // 宫位模板
        const PALACE_TEMPLATE = {
            '财帛宫': { icon: '💰', title: '财富运势', desc: '如何赚钱、理财能力' },
            '官禄宫': { icon: '💼', title: '事业前程', desc: '工作类型、职位升迁' },
            '夫妻宫': { icon: '💕', title: '婚姻情感', desc: '配偶特征、相处模式' },
            '迁移宫': { icon: '✈️', title: '外出机遇', desc: '出差、旅游、对外关系' },
            '疾厄宫': { icon: '🏥', title: '健康体质', desc: '身体隐患、情绪管理' },
            '福德宫': { icon: '🍀', title: '精神享受', desc: '兴趣爱好、内心世界' },
            '父母宫': { icon: '👪', title: '长辈关系', desc: '父母缘分、上司提拔' },
            '兄弟宫': { icon: '🤝', title: '人际助力', desc: '兄弟闺蜜、合作伙伴' },
            '子女宫': { icon: '👶', title: '子女晚辈', desc: '子女教育、桃花运' },
            '交友宫': { icon: '🌐', title: '社交人脉', desc: '朋友部下、众生缘' },
            '田宅宫': { icon: '🏠', title: '家宅资产', desc: '不动产、居住环境' },
            '命宫': { icon: '🧬', title: '核心本我', desc: '性格特质、命运总纲' }
        };

        const SHI_GAN_SI_HUA = {'甲':['廉贞','破军','武曲','太阳'],'乙':['天机','天梁','紫微','太阴'],'丙':['天同','天机','文昌','廉贞'],'丁':['太阴','天同','天机','巨门'],'戊':['贪狼','太阴','右弼','天机'],'己':['武曲','贪狼','天梁','文曲'],'庚':['太阳','武曲','太阴','天同'],'辛':['巨门','太阳','文曲','文昌'],'壬':['天梁','紫微','左辅','武曲'],'癸':['破军','巨门','太阴','贪狼']};

        // === 2. 逻辑代码 ===
        const HISTORY_KEY = 'ziwei_history_v2';

        function init() {
            const selYear = document.getElementById('selYear'), selMonth = document.getElementById('selMonth'), selDay = document.getElementById('selDay');
            const currentYear = new Date().getFullYear();
            for(let i = currentYear; i >= 1930; i--) selYear.add(new Option(i + '年', i));
            selYear.value = 1990;
            for(let i = 1; i <= 12; i++) selMonth.add(new Option(i + '月', i));
            
            const updateDays = () => {
                const y = parseInt(selYear.value), m = parseInt(selMonth.value), days = new Date(y, m, 0).getDate();
                selDay.innerHTML = ''; for(let i=1;i<=days;i++) selDay.add(new Option(i+'日', i));
            };
            selYear.onchange = selMonth.onchange = updateDays; updateDays();
            loadHistory();
        }

        function calculate() {
            const y = document.getElementById('selYear').value, m = document.getElementById('selMonth').value.padStart(2,'0'), d = document.getElementById('selDay').value.padStart(2,'0');
            const timeStr = document.getElementById('birthTime').value, location = document.getElementById('location').value || '', genderVal = document.getElementById('gender').value;
            const name = document.getElementById('userName').value.trim() || '未命名';

            if(!timeStr) { alert("请选择出生时间"); return; }

            saveRecord({name, y, m, d, time:timeStr, loc:location, gender:genderVal});

            const btn = document.getElementById('calcBtn');
            btn.innerText = "🔮 正在排盘..."; btn.disabled = true;

            setTimeout(() => {
                try {
                    let longitude = 120; for (let city in CITY_LONGITUDES) { if (location.includes(city)) longitude = CITY_LONGITUDES[city]; }
                    const offset = (longitude - 120) * 4, dt = new Date(`${y}-${m}-${d}T${timeStr}:00`);
                    dt.setMinutes(dt.getMinutes() + offset);
                    const h = dt.getHours(); let timeIndex = Math.floor((h+1)/2); if(timeIndex>=12) timeIndex=0;
                    
                    document.getElementById('solarTimeHint').innerText = `*真太阳时: ${String(h).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;

                    if (typeof iztro === 'undefined') throw new Error("算法库加载失败，请刷新页面");

                    const gender = genderVal === '男' ? '男' : '女';
                    const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                    renderTab1(astrolabe, parseInt(y));
                    renderTab2(astrolabe);
                    renderTab3(astrolabe, `${y}-${m}-${d}`);

                    document.getElementById('resultArea').classList.remove('hidden');
                    switchTab('tab1'); 
                    document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});

                } catch(e) { alert("出错：" + e.message); }
                finally { btn.innerText = "🚀 开始全盘解析"; btn.disabled = false; }
            }, 300);
        }

        // --- 渲染逻辑 ---

        function renderTab1(astrolabe, birthYear) {
            const pMing = astrolabe.palaces.find(p => p.name === '命宫');
            const pShen = astrolabe.palaces.find(p => p.isBodyPalace) || { name: '命宫' };
            
            const stems = ['庚', '辛', '壬', '癸', '甲', '乙', '丙', '丁', '戊', '己'];
            const birthStem = stems[birthYear % 10];
            const laiYin = astrolabe.palaces.find(p => p.heavenlyStem === birthStem) || pMing;
            
            // 安全获取描述，防止undefined
            const fixName = (name) => name.endsWith('宫') ? name : name + '宫';
            const laiYinText = LAI_YIN_DESC[fixName(laiYin.name)] || "命盘根基所在。";
            const shenText = BODY_PALACE_DESC[fixName(pShen.name)] || "身宫代表后天运势。";

            const mingStars = pMing.majorStars.map(s => s.name).join('、') || '无主星(借对宫)';
            document.getElementById('fateBasic').innerHTML = `
                <h3 class="font-bold text-purple-900 mb-2">🧬 命身构架</h3>
                <div class="text-sm text-slate-600 space-y-2">
                    <p><strong>命宫 (${pMing.earthlyBranch})：</strong>主星【${mingStars}】。代表您的性格底色和天赋。</p>
                    <div class="bg-purple-50 p-2 rounded text-xs leading-relaxed text-purple-800">
                        <strong>身宫在【${pShen.name}】：</strong>${shenText}
                    </div>
                </div>
            `;

            document.getElementById('fateLaiYin').innerHTML = `
                <h3 class="font-bold text-amber-900 mb-2">🗝️ 前世因果 (来因宫)</h3>
                <p class="text-sm text-slate-600 mb-1">落在<strong>【${laiYin.name}】</strong></p>
                <p class="text-xs text-amber-800 leading-relaxed">${laiYinText}</p>
            `;

            const sihua = SHI_GAN_SI_HUA[birthStem];
            const types = ['禄 (财/缘)','权 (权/变)','科 (名/贵)','忌 (欠/冲)'];
            let html = '<h3 class="font-bold text-blue-900 mb-2">🌟 一生重点 (生年四化)</h3><div class="grid grid-cols-2 gap-2">';
            sihua.forEach((star, i) => {
                let pname = '未知';
                astrolabe.palaces.forEach(p => { if([...p.majorStars,...p.minorStars].some(s=>s.name===star)) pname=p.name; });
                html += `<div class="bg-blue-50 p-2 rounded text-xs"><span class="font-bold text-blue-700">${star}化${types[i][0]}</span> <span class="text-slate-400">-></span> ${pname}</div>`;
            });
            html += '</div>';
            document.getElementById('fateSiHua').innerHTML = html;
        }

        function renderTab2(astrolabe) {
            const container = document.getElementById('palacesList');
            container.innerHTML = '';
            const order = ['命宫','财帛宫','官禄宫','夫妻宫','迁移宫','福德宫','田宅宫','疾厄宫','父母宫','子女宫','兄弟宫','交友宫'];

            order.forEach(name => {
                const p = astrolabe.palaces.find(item => item.name === name);
                if(!p) return;

                const major = p.majorStars.map(s => `<span class="star-tag bg-red-100 text-red-700">${s.name}</span>`).join('');
                const minor = p.minorStars.filter(s=>['文昌','文曲','左辅','右弼','天魁','天钺','禄存','擎羊','陀罗','火星','铃星'].includes(s.name)).map(s => `<span class="star-tag bg-blue-50 text-blue-600">${s.name}</span>`).join('');
                
                // 修复：确保 MING_STAR_KEYWORDS 存在
                const keywords = p.majorStars.map(s => MING_STAR_KEYWORDS[s.name] ? s.name + ':' + MING_STAR_KEYWORDS[s.name].split('，')[0] : '').filter(k=>k).join('；');

                const info = PALACE_TEMPLATE[name] || { icon:'✨', title:name, desc:'' };

                const div = document.createElement('div');
                div.className = 'bg-white rounded-lg p-4 border border-slate-100 shadow-sm';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center font-bold text-slate-800">
                            <span class="mr-2 text-lg">${info.icon}</span>
                            ${name} <span class="text-xs font-normal text-slate-400 ml-1">(${info.title})</span>
                        </div>
                        <span class="text-xs text-slate-300">${p.heavenlyStem}${p.earthlyBranch}</span>
                    </div>
                    <div class="mb-2 min-h-[24px]">${major || '<span class="text-xs text-slate-400">无主星(借对宫)</span>'} ${minor}</div>
                    ${keywords ? `<div class="text-xs text-slate-500 bg-slate-50 p-2 rounded leading-relaxed"><strong>特质：</strong>${keywords}</div>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function renderTab3(astrolabe, dateStr) {
            const today = new Date();
            const horoscope = astrolabe.horoscope(dateStr);
            const decade = horoscope.decadal;
            const dStart = decade.age.min;
            const dEnd = decade.age.max;
            const dPalace = decade.palace();
            
            const stem = dPalace.heavenlyStem;
            const dSihua = SHI_GAN_SI_HUA[stem];

            document.getElementById('decadeFortune').innerHTML = `
                <div class="flex justify-between items-end mb-2">
                    <h3 class="text-lg font-bold">十年大运 (${dStart}-${dEnd}岁)</h3>
                    <span class="text-xs opacity-80">行运至【${dPalace.name}】</span>
                </div>
                <div class="text-sm opacity-90 mb-3">这十年，您的关注重心在<strong>${dPalace.name}</strong>所代表的领域。</div>
                <div class="bg-white/20 rounded-lg p-3 text-xs space-y-1">
                    <div class="font-bold mb-1">📅 本限四化 (运势引信)：</div>
                    <div>🔴 <span class="font-bold">${dSihua[0]}化禄</span>：机遇到来的地方</div>
                    <div>🔵 <span class="font-bold">${dSihua[1]}化权</span>：掌权努力的地方</div>
                    <div>🟢 <span class="font-bold">${dSihua[2]}化科</span>：名声扬名的地方</div>
                    <div>⚪ <span class="font-bold">${dSihua[3]}化忌</span>：麻烦亏欠的地方</div>
                </div>
            `;

            const container = document.getElementById('forecastContent');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                let targetDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
                const tStr = `${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-15 12:00:00`;
                const scope = astrolabe.horoscope(tStr);
                const monthName = scope.lunarDate.toString();
                const mPalace = scope.monthly.palace();
                
                const div = document.createElement('div');
                div.className = 'bg-white border border-slate-200 rounded-lg p-3';
                div.innerHTML = `
                    <div class="flex justify-between font-bold text-slate-700 text-sm mb-1">
                        <span>${targetDate.getFullYear()}年${targetDate.getMonth()+1}月</span>
                        <span class="text-indigo-600">流月在${mPalace.name}</span>
                    </div>
                    <div class="text-xs text-slate-400 mb-2">${monthName}</div>
                    <div class="text-xs text-slate-600">重点关注：${mPalace.majorStars.map(s=>s.name).join('、')||'无主星'}</div>
                `;
                container.appendChild(div);
            }
        }

        // --- 交互与历史记录 ---
        function switchTab(tabId) {
            ['tab1','tab2','tab3'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            ['btn-tab1','btn-tab2','btn-tab3'].forEach(b => {
                document.getElementById(b).className = b === 'btn-'+tabId ? 'tab-active flex-1 py-2 text-center' : 'tab-inactive flex-1 py-2 text-center';
            });
        }

        function toggleHistory() { document.getElementById('historyPanel').classList.toggle('hidden'); }
        
        function saveRecord(data) {
            let list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            const existsIdx = list.findIndex(i => i.name===data.name && i.y===data.y && i.m===data.m && i.d===data.d && i.time===data.time);
            if(existsIdx > -1) list.splice(existsIdx, 1);
            list.unshift(data); if(list.length>5) list.pop();
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
            loadHistory();
        }
        function loadHistory() {
            const list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            const p = document.getElementById('historyPanel');
            p.innerHTML = list.length ? '' : '暂无记录';
            list.forEach((d,i) => {
                p.innerHTML += `<div class="flex justify-between border-b border-slate-100 pb-1 cursor-pointer" onclick='fillForm(${JSON.stringify(d)})'><span>${d.name}</span><span>${d.y}.${d.m}.${d.d}</span></div>`;
            });
        }
        window.fillForm = (d) => {
            document.getElementById('userName').value=d.name; document.getElementById('selYear').value=d.y; document.getElementById('selMonth').value=parseInt(d.m); document.getElementById('selYear').onchange(); document.getElementById('selDay').value=parseInt(d.d); document.getElementById('birthTime').value=d.time; document.getElementById('location').value=d.loc; document.getElementById('gender').value=d.gender;
            toggleHistory();
        };

        init();
    </script>
</body>
</html>
