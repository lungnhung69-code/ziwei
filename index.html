        const CITY_LONGITUDES={'北京':116.40,'上海':121.47,'天津':117.20,'重庆':106.55,'哈尔滨':126.63,'沈阳':123.43,'西安':108.95,'南京':118.78,'杭州':120.19,'武汉':114.31,'广州':113.23,'成都':104.06,'香港':114.17,'台北':121.50,'周口':114.65,'郑州':113.65};

        // === 2. 安全卫士函数 ===
        function findPalace(astrolabe, keyword) {
            if(!astrolabe || !astrolabe.palaces) return null;
            return astrolabe.palaces.find(p => p.name.includes(keyword));
        }
        
        function _getStars(palace) { return (palace && palace.majorStars) ? palace.majorStars : []; }
        function _getMinors(palace) { return (palace && palace.minorStars) ? palace.minorStars : []; }

        function _getSmartStars(palace, astrolabe) {
            if (!palace) return { stars: [], isBorrowed: false, src: '无' };
            const majors = _getStars(palace);
            if (majors.length > 0) return { stars: majors, isBorrowed: false, src: palace.name };
            
            try {
                const duiIdx = (palace.index + 6) % 12;
                const duiPalace = astrolabe.palace(duiIdx);
                return { stars: _getStars(duiPalace), isBorrowed: true, src: duiPalace ? duiPalace.name : '对宫' };
            } catch(e) {
                return { stars: [], isBorrowed: false, src: '无' };
            }
        }
        
        // 核心修复：流月财运建议库
        function getMonthGuide(starName) {
            const map = {

                '太阳': { type: 'normal', text: '名气提升，但较为劳碌' },
                '武曲': { type: 'wealth', text: '财星高照，利于理财' },
                '天同': { type: 'normal', text: '运势平稳，适合享受' },
                '廉贞': { type: 'warn', text: '注意人际关系和桃花' },
                '天府': { type: 'wealth', text: '财库稳固，适合存钱' },
                '太阴': { type: 'wealth', text: '财运不错，细水长流' },
                '贪狼': { type: 'wealth', text: '有偏财运，切勿贪多' },
                '巨门': { type: 'warn', text: '防口舌是非，少说话' },
                '天相': { type: 'normal', text: '平稳顺遂，人际和谐' },
                '天梁': { type: 'normal', text: '逢凶化吉，修身养性' },
                '七杀': { type: 'warn', text: '冲动易误事，出行小心' },
                '破军': { type: 'warn', text: '开销较大，控制预算' },
                '天机': { type: 'warn', text: '思虑过多，注意睡眠' }
            };
            return map[starName] || { type: 'normal', text: '运势平稳，按部就班' };
        }

        // 初始化
        function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1940; i--) y.add(new Option(i+'年', i));
            y.value = 1983; for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=18;
        }

        function calculate() {
            if (typeof iztro === 'undefined') { alert("资源加载中..."); return; }
            
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                let longitude = 120, matchedCity = '';
                for (let city in CITY_LONGITUDES) {
                    if (loc.includes(city)) { longitude = CITY_LONGITUDES[city]; matchedCity = city; break; }
                }
                const offset = (longitude - 120) * 4;
                const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
                dateObj.setMinutes(dateObj.getMinutes() + offset);
                let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;

                safeText('solarHint', matchedCity ? `✅ 真太阳时已校准 (${matchedCity})` : "ℹ️ 默认北京时间");

                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                renderMasterAnalysis(astrolabe);
                renderFortuneFocus(astrolabe, parseInt(y));

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1');

            } catch(e) {
                console.error(e);
                alert('排盘失败: ' + e.message);
            }
        }

        // === Tab 1: 大师全息画像 ===
        function renderMasterAnalysis(astrolabe) {
            const pMing = findPalace(astrolabe, '命');
            const pGuan = findPalace(astrolabe, '官');
            const pCai = findPalace(astrolabe, '财');
            const pFu = findPalace(astrolabe, '夫');

            renderSection('reportMing', pMing, astrolabe, 'ming');
            renderSection('reportCareer', pGuan, astrolabe, 'career', pCai);
            renderSection('reportLove', pFu, astrolabe, 'love');
        }

        function renderSection(elId, palace, astrolabe, type, extraPalace = null) {
            if(!palace) return;
            const data = _getSmartStars(palace, astrolabe);
            let html = ``;
            
            let starNames = data.stars.map(s => s.name).join(' + ');
            if (data.stars.length === 0) starNames = "无主星";
            let borrowTag = data.isBorrowed ? `<span class="bg-gray-100 text-gray-500 text-xs px-2 py-0.5 rounded ml-2">借对宫看</span>` : '';
            
            html += `<div class="mb-4"><span class="text-xl font-bold text-indigo-900">主星：${starNames}</span>${borrowTag}</div>`;

            if (data.stars.length > 0) {
                html += `<div class="space-y-5">`;
                data.stars.forEach(s => {
                    if (MASTER_DB[s.name]) {
                        let text = MASTER_DB[s.name][type] || MASTER_DB[s.name]['ming'];
                        if (type === 'career' && !MASTER_DB[s.name][type]) text = MASTER_DB[s.name]['ming'];
                        
                        html += `<div>
                            <span class="highlight-key mb-1 inline-block">${s.name}</span>
                            <div class="text-sm text-slate-700 leading-relaxed">${text}</div>
                        </div>`;
                        
                        if (type === 'ming') {
                             html += `<div class="advice-box">💡 <b>大师建议：</b>${MASTER_DB[s.name].advice}</div>`;
                        }
                    }
                });
                html += `</div>`;
            } else {
                html += `<div class="p-3 bg-slate-50 text-slate-500 rounded text-sm text-center">此宫位无主星，代表该领域变数大，需参考对宫星曜。</div>`;
            }

            if (extraPalace) {
                const extraData = _getSmartStars(extraPalace, astrolabe);
                html += `<div class="mt-6 pt-4 border-t border-dashed border-slate-300">
                    <div class="mb-3 font-bold text-slate-800 flex items-center gap-2"><i class="fas fa-coins text-amber-500"></i> 财运补充（财帛宫）</div>
                    <div class="space-y-2">`;
                extraData.stars.forEach(s => {
                     if (MASTER_DB[s.name]) {
                        html += `<div class="text-sm"><span class="font-bold text-slate-700">${s.name}：</span>${MASTER_DB[s.name].wealth || '财运起伏'}</div>`;
                     }
                });
                html += `</div></div>`;
            }
            safeHTML(elId, html);
        }

        // === Tab 2: 当下运势聚焦 ===
        function renderFortuneFocus(astrolabe, birthYear) {
            const now = new Date();
            const currentYear = now.getFullYear();
            const age = currentYear - birthYear + 1;

            // 1. 找大限
            let curDecade = null;
            astrolabe.palaces.forEach(p => {
                if (p.decadal && age >= p.decadal.range[0] && age <= p.decadal.range[1]) curDecade = p;
            });

            const decadeContainer = document.getElementById('decadeContainer');
            if (curDecade) {
                const dData = _getSmartStars(curDecade, astrolabe);
                const starName = dData.stars.map(s=>s.name).join('、') || '无主星';
                
                let luckText = "本大限运势起伏，需稳中求进。";
                if(dData.stars.length > 0 && MASTER_DB[dData.stars[0].name]) {
                    luckText = MASTER_DB[dData.stars[0].name].ming.substring(0, 50) + '...';
                }

                decadeContainer.innerHTML = `
                <div class="decade-header">
                    <div class="text-xs opacity-80 mb-1 uppercase tracking-widest">Current Decade</div>
                    <div class="text-3xl font-bold mb-4">行运【${curDecade.name}】 (${curDecade.decadal.range[0]}-${curDecade.decadal.range[1]}岁)</div>
                    <div class="text-sm bg-white/10 p-4 rounded-lg leading-relaxed border border-white/20">
                        <p class="mb-2"><b>大限主星：</b>${starName} ${dData.isBorrowed?'(借星)':''}</p>
                        <p class="text-justify"><b>运势基调：</b>${luckText}</p>
                    </div>
                </div>`;
            } else {
                safeHTML('decadeContainer', `<div class="p-4 text-center text-slate-400">大运数据加载中...</div>`);
            }

            // 2. 找流年
            // 修复：强制使用 2025 年作为流年
            const yearStr = '2025-06-01 12:00:00'; 
            let yearlyScope;
            try { yearlyScope = astrolabe.horoscope(yearStr); } catch(e){}
            
            if (yearlyScope && yearlyScope.yearly) {
                const yPalace = astrolabe.palace(yearlyScope.yearly.index);
                const yData = _getSmartStars(yPalace, astrolabe);
                
                safeText('yearLabel', `2025 乙巳年`);
                
                let yContent = `<p class="mb-3 font-bold text-indigo-900">流年命宫在【${yPalace.name}】，主星 ${yData.starStr}。</p>`;
                
                if(yData.stars.some(s=>['紫微','太阳','天府','武曲'].includes(s.name))) {
                    yContent += `<div class="bg-green-50 text-green-800 p-3 rounded border border-green-200 text-sm">🌟 <b>大吉：</b>今年贵人运旺，利于事业突破、升职加薪，适合大展拳脚。</div>`;
                } else if(yData.stars.some(s=>['七杀','破军','贪狼'].includes(s.name))) {
                    yContent += `<div class="bg-red-50 text-red-800 p-3 rounded border border-red-200 text-sm">⚡ <b>变动：</b>今年是变动之年，环境推着你走。宜守不宜攻，注意防范意外。</div>`;
                } else {
                    yContent += `<div class="bg-blue-50 text-blue-800 p-3 rounded border border-blue-100 text-sm">🍵 <b>平稳：</b>今年运势平缓，适合学习、积淀，处理家庭事务。</div>`;
                }
                safeHTML('yearContent', yContent);
            }

            // 3. 未来三月 (修复 undefined 问题)
            const forecastDiv = document.getElementById('monthlyForecast');
            if (forecastDiv) {
                forecastDiv.innerHTML = '';
                // 强制从2025年1月开始显示
                for(let i=1; i<=3; i++) {
                    // 构造 2025-01, 02, 03 的时间
                    let fStr = `2025-${String(i).padStart(2,'0')}-15 12:00:00`;
                    let scope; try { scope = astrolabe.horoscope(fStr); } catch(e){}

                    if(scope && scope.monthly) {
                        const mPalace = astrolabe.palace(scope.monthly.index);
                        const mData = _getSmartStars(mPalace, astrolabe);
                        
                        // 核心：获取建议
                        let advice = { type: 'normal', text: '平稳' };
                        if (mData.stars.length > 0) {
                             advice = getMonthGuide(mData.stars[0].name);
                        } else {
                             advice = { type: 'normal', text: '运势平淡，宜静不宜动' };
                        }
                        
                        // 修复 undefined 农历
                        const lunarM = (scope.lunarDate && scope.lunarDate.month) ? scope.lunarDate.month : '未知';
                        const tagClass = advice.wealth && advice.wealth.includes('利') ? 'tag-wealth' : 'tag-normal';

                        const item = document.createElement('div');
                        item.className = 'timeline-item';
                        item.innerHTML = `
                            <div>
                                <div class="month-badge">2025年${i}月</div>
                                <div class="lunar-text">农历${lunarM}月 · ${mPalace.name}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-bold text-slate-700 mb-1">${mData.starStr}</div>
                                <span class="month-tag ${tagClass}">${advice.text}</span>
                            </div>
                        `;
                        forecastDiv.appendChild(item);
                    }
                }
            }
        }

        function switchTab(id) {
            ['tab1','tab2'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        init();
    </script>
</body>
</html>
