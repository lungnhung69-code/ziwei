            selYear.value = 1990;
            for(let i = 1; i <= 12; i++) selMonth.add(new Option(i + '月', i));
            function updateDays() {
                const y = parseInt(selYear.value), m = parseInt(selMonth.value), daysInMonth = new Date(y, m, 0).getDate(), currentDay = selDay.value;
                selDay.innerHTML = '';
                for(let i = 1; i <= daysInMonth; i++) selDay.add(new Option(i + '日', i));
                if(currentDay && currentDay <= daysInMonth) selDay.value = currentDay;
            }
            selYear.onchange = updateDays; selMonth.onchange = updateDays; updateDays();
        }

        }
        function closeModal() {
            const modal = document.getElementById('explainModal'), content = document.getElementById('modalContent');
            content.style.opacity = '0'; content.style.transform = 'scale(0.95)'; setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function calculate() {
            const btn = document.getElementById('calcBtn'), y = document.getElementById('selYear').value, m = document.getElementById('selMonth').value.padStart(2, '0'), d = document.getElementById('selDay').value.padStart(2, '0');
            const dateStr = `${y}-${m}-${d}`, timeStr = document.getElementById('birthTime').value, location = document.getElementById('location').value || '', genderVal = document.getElementById('gender').value;
            const resultArea = document.getElementById('resultArea'), solarTimeHint = document.getElementById('solarTimeHint');
            
            if (!timeStr) { alert("请选择出生时间！"); return; }
            btn.innerText = "🔄 正在精密推演..."; btn.disabled = true; btn.classList.add('bg-gray-400');

            setTimeout(() => {
                try {
                    if (typeof iztro === 'undefined') throw new Error("算法库加载失败！请检查网络。");
                    let longitude = 120; for (let city in CITY_LONGITUDES) { if (location.includes(city)) { longitude = CITY_LONGITUDES[city]; break; } }
                    const offset = (longitude - 120) * 4, dt = new Date(`${dateStr}T${timeStr}:00`);
                    dt.setMinutes(dt.getMinutes() + offset);
                    const h = dt.getHours(); let timeIndex = Math.floor((h + 1) / 2); if (timeIndex >= 12) timeIndex = 0;
                    const fixedTimeStr = `${String(h).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
                    solarTimeHint.textContent = Math.abs(offset) > 1 ? `*真太阳时: ${fixedTimeStr} (偏差${Math.round(offset)}分)` : `*使用标准时间`;

                    const gender = genderVal === '男' ? '男' : '女';
                    const astrolabe = iztro.astro.bySolar(dateStr, timeIndex, gender, true, 'zh-CN');

                    generateFateOverview(astrolabe, parseInt(y));

                    const forecastContent = document.getElementById('forecastContent');
                    forecastContent.innerHTML = ''; 
                    const today = new Date();
                    for (let i = 0; i < 3; i++) {
                        let targetDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
                        const targetStr = `${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-15 12:00:00`;
                        forecastContent.innerHTML += generateDeepAnalysis(astrolabe, targetDate, targetStr);
                    }
                    resultArea.classList.remove('hidden');
                    setTimeout(() => { resultArea.scrollIntoView({behavior: "smooth", block: "start"}); }, 100);
                } catch (e) { alert("❌ 出错了：\n" + e.message); } 
                finally { btn.innerText = "🚀 开启命运全息图"; btn.disabled = false; btn.classList.remove('bg-gray-400'); }
            }, 100);
        }

        function generateFateOverview(astrolabe, birthYear) {
            const pMing = astrolabe.palaces.find(p => p.name === '命宫') || { earthlyBranch: '-', majorStars: [] };
            const pShen = astrolabe.palaces.find(p => p.isBodyPalace) || { name: '命宫' };
            
            const stems = ['庚', '辛', '壬', '癸', '甲', '乙', '丙', '丁', '戊', '己'];
            const stemIndex = birthYear % 10;
            const birthStem = stems[stemIndex];

            let laiYinPalace = astrolabe.palaces.find(p => p.heavenlyStem === birthStem);
            if (!laiYinPalace) laiYinPalace = pMing;
            
            // 修复：自动补全“宫”字，确保查字典时不为空
            const fixName = (name) => name.endsWith('宫') ? name : name + '宫';
            const laiYinText = LAI_YIN_DESC[fixName(laiYinPalace.name)] || "命盘根基所在";
            const shenText = BODY_PALACE_DESC[fixName(pShen.name)] || "身宫代表后天运势的修正。";

            const starsToFind = SHI_GAN_SI_HUA[birthStem];
            const siHuaTypes = ['化禄', '化权', '化科', '化忌'];
            let siHuaList = [];
            starsToFind.forEach((starName, index) => {
                const type = siHuaTypes[index];
                let foundPalace = null;
                astrolabe.palaces.forEach(p => {
                    const allStars = [...p.majorStars, ...p.minorStars];
                    if (allStars.some(s => s.name === starName)) foundPalace = p.name;
                });
                // 修复：查找解释时也需要补全“宫”字（如果需要的话，但目前 SI_HUA_MEANING 用的是短名或长名？检查字典是短名，所以foundPalace应该去掉宫？）
                // 检查 SI_HUA_MEANING，它是 '财帛', '田宅' (无宫字)。
                // iztro 库返回的名字通常带宫，也可能不带。
                // 策略：先尝试带宫的，再尝试不带宫的，再尝试只取前两个字。
                let meaning = SI_HUA_MEANING[type]['default'];
                if (foundPalace) {
                    // 尝试匹配字典
                    let shortName = foundPalace.replace('宫', ''); // 比如 "夫妻"
                    if (SI_HUA_MEANING[type][shortName]) {
                        meaning = SI_HUA_MEANING[type][shortName];
                    }
                }
                siHuaList.push({ star: starName, type: type, palace: foundPalace || '未知', desc: meaning });
            });

            const majorStars = pMing.majorStars || [];
            let characterTags = [];
            if (majorStars.length === 0) { characterTags.push("命宫无主星"); characterTags.push("善于察言观色"); characterTags.push("借对宫星曜"); } 
            else { majorStars.forEach(s => { const trait = MING_STAR_KEYWORDS[s.name]; if(trait) characterTags.push(`${s.name}: ${trait}`); }); }

            const siHuaHTML = siHuaList.map(item => `<div class="p-2 bg-white rounded border border-slate-100 mb-2 last:mb-0"><div class="flex justify-between items-center text-xs mb-1"><span class="font-bold text-indigo-700">${item.star}${item.type}</span><span class="text-slate-400">在【${item.palace}】</span></div><div class="text-xs text-slate-600">${item.desc}</div></div>`).join('');

            const html = `
                <div class="mb-6">
                    <h2 class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-wider border-l-4 border-purple-500 pl-2">命局总格 & 先天基因</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="bg-indigo-50/50 rounded-xl p-4 border border-indigo-100">
                            <div class="flex items-center mb-2"><span class="text-lg mr-2">🧬</span><h3 class="font-bold text-indigo-900">命宫 (性格核心)</h3></div>
                            <div class="text-sm text-slate-600 mb-2"><span class="font-bold">命宫(${pMing.earthlyBranch})：</span>${characterTags.join('，')}</div>
                        </div>
                        <div class="bg-pink-50/50 rounded-xl p-4 border border-pink-100">
                            <div class="flex items-center mb-2"><span class="text-lg mr-2">🧘‍♀️</span><h3 class="font-bold text-pink-900">身宫 (中晚年归宿)</h3></div>
                            <div class="text-sm font-bold text-pink-800 mb-1">落在【${pShen.name}】</div>
                            <div class="text-xs text-pink-700/80 leading-relaxed">${shenText}</div>
                        </div>
                        <div class="bg-amber-50/50 rounded-xl p-4 border border-amber-100">
                            <div class="flex items-center mb-2"><span class="text-lg mr-2">🗝️</span><h3 class="font-bold text-amber-900">来因宫 (核心驱动力)</h3></div>
                            <div class="text-sm font-bold text-amber-800 mb-1">落在【${laiYinPalace.name}】</div>
                            <div class="text-xs text-amber-700/80 leading-relaxed">${laiYinText}</div>
                        </div>
                        <div class="bg-slate-50 rounded-xl p-4 border border-slate-100"><div class="flex items-center mb-2"><span class="text-lg mr-2">🌟</span><h3 class="font-bold text-slate-700">这一生的重点 (生年四化)</h3></div><div class="space-y-1">${siHuaHTML}</div></div>
                    </div>
                </div>
            `;
            document.getElementById('fateOverview').innerHTML = html;
        }

        function getStarSetAndList(astrolabe, scope) {
            const monthIndex = scope.monthly.index;
            const indices = [monthIndex, (monthIndex+6)%12, (monthIndex+4)%12, (monthIndex+8)%12];
            let starSet = new Set(), starList = []; 
            indices.forEach((idx, i) => {
                const p = astrolabe.palace(idx);
                const majors = p.majorStars || []; const minors = p.minorStars || [];
                [...majors, ...minors].forEach(s => { starSet.add(s.name); starList.push({ name: s.name, src: i===0?'本宫':'三方', type: 'static' }); });
            });
            const mutagens = scope.monthly.mutagens || [];
            mutagens.forEach(m => { starSet.add(m.name + m.mutagen); starSet.add(m.mutagen); starSet.add(m.name); starList.push({ name: m.name + m.mutagen, src: '流变', type: 'mutagen' }); });
            return { starSet, starList };
        }

        function getAdvice(starList) {
            let yiList = new Set(), jiList = new Set(), hasAdvice = false;
            starList.forEach(s => {
                let key = s.name;
                if(s.name.includes('化禄')) key='化禄'; else if(s.name.includes('化权')) key='化权'; else if(s.name.includes('化科')) key='化科'; else if(s.name.includes('化忌')) key='化忌';
                const guide = ACTION_GUIDE[key];
                if (guide) { guide.yi.forEach(i => yiList.add(i)); guide.ji.forEach(i => jiList.add(i)); hasAdvice = true; }
            });
            if (!hasAdvice) { yiList.add('按部就班'); yiList.add('平常心'); jiList.add('急躁'); jiList.add('熬夜'); }
            return { yi: Array.from(yiList).slice(0,4), ji: Array.from(jiList).slice(0,4) };
        }

        function generateDeepAnalysis(astrolabe, dateObj, dateStr) {
            const scope = astrolabe.horoscope(dateStr);
            if (!scope || !scope.monthly) return '';
            const monthIndex = scope.monthly.index;
            const palaceName = astrolabe.palace(monthIndex).name;
            const { starSet, starList } = getStarSetAndList(astrolabe, scope);
            const lunarStr = scope.lunarDate ? scope.lunarDate.toString() : '';
            let lunarShort = "农历月份";
            if(lunarStr) { const match = lunarStr.match(/[零一二三四五六七八九十]+月/); if(match) lunarShort = "农历" + match[0]; }

            let matchedPatterns = [];
            PATTERNS.forEach(p => { if (p.check(starSet)) matchedPatterns.push(p); });

            let totalScore = 0;
            matchedPatterns.forEach(p => totalScore += p.score);
            starList.forEach(s => {
                if (s.name.includes('化禄') || s.name.includes('化权') || s.name.includes('化科')) totalScore += 1;
                if (s.name.includes('化忌')) totalScore -= 1.5;
                if (['左辅','右弼','天魁','天钺','禄存'].includes(s.name)) totalScore += 1;
                if (['擎羊','陀罗','火星','铃星','地空','地劫'].includes(s.name)) totalScore -= 1.5;
            });

            let summaryTitle = "", summaryColor = "";
            if (totalScore >= 5) { summaryTitle = "🚀 运势强劲"; summaryColor = "text-emerald-600"; }
            else if (totalScore >= 2) { summaryTitle = "📈 稳中向好"; summaryColor = "text-blue-600"; }
            else if (totalScore >= -2) { summaryTitle = "⚖️ 平稳过渡"; summaryColor = "text-slate-600"; }
            else if (totalScore >= -6) { summaryTitle = "🌪️ 阻力显现"; summaryColor = "text-orange-600"; }
            else { summaryTitle = "🛑 严阵以待"; summaryColor = "text-red-600"; }

            const advice = getAdvice(starList);

            return `
                <div class="bg-white rounded-xl border border-slate-100 p-4 shadow-sm mb-4">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-3 mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">${dateObj.getFullYear()}年${dateObj.getMonth()+1}月</h3>
                            <div class="text-xs text-slate-500 mt-0.5 flex items-center"><span class="bg-slate-100 px-1.5 py-0.5 rounded mr-2">${lunarShort}</span><span>流月在【${palaceName}】</span></div>
                        </div>
                        <div class="text-right mt-1"><span class="text-sm font-bold ${summaryColor}">${summaryTitle}</span></div>
                    </div>
                    ${matchedPatterns.length > 0 ? `<div class="mb-3 bg-indigo-50 rounded-lg p-2.5 border border-indigo-100"><div class="space-y-2">${matchedPatterns.map(p => `<div class="flex flex-col" onclick="showExplain('${p.name}')"><div class="flex items-center"><span class="pattern-tag">格局</span><span class="text-xs font-bold text-indigo-900 underline decoration-dotted">${p.name}</span></div><span class="text-xs text-slate-600 pl-1">${p.desc.split('：')[1]}</span></div>`).join('')}</div></div>` : ''}
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="bg-emerald-50/50 p-2 rounded-lg"><h4 class="text-[10px] font-bold text-emerald-600 mb-1.5 uppercase">吉象 (点击查看)</h4><div class="flex flex-wrap gap-1.5">${getStarTags(starList, 'good') || '<span class="text-[10px] text-slate-300">无明显吉星</span>'}</div></div>
                        <div class="bg-rose-50/50 p-2 rounded-lg"><h4 class="text-[10px] font-bold text-rose-600 mb-1.5 uppercase">凶象 (点击查看)</h4><div class="flex flex-wrap gap-1.5">${getStarTags(starList, 'bad') || '<span class="text-[10px] text-slate-300">无明显煞星</span>'}</div></div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-slate-100 grid grid-cols-1 gap-2">
                        <div class="flex items-start"><span class="text-xs font-bold text-emerald-600 mr-2 mt-0.5 shrink-0">✅ 宜：</span><div class="flex flex-wrap gap-1">${advice.yi.map(t => `<span class="action-badge bg-emerald-100 text-emerald-700">${t}</span>`).join('')}</div></div>
                        <div class="flex items-start"><span class="text-xs font-bold text-rose-600 mr-2 mt-0.5 shrink-0">❌ 忌：</span><div class="flex flex-wrap gap-1">${advice.ji.map(t => `<span class="action-badge bg-rose-100 text-rose-700">${t}</span>`).join('')}</div></div>
                    </div>
                </div>
            `;
        }

        function getStarTags(list, type) {
            let filtered = [], seen = new Set();
            const BASE_DESC = {'化禄':'good','化权':'good','化科':'good','化忌':'bad','禄存':'good','天马':'good','左辅':'good','右弼':'good','天魁':'good','天钺':'good','擎羊':'bad','陀罗':'bad','火星':'bad','铃星':'bad','地空':'bad','地劫':'bad'};
            list.forEach(s => {
                let starType = '';
                if(s.name.includes('化禄')||s.name.includes('化权')||s.name.includes('化科')) starType='good'; else if(s.name.includes('化忌')) starType='bad';
                else { let key = Object.keys(BASE_DESC).find(k => s.name.includes(k)); if(key) starType = BASE_DESC[key]; }
                if (type === 'good' && starType === 'good' && !seen.has(s.name)) { filtered.push(`<span class="star-tag px-1.5 py-0.5 bg-white border border-emerald-100 text-emerald-700 rounded text-[10px] font-medium shadow-sm" onclick="showExplain('${s.name}')">${s.name}</span>`); seen.add(s.name); }
                if (type === 'bad' && starType === 'bad' && !seen.has(s.name)) { filtered.push(`<span class="star-tag px-1.5 py-0.5 bg-white border border-rose-100 text-rose-700 rounded text-[10px] font-medium shadow-sm" onclick="showExplain('${s.name}')">${s.name}</span>`); seen.add(s.name); }
            });
            return filtered.join('');
        }
    </script>
