            </div>

                    <div class="absolute right-[-20px] top-[-20px] text-8xl opacity-10 rotate-12"><i class="fas fa-horse"></i></div>

                    <p class="text-sm opacity-90 relative z-10">基于钦天四化与流年叠宫推演</p>

    <script>
        // === 基础配置与常量 ===
        const PALACE_CONFIG = {
            '命宫': { icon: 'fa-user-circle', type: 'personality', label: '命格总览' },
            '财帛': { icon: 'fa-coins', type: 'wealth', label: '财富运势' },
            '官禄': { icon: 'fa-briefcase', type: 'career', label: '事业发展' },
            '迁移': { icon: 'fa-plane', type: 'social', label: '外出际遇' },
            '夫妻': { icon: 'fa-heart', type: 'love', label: '情感婚姻' },
            '疾厄': { icon: 'fa-notes-medical', type: 'health', label: '身体健康' }
        };

        const STAR_BASE = {
            '紫微': { title: '尊贵之星', trait: '气场强大，喜掌权。' },
            '天机': { title: '智慧之星', trait: '反应敏捷，思虑多。' },
            '太阳': { title: '博爱之星', trait: '热情豪爽，喜付出。' },
            '武曲': { title: '刚毅之星', trait: '执行力强，略孤僻。' },
            '天同': { title: '福气之星', trait: '乐天知命，微懒散。' },
            '廉贞': { title: '交际之星', trait: '爱恨分明，心气高。' },
            '天府': { title: '财库之星', trait: '稳重敦厚，格局大。' },
            '太阴': { title: '富足之星', trait: '温柔细腻，爱干净。' },
            '贪狼': { title: '欲望之星', trait: '多才多艺，善应酬。' },
            '巨门': { title: '是非之星', trait: '心思细密，疑心重。' },
            '天相': { title: '辅助之星', trait: '粉饰太平，人缘好。' },
            '天梁': { title: '荫庇之星', trait: '老成持重，喜助人。' },
            '七杀': { title: '肃杀之星', trait: '性格急躁，敢冒险。' },
            '破军': { title: '消耗之星', trait: '喜新厌旧，破坏强。' }
        };
        
        const SMART_ANALYSIS = {
            'wealth': { '武曲': '正财星坐守，求财执行力极强。', '太阴': '积蓄型财运，细水长流。', '天府': '财库稳固，善于理财。', '贪狼': '偏财运旺，常有意外之财。', '破军': '大破大立，财来财去。', '天同': '福气财，越轻松越生财。' },
            'career': { '紫微': '天生领导格，适合大平台。', '太阳': '利于公职、传播或服务大众。', '天机': '适合策划、咨询与脑力密集型。', '廉贞': '适合公关、精密仪器或法务。', '七杀': '适合高压、挑战性工作。' },
        };

        const SI_HUA_DICT = {
            '禄': { label: '化禄', color: 'text-green-600', effect: '资源增多，顺水推舟' },
            '权': { label: '化权', color: 'text-blue-600', effect: '执行增强，掌控力升' },
            '科': { label: '化科', color: 'text-amber-600', effect: '名声远扬，贵人提携' },
            '忌': { label: '化忌', color: 'text-red-600', effect: '执着纠结，阻碍波折' }
        };

        const SI_HUA_MAP = {
            '甲': { '廉贞': '禄', '破军': '权', '武曲': '科', '太阳': '忌' },
            '乙': { '天机': '禄', '天梁': '权', '紫微': '科', '太阴': '忌' },
            '丙': { '天同': '禄', '天机': '权', '文昌': '科', '廉贞': '忌' }, 
            '丁': { '太阴': '禄', '天同': '权', '天机': '科', '巨门': '忌' },
            '戊': { '贪狼': '禄', '太阴': '权', '右弼': '科', '天机': '忌' },
            '己': { '武曲': '禄', '贪狼': '权', '天梁': '科', '文曲': '忌' },
            '庚': { '太阳': '禄', '武曲': '权', '太阴': '科', '天同': '忌' },
            '辛': { '巨门': '禄', '太阳': '权', '文曲': '科', '文昌': '忌' },
            '壬': { '天梁': '禄', '紫微': '权', '左辅': '科', '武曲': '忌' },
            '癸': { '破军': '禄', '巨门': '权', '太阴': '科', '贪狼': '忌' }
        };

        const CITY_LONGITUDES={'北京':116.40,'上海':121.47,'广州':113.23,'深圳':114.05,'成都':104.06,'周口':114.65,'郑州':113.65};

        // 辅助函数
        function _getStars(p) { return p?.majorStars ||[]; }
        function _getAllStars(p) { return [...(p?.majorStars||[]), ...(p?.minorStars||[])]; }
        function _getStarNames(p) { return _getAllStars(p).map(s=>s.name); }
        
        function getTrueSolarDate(ymdhm, locationName) {
            let lng = 120.0; 
            for (let c in CITY_LONGITUDES) { if (locationName.includes(c)) lng = CITY_LONGITUDES[c]; }
            const date = new Date(ymdhm + ":00");
            const offsetMinutes = (lng - 120) * 4;
            date.setMinutes(date.getMinutes() + offsetMinutes);
            return { date, offset: offsetMinutes, lng };
        }

        function calculateBaZiData(solarDate) {
            const solar = Solar.fromYmdHms(solarDate.getFullYear(), solarDate.getMonth() + 1, solarDate.getDate(), solarDate.getHours(), solarDate.getMinutes(), solarDate.getSeconds());
            const lunar = solar.getLunar();
            const baZi = lunar.getEightChar();
            return {
                lunarStr: `${lunar.getYearShengXiao()}年 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`,
                baziStr: `${baZi.getYear()} / ${baZi.getMonth()} / ${baZi.getDay()} / ${baZi.getTime()}`,
                zwYearStem: lunar.getYearGan() 
            };
        }

        function getSiHua(starName, stem) {
            const map = SI_HUA_MAP[stem];
            if (!map) return null;
            for (let [s, type] of Object.entries(map)) { if (s === starName) return type; }
            return null;
        }

        // === 核心逻辑 1：全局智能格局检测 (重构点1) ===
        function detectClassicPatterns(astrolabe) {
            const ming = astrolabe.palace('命宫');
            const cheng = astrolabe.palace('迁移');
            const cai = astrolabe.palace('财帛');
            const guan = astrolabe.palace('官禄');
            
            const mingStars = _getStarNames(ming);
            const sanFangStars =[..._getStarNames(ming), ..._getStarNames(cai), ..._getStarNames(guan), ..._getStarNames(cheng)];
            const allBadStars = sanFangStars.filter(s => ['擎羊','陀罗','火星','铃星','地空','地劫'].includes(s));

            let patterns = [];

            // 1. 杀破狼格
            if (['七杀','破军','贪狼'].some(s => mingStars.includes(s))) {
                patterns.push({name: '杀破狼格', type: 'good', desc: '命宫坐杀破狼，一生充满变数与开创力，性格果敢，宜在动荡、竞争中建功立业。'});
            }
            // 2. 机月同栋格
            if (['天机','太阴','天同','天梁'].some(s => mingStars.includes(s))) {
                if (['天机','太阴','天同','天梁'].every(s => sanFangStars.includes(s))) {
                    patterns.push({name: '机月同栋格', type: 'good', desc: '三方四正凑齐机月同栋，心思细腻，稳健保守，极适宜企划、幕僚或大机构稳定工作。'});
                }
            }
            // 3. 紫府同宫格
            if (mingStars.includes('紫微') && mingStars.includes('天府')) {
                patterns.push({name: '紫府同宫格', type: 'good', desc: '紫微帝星与天府财库同宫，格局极高，一生物质丰厚，具大将之风，但内心易感孤独。'});
            }
            // 4. 巨日同宫格
            if (mingStars.includes('巨门') && mingStars.includes('太阳')) {
                patterns.push({name: '巨日交辉格', type: 'good', desc: '太阳驱散巨门之暗，口才极佳，热心公益，利于在教育、法律或传播界扬名。'});
            }
            // 5. 日月交辉/同临
            if (mingStars.includes('太阳') && mingStars.includes('太阴')) {
                patterns.push({name: '日月同临格', type: 'good', desc: '阴阳调和，思想兼具理性与感性，常多兼职，得长辈或异性助力极大。'});
            }
            // 6. 阳梁昌禄格
            if (sanFangStars.includes('太阳') && sanFangStars.includes('天梁') && sanFangStars.includes('文昌') && (sanFangStars.includes('禄存') || sanFangStars.includes('化禄'))) {
                patterns.push({name: '阳梁昌禄格', type: 'good', desc: '读书考试的顶级格局，文才出众，利于科考、学术或国家机关任职。'});
            }
            // 7. 火贪/铃贪格
            if (sanFangStars.includes('贪狼') && (sanFangStars.includes('火星') || sanFangStars.includes('铃星'))) {
                patterns.push({name: '火贪/铃贪格', type: 'good', desc: '爆发力极强，常有突如其来的横发偏财或机遇，但需防暴起暴落。'});
            }
            // 8. 命里逢空 (破格)
            if (mingStars.includes('地空') && mingStars.includes('地劫')) {
                patterns.push({name: '命里逢空格', type: 'bad', desc: '空劫入命，思想空灵超脱，但不聚财，易半途而废，适合从事宗教、玄学或高科技虚拟产业。'});
            }
            // 9. 铃昌陀武 (破格)
            if (sanFangStars.includes('铃星') && sanFangStars.includes('文昌') && sanFangStars.includes('陀罗') && sanFangStars.includes('武曲')) {
                patterns.push({name: '铃昌陀武格', type: 'bad', desc: '经典破格，易在重大决策上受挫或有水火之险，人生需谨言慎行，步步为营。'});
            }

            if(patterns.length === 0) {
                patterns.push({name: '中和安泰格', type: 'neutral', desc: '命局平稳，无大起大落之极端星象，平平淡淡才是真，后天努力决定上限。'});
            }

            return { patterns, allBadStars };
        }

        // 渲染 Tab 1 总格局模块
        function renderOverallPattern(astrolabe) {
            const container = document.getElementById('overallPattern');
            const result = detectClassicPatterns(astrolabe);
            
            document.getElementById('elementBoard').innerHTML = `
                <div class="text-xs font-bold text-indigo-800 bg-indigo-100 px-2 py-1 rounded inline-block mb-1">${astrolabe.fiveElementsClass}</div>
                <div class="text-[11px] text-slate-500">命主: <b>${astrolabe.soul}</b> | 身主: <b>${astrolabe.body}</b></div>
            `;

            let html = `
                <div class="synthesis-card" style="background: linear-gradient(145deg, #fffbeb, #ffffff); border-left: 4px solid #f59e0b;">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fas fa-crown text-amber-500 text-xl"></i>
                        <h3 class="text-lg font-black text-slate-800">命盘核心格局统御</h3>
                    </div>
                    <div class="space-y-3">
            `;

            result.patterns.forEach(p => {
                const color = p.type === 'good' ? 'text-amber-700 bg-amber-50' : (p.type === 'bad' ? 'text-red-700 bg-red-50' : 'text-slate-700 bg-slate-50');
                const border = p.type === 'good' ? 'border-amber-200' : (p.type === 'bad' ? 'border-red-200' : 'border-slate-200');
                html += `
                    <div class="p-3 rounded-lg border ${border} ${color}">
                        <div class="font-bold text-sm mb-1">${p.name}</div>
                        <div class="text-xs leading-relaxed opacity-90">${p.desc}</div>
                    </div>
                `;
            });

            if(result.allBadStars.length > 0) {
                html += `
                    <div class="mt-3 text-xs text-slate-500 flex items-start gap-1">
                        <i class="fas fa-info-circle mt-0.5"></i>
                        <span>命中三方见【${result.allBadStars.join('、')}】煞星，主人生需历经磨练方可成器。</span>
                    </div>
                `;
            }

            html += `</div></div>`;
            container.innerHTML = html;
        }

        // === 核心逻辑 2：动态流年与流月详批 (重构点2) ===
        function getDomainScore(p, type, yearMonthStem) {
            if(!p) return { stars: '未知', text: '无法计算', color: 'text-slate-500' };
            const allStars = _getAllStars(p);
            const starNames = allStars.map(s=>s.name);
            let score = 60; let details =[];
            
            const luckyStars =['左辅','右弼','天魁','天钺','文昌','文曲','禄存','天马'];
            const badStars =['擎羊','陀罗','火星','铃星','地空','地劫'];

            allStars.forEach(s => {
                if (luckyStars.includes(s.name)) { score += 5; }
                if (badStars.includes(s.name)) { score -= 8; }
                // 检查四化引动
                const sihua = getSiHua(s.name, yearMonthStem);
                if(sihua === '禄') { score += 15; details.push(`${s.name}化禄极佳`); }
                if(sihua === '权') { score += 10; details.push(`掌权积极`); }
                if(sihua === '科') { score += 8; details.push(`名声大显`); }
                if(sihua === '忌') { score -= 25; details.push(`${s.name}化忌阻碍`); }
            });

            if (type === 'wealth' &&['武曲','太阴','天府','贪狼'].some(s => starNames.includes(s))) score += 5;
            if (type === 'career' && ['紫微','太阳','廉贞','七杀','破军'].some(s => starNames.includes(s))) score += 5;

            let resultText = ''; let resultColor = '';
            if (score >= 85) { resultText = '大吉星动：' + (details.length ? details.join('，') : '顺风顺水'); resultColor = 'text-red-600 bg-red-50'; }
            else if (score >= 70) { resultText = '稳中向好：' + (details.length ? details.join('，') : '机遇增多'); resultColor = 'text-amber-600 bg-amber-50'; }
            else if (score >= 50) { resultText = '平稳过渡：' + (details.length ? details.join('，') : '多劳多得'); resultColor = 'text-blue-600 bg-blue-50'; }
            else { resultText = '阻力考验：' + (details.length ? details.join('，') : '防小人破耗'); resultColor = 'text-slate-600 bg-slate-100'; }

            return { stars: starNames.slice(0,3).join(' ') + (starNames.length>3?'...':''), text: resultText, color: resultColor, score };
        }

                    <div class="bg-purple-50 p-3 rounded-lg mb-4 text-sm">

                        <div class="flex flex-wrap gap-2 mt-2">${sihuaHTML}</div>
                        <div class="text-xs text-purple-700 mt-2">四化星主导了今年环境给你的推力与阻力。化忌所在领域需防守，化禄所在领域宜进攻。</div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="border border-slate-100 rounded p-3 ${wSt.color}">
                            <div class="font-bold mb-1 flex items-center gap-1"><i class="fas fa-coins"></i> 财运研判</div>
                            <div class="font-bold text-xs mb-1">${wSt.text}</div>
                            <div class="text-[10px] opacity-70">流财星曜：${wSt.stars}</div>
                        </div>
                        <div class="border border-slate-100 rounded p-3 ${cSt.color}">
                            <div class="font-bold mb-1 flex items-center gap-1"><i class="fas fa-briefcase"></i> 事业研判</div>
                            <div class="font-bold text-xs mb-1">${cSt.text}</div>
                            <div class="text-[10px] opacity-70">流官星曜：${cSt.stars}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 渲染近三月流月详批
        function renderMonthlyForecast(astrolabe) {
            const container = document.getElementById('monthlyForecast');
            container.innerHTML = '';
            const now = new Date();

                const month = fDate.getMonth() + 1;
                
                let scope; try { scope = astrolabe.horoscope(fDate.toISOString().split('T')[0] + ' 12:00:00'); } catch(e) { continue; }
                if (!scope || !scope.monthly) continue;

                const mIndex = scope.monthly.index;
                const mStem = scope.monthly.heavenlyStem;
                const mBranch = scope.monthly.earthlyBranch;
                const mMing = astrolabe.palace(mIndex);
                
                // 流月三方
                const mCai = astrolabe.palace((mIndex + 8) % 12);
                const mGuan = astrolabe.palace((mIndex + 4) % 12);
                
                // 分析流月运势
                const wSt = getDomainScore(mCai, 'wealth', mStem);
                const cSt = getDomainScore(mGuan, 'career', mStem);
                
                const lunarObj = Solar.fromYmd(year, month, 15).getLunar();
                const mStars = _getStarNames(mMing);
                
                // 流月忌星预警
                const jiStar = Object.keys(SI_HUA_MAP[mStem]).find(k => SI_HUA_MAP[mStem][k] === '忌');
                const hasJiInMing = mStars.includes(jiStar);

                const card = document.createElement('div');

                            <div class="text-xs text-slate-500 mt-1">

                    ${hasJiInMing ? `<div class="mb-3 text-xs bg-red-50 text-red-700 p-2 rounded border border-red-100"><i class="fas fa-exclamation-circle mr-1"></i><b>本月警报：</b>流月化忌【${jiStar}】入命，易心烦气躁、逢阻滞，切忌冲动决策。</div>` : ''}

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm mt-3">

                            <div class="flex items-center gap-2 mb-1">
                                <div class="w-6 h-6 rounded-full bg-white flex items-center justify-center text-xs shadow-sm"><i class="fas fa-coins opacity-80"></i></div>
                                <div class="font-bold">本月财运</div>
                            </div>
                            <div class="text-xs font-bold mt-1">${wSt.text}</div>
                        </div>
                        <div class="flex flex-col p-3 rounded-lg border border-slate-100 ${cSt.color} bg-opacity-50">
                            <div class="flex items-center gap-2 mb-1">
                                <div class="w-6 h-6 rounded-full bg-white flex items-center justify-center text-xs shadow-sm"><i class="fas fa-briefcase opacity-80"></i></div>

                            </div>
                            <div class="text-xs font-bold mt-1">${cSt.text}</div>

        // === 原本命与 2026 专属解析保留 (重构以适配新结构) ===
        function analyzePalaceDeeply(palace, astrolabe, birthStem) {
            const pConfig = PALACE_CONFIG[palace.name] || { type: 'general', label: palace.name };
            const majors = palace.majorStars.map(s => s.name);
            const minors = palace.minorStars.map(s => s.name);
            const borrow = majors.length === 0;
            const pDui = astrolabe.palace((palace.index + 6) % 12);
            const activeStars = borrow ? pDui.majorStars.map(s => s.name) : majors;
            const sanFangStars =[
                ...astrolabe.palace((palace.index + 4) % 12).majorStars,
                ...astrolabe.palace((palace.index + 8) % 12).majorStars,
                ...pDui.majorStars
            ].map(s => s.name);

            let coreText = "";
            let starTraits =[];
            
            if (activeStars.length === 0) {
                coreText = "此宫位无主星，格局较弱，易受环境影响，缺乏定性。";
            } else {
                const specificDesc = activeStars.map(s => (SMART_ANALYSIS[pConfig.type] || {})[s]).filter(Boolean);
                if (specificDesc.length > 0) coreText = specificDesc.join(' ');
                else {
                    activeStars.forEach(star => { if(STAR_BASE[star]) starTraits.push(STAR_BASE[star].title); });
                    coreText = `主星坐守【${activeStars.join('、')}】，呈现${starTraits.join('、')}之象。`;
                    activeStars.forEach(s => { if(STAR_BASE[s]) coreText += STAR_BASE[s].trait; });
                }
                if (borrow) coreText = `(借对宫)${coreText}`;
            }

            let patternText = "";
            let sihuaTags =[];
            activeStars.forEach(star => {
                const type = getSiHua(star, birthStem);
                if (type) {
                    const info = SI_HUA_DICT[type];
                    patternText += `<b>${star}${info.label}</b>：${info.effect}<br>`;
                    sihuaTags.push(`<span class="${info.color} bg-white border px-1 rounded text-xs">${info.label}</span>`);
                }
            });
            const lucky = sanFangStars.filter(s =>['左辅','右弼','天魁','天钺','文昌','文曲'].includes(s));
            const unlucky = minors.filter(s =>['擎羊','陀罗','火星','铃星','地空','地劫'].includes(s));
            if (lucky.length > 0) patternText += `三方会照吉星【${lucky.slice(0,2).join('+')}】，外力支援强。<br>`;
            if (unlucky.length > 0) patternText += `需防煞星【${unlucky.join('、')}】干扰。`;
            if (!patternText) patternText = "格局相对平稳，无剧烈吉凶冲照。";

            let adviceText = "";
            const hasJi = activeStars.some(s => getSiHua(s, birthStem) === '忌');
            const hasSha = unlucky.length > 0;

            if (pConfig.type === 'wealth') adviceText = (hasJi || hasSha) ? "忌借贷、担保，宜积谷防饥。" : "财气顺遂，可适当扩大投资。";
            else if (pConfig.type === 'career') adviceText = hasJi ? "职场易有口舌，建议低调行事。" : "事业稳步上升，适合深耕。";
            else if (pConfig.type === 'health') adviceText = (hasJi || hasSha) ? "定期体检，注意作息，防慢性病。" : "体质健康，适度运动。";
            else adviceText = hasSha ? "运势稍显动荡，心态宜宽。" : "运势平顺，可顺势而为。";

            return { core: coreText, pattern: patternText, advice: adviceText, stars: activeStars, sihuaTags: sihuaTags, isBorrowed: borrow };
        }

        function renderDeepReport(astrolabe, birthStem) {
            const container = document.getElementById('profileContent');
            container.innerHTML = '';
            const focusPalaces =['命宫', '财帛', '官禄', '夫妻', '疾厄'];
            focusPalaces.forEach(pName => {
                const palace = astrolabe.palaces.find(p => p.name === pName);
                if (!palace) return;
                const config = PALACE_CONFIG[pName];
                const analysis = analyzePalaceDeeply(palace, astrolabe, birthStem);
                const card = document.createElement('div');
                card.className = 'synthesis-card fade-in';
                let starBadges = analysis.stars.map(s => `<span class="keyword-box">${s}</span>`).join('');
                if (analysis.isBorrowed) starBadges = `<span class="text-xs text-gray-400 mr-2">(借对宫)</span>` + starBadges;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon"><i class="fas ${config.icon}"></i></div>
                        <div>
                            <div class="card-title">${pName} <span class="text-sm font-normal text-slate-400">(${palace.earthlyBranch})</span></div>
                            <div class="text-xs text-slate-500">${config.label}</div>
                        </div>
                        <div class="ml-auto flex flex-col items-end gap-1">
                            <div>${starBadges}</div>
                            <div class="flex gap-1">${analysis.sihuaTags.join('')}</div>
                        </div>
                    </div>
                    <div class="deep-section ds-core"><div class="ds-title"><i class="fas fa-gem"></i> 核心特质</div><div class="ds-content">${analysis.core}</div></div>
                    <div class="deep-section ds-pattern"><div class="ds-title"><i class="fas fa-chess-board"></i> 格局研判</div><div class="ds-content">${analysis.pattern}</div></div>
                    <div class="deep-section ds-advice"><div class="ds-title"><i class="fas fa-lightbulb"></i> 趋吉避凶</div><div class="ds-content">${analysis.advice}</div></div>
                `;
                container.appendChild(card);
            });
        }

        function analyze2026Deeply(astrolabe) {
            const horsePalace = astrolabe.palaces.find(p => p.earthlyBranch === '午');
            const yIndex = horsePalace.index;
            const overlapping = horsePalace.name; 
            
            let contentHTML = `
                <div class="synthesis-card">
                    <div class="card-header"><div class="card-icon bg-red-500"><i class="fas fa-compass"></i></div><div class="card-title">2026 流年大盘总纲</div></div>
                    <div class="text-sm text-slate-700 leading-relaxed mb-3">
                        2026年为<b>丙午年</b>，流年命宫在【午】位，叠本命【${overlapping}】。此年您会特别关注“${overlapping}”相关的议题。
                        <br>丙干引发：<b>天同化禄、天机化权、文昌化科、廉贞化忌</b>。
                    </div>
                    <div class="warn-box">
                        <div class="warn-title"><i class="fas fa-exclamation-triangle"></i> 核心避坑：廉贞化忌</div>
                        <div class="text-xs mt-1 text-slate-700">廉贞化忌带来是非、官非、纠结与血液炎症问题。今年务必注意文书合同，远离桃花劫，凡事切忌钻牛角尖。</div>
                    </div>
                </div>
            `;
            document.getElementById('content2026').innerHTML = contentHTML;
        }

        // === 交互与执行 ===
        function switchTab(id) {
            ['tab1','tab2','tab3'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2','btn-tab3'].forEach(b => { 
                const btn = document.getElementById(b);
                const isRed = b === 'btn-tab3';
                const activeClass = isRed ? 'text-red-600 tab-active' : 'tab-active';
                const inactiveClass = isRed ? 'text-red-600 tab-inactive' : 'tab-inactive';
                btn.className = (b==='btn-'+id) ? `flex-1 py-3 text-xs sm:text-sm ${activeClass}` : `flex-1 py-3 text-xs sm:text-sm ${inactiveClass}`; 
            });
        }

        function calculate() {
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                const tstRes = getTrueSolarDate(`${y}-${m}-${d} ${t}`, loc);
                document.getElementById('solarHint').innerHTML = `<i class="fas fa-clock"></i> 真太阳时：${tstRes.date.getHours()}:${String(tstRes.date.getMinutes()).padStart(2,'0')} (经度修正)`;

                const dateData = calculateBaZiData(tstRes.date);
                document.getElementById('birthStemDisplay').innerHTML = `
                    <span>农历：${dateData.lunarStr}</span> | 
                    <span>八字：${dateData.baziStr}</span>
                `;

                const tstY = tstRes.date.getFullYear();
                const tstM = String(tstRes.date.getMonth()+1).padStart(2,'0');
                const tstD = String(tstRes.date.getDate()).padStart(2,'0');
                const timeIndex = Math.floor((tstRes.date.getHours() + 1) / 2) % 12;
                
                const astrolabe = iztro.astro.bySolar(`${tstY}-${tstM}-${tstD}`, timeIndex, gender, true, 'zh-CN');

                // 核心渲染
                renderOverallPattern(astrolabe);
                renderDeepReport(astrolabe, dateData.zwYearStem);
                renderDynamicYear(astrolabe);
                renderMonthlyForecast(astrolabe);
                analyze2026Deeply(astrolabe);

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1'); 

            } catch(e) { console.error(e); alert('排盘失败，请检查输入'); }
        }

        (function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1950; i--) y.add(new Option(i+'年', i));
            y.value = 1995; 
            for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=15;
        })();
    </script>
