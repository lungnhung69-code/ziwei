<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>紫微斗数 - 综合推演版 V26.0 (流月旗舰版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/iztro@2.5.3/dist/iztro.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #f8fafc; color: #333; }
        
        /* 选项卡样式 */
        .tab-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; background: white; font-weight: 800; }
        .tab-inactive { color: #64748b; background: #f1f5f9; font-weight: 500; }

        /* 通用卡片 */
        .synthesis-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed #cbd5e1; }
        .card-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .card-title { font-size: 17px; font-weight: 800; color: #1e293b; }
        
        /* Tab 1 专用 (V23样式) */
        .infer-text { font-size: 15px; line-height: 1.7; color: #475569; text-align: justify; }
        .keyword { color: #4338ca; font-weight: bold; background: #e0e7ff; padding: 0 4px; border-radius: 3px; }
        .suggestion-box { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 12px; margin-top: 10px; border-radius: 4px; font-size: 14px; color: #92400e; }
        .special-tip { background: #fdf2f8; border-left: 4px solid #db2777; padding: 12px; margin-top: 10px; border-radius: 4px; font-size: 14px; color: #9d174d; }

        /* Tab 2 流月卡片 (仿图2样式) */
        .moon-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; position: relative; overflow: hidden; }
        .moon-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .moon-status { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
        
        /* 状态颜色 */
        .status-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .status-safe { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .status-good { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        /* 格局框 */
        .pattern-box { background: #f5f3ff; border-radius: 8px; padding: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 4px; }
        .pattern-tag { background: #7c3aed; color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; width: fit-content; font-weight: bold; }
        .pattern-desc { font-size: 13px; color: #5b21b6; font-weight: 500; }

        /* 吉凶象 */
        .stars-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .star-col-header { font-size: 12px; font-weight: bold; margin-bottom: 6px; }
        .star-tag { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-right: 4px; margin-bottom: 4px; font-weight: 500; }
        .star-good { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .star-bad { background: #fff1f2; color: #be123c; border: 1px solid #fda4af; }

        /* 宜忌 */
        .action-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; font-size: 13px; }
        .action-icon { width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; margin-top: 2px; }
        .icon-yi { background: #22c55e; }
        .icon-ji { background: #ef4444; }
        .action-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .act-tag { background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 4px; font-size: 12px; }

    </style>
</head>
<body class="pb-20">

    <!-- 顶部 -->
    <div class="bg-white sticky top-0 z-50 shadow-sm border-b border-slate-200">
        <div class="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="font-bold text-xl text-slate-800 tracking-wide">
                <i class="fas fa-compass text-indigo-600 mr-2"></i>紫微斗数 · 全息推演
            </h1>
            <span class="text-xs bg-indigo-600 text-white px-2 py-1 rounded font-bold">V26.0</span>
        </div>
    </div>

    <div class="max-w-2xl mx-auto p-4 space-y-4">
        
        <!-- 输入区域 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <div class="grid grid-cols-3 gap-2">
                <select id="selYear" class="border p-2.5 rounded-lg text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-100"></select>
                <select id="selMonth" class="border p-2.5 rounded-lg text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-100"></select>
                <select id="selDay" class="border p-2.5 rounded-lg text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-100"></select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="time" id="birthTime" value="10:15" class="border p-2.5 rounded-lg text-sm w-full bg-slate-50 outline-none">
                <select id="gender" class="border p-2.5 rounded-lg text-sm bg-slate-50 outline-none"><option value="女">女</option><option value="男">男</option></select>
            </div>
            <div class="relative">
                <input type="text" id="location" value="河南周口" placeholder="出生地" class="border p-2.5 rounded-lg text-sm w-full pl-9 bg-slate-50 outline-none">
                <i class="fas fa-map-marker-alt absolute left-3 top-3 text-slate-400"></i>
            </div>
            <button onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold shadow-lg transition flex justify-center items-center gap-2 text-sm">
                <span>🚀 启动深度推演</span>
            </button>
            <div id="solarHint" class="text-xs text-center text-slate-400 h-4"></div>
        </div>

        <!-- 结果区 -->
        <div id="resultArea" class="hidden space-y-4 fade-in">
            <div class="flex bg-white rounded-xl shadow-sm overflow-hidden sticky top-[72px] z-40 border border-slate-200">
                <button onclick="switchTab('tab1')" id="btn-tab1" class="flex-1 py-3.5 text-sm tab-active">全息画像</button>
                <button onclick="switchTab('tab2')" id="btn-tab2" class="flex-1 py-3.5 text-sm tab-inactive">流月运势</button>
            </div>

            <!-- Tab 1: 全息画像 (V23 Classic) -->
            <div id="tab1" class="space-y-4">
                <div class="synthesis-card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fas fa-user"></i></div>
                        <span class="card-title">命宫 · 核心与三方</span>
                    </div>
                    <div id="logicMing" class="infer-text"></div>
                </div>
                <div class="synthesis-card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fas fa-wallet"></i></div>
                        <span class="card-title">财富事业 · 综合格局</span>
                    </div>
                    <div id="logicCareer" class="infer-text"></div>
                </div>
                <div class="synthesis-card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fas fa-heart"></i></div>
                        <span class="card-title">情感婚姻 · 隐秘逻辑</span>
                    </div>
                    <div id="logicLove" class="infer-text"></div>
                </div>
            </div>

            <!-- Tab 2: 流月运势 (V26 Flagship) -->
            <div id="tab2" class="hidden space-y-5">
                
                <div class="flex items-center gap-2 mb-2 px-2">
                    <div class="w-1 h-4 bg-indigo-600 rounded-full"></div>
                    <h3 class="font-bold text-slate-700">未来三月运势前瞻</h3>
                </div>

                <!-- 动态生成的流月卡片容器 -->
                <div id="monthlyForecast" class="space-y-4"></div>

                <div class="text-center text-xs text-slate-400 py-4">
                    已为您排盘至 <span id="endMonthLabel"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 1. 核心数据字典 (增强版) ===

        // 农历映射 (解决 undefined)
        const LUNAR_MONTHS = ["正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];

        // 星曜行动指南 (Do's & Don'ts)
        const STAR_ACTION_MAP = {
            '紫微': { yi: ['决策','领导','请客'], ji: ['傲慢','独断'] },
            '天机': { yi: ['策划','学习','短途差旅'], ji: ['犹豫','钻牛角尖'] },
            '太阳': { yi: ['公益','宣传','社交'], ji: ['过劳','强出头'] },
            '武曲': { yi: ['理财','执行','运动'], ji: ['借贷','冷战'] },
            '天同': { yi: ['聚餐','休闲','调解'], ji: ['懒散','拖延'] },
            '廉贞': { yi: ['公关','创意','艺术'], ji: ['官非','桃花劫'] },
            '天府': { yi: ['储蓄','置业','守成'], ji: ['孤立','保守'] },
            '太阴': { yi: ['美容','内务','理财'], ji: ['熬夜','情绪化'] },
            '贪狼': { yi: ['交际','应酬','副业'], ji: ['贪婪','烂桃花'] },
            '巨门': { yi: ['演讲','研究','看牙医'], ji: ['争执','八卦'] },
            '天相': { yi: ['辅助','签约','做媒'], ji: ['作保','盲从'] },
            '天梁': { yi: ['养生','读书','探病'], ji: ['孤傲','说教'] },
            '七杀': { yi: ['冲刺','改革','决断'], ji: ['受伤','飙车'] },
            '破军': { yi: ['创新','装修','断舍离'], ji: ['破坏','破财'] },
            '左辅': { yi: ['合作','求助'], ji: [] },
            '右弼': { yi: ['辅佐','沟通'], ji: [] },
            '文昌': { yi: ['考试','写作'], ji: ['失误'] },
            '文曲': { yi: ['演艺','才艺'], ji: ['口误'] },
            '天魁': { yi: ['提拔','贵人'], ji: [] },
            '天钺': { yi: ['机遇','桃花'], ji: [] },
            '擎羊': { yi: ['快刀斩乱麻','外科手术'], ji: ['冲动','受伤','动怒'] },
            '陀罗': { yi: ['研究','磨练耐心'], ji: ['拖延','纠结','原地打转'] },
            '火星': { yi: ['速战速决','突发灵感'], ji: ['发火','烧伤','急躁'] },
            '铃星': { yi: ['冷静思考'], ji: ['生闷气','算旧账'] },
            '地空': { yi: ['冥想','玄学','创意'], ji: ['投资','实务','丢东西'] },
            '地劫': { yi: ['布施','舍得'], ji: ['被骗','破财','冒险'] },
            '化忌': { yi: ['低调','修心'], ji: ['硬碰硬','期望过高'] },
            '化禄': { yi: ['投资','享受'], ji: ['浪费'] }
        };

        // 吉凶星分类
        const LUCKY_STARS = ['紫微','天府','太阳','太阴','天相','天梁','天同','左辅','右弼','天魁','天钺','文昌','文曲','化禄','化权','化科','禄存'];
        const UNLUCKY_STARS = ['擎羊','陀罗','火星','铃星','地空','地劫','化忌','七杀','破军','廉贞','贪狼','巨门']; // 杀破狼等中性偏动荡，此处简化处理

        // V23 全息画像逻辑 (保留原有逻辑)
        const COMBO_LOGIC = {
            '天机': { base: '善于谋略的智多星，心思细腻。', career: '靠脑力、技术、变动生财。', love: '感情易变，配偶聪明但心思重。' },
            '太阳+天梁': { base: '【阳梁昌禄】格雏形，为人正派。', career: '名气大于财气，利公职文教。', love: '配偶如长辈般照顾或管束。' },
            '无主星': { base: '宫位空虚，受环境影响大。', handle: '借对宫星曜，力量减半但变数增加。' }
        };

        // 经纬度
        const CITY_LONGITUDES={'北京':116.40,'上海':121.47,'广州':113.23,'深圳':114.05,'成都':104.06,'武汉':114.31,'西安':108.95,'周口':114.65,'郑州':113.65};

        // === 2. 工具函数 ===

        function _getStars(p) { return p?.majorStars || []; }
        function _getMinors(p) { return p?.minorStars || []; }
        
        function _analyzeStars(palace, astrolabe) {
            if (!palace) return { starStr: '未知', stars: [], type: 'error' };
            const majors = _getStars(palace);
            if (majors.length > 0) {
                const names = majors.map(s => s.name);
                return { stars: majors, type: 'solid', key: names.join('+'), starStr: names.join('、') };
            }
            const duiIdx = (palace.index + 6) % 12;
            const duiPalace = astrolabe.palace(duiIdx);
            const duiMajors = _getStars(duiPalace);
            const names = duiMajors.map(s => s.name);
            return { stars: duiMajors, type: 'empty', key: names.join('+'), starStr: names.join('、') };
        }

        // === 3. 核心渲染逻辑 ===

        function calculate() {
            if (typeof iztro === 'undefined') { alert("资源加载中..."); return; }
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                // 真太阳时
                let lng = 120; for(let c in CITY_LONGITUDES) if(loc.includes(c)) lng=CITY_LONGITUDES[c];
                const offset = (lng - 120) * 4;
                const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
                dateObj.setMinutes(dateObj.getMinutes() + offset);
                let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;
                document.getElementById('solarHint').innerText = `✅ 真太阳时校准: ${loc} (${lng>120?'+':''}${Math.round(offset)}分)`;

                // 排盘
                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                renderTab1(astrolabe);
                renderTab2(astrolabe);
                
                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab2'); // 默认看流月体验新功能

            } catch(e) { alert('排盘错误: ' + e.message); console.error(e); }
        }

        function renderTab1(astrolabe) {
            // 复刻 V23 逻辑，保持不变
            const pMing = astrolabe.palaces.find(p=>p.name==='命宫');
            const pGuan = astrolabe.palaces.find(p=>p.name==='官禄');
            const pCai = astrolabe.palaces.find(p=>p.name==='财帛');
            const pFu = astrolabe.palaces.find(p=>p.name==='夫妻');

            const dMing = _analyzeStars(pMing, astrolabe);
            const dGuan = _analyzeStars(pGuan, astrolabe);
            const dCai = _analyzeStars(pCai, astrolabe);
            const dFu = _analyzeStars(pFu, astrolabe);

            let mingHTML = `<p>您是<span class="keyword">${dMing.starStr}</span>坐命。`;
            if(dMing.type==='empty') mingHTML += `命无正曜，性格如水，易随环境而变。核心特质需参考对宫。`;
            else mingHTML += COMBO_LOGIC[dMing.key]?.base || `核心特质：${dMing.stars.map(s=>s.name).join('、')}。`;
            mingHTML += `<div class="suggestion-box">💡 <b>发展建议：</b>发挥您的主星优势，扬长避短。${dMing.key.includes('机')?'注意神经系统保养，多冥想。':''}</div>`;
            document.getElementById('logicMing').innerHTML = mingHTML;

            let careerHTML = `<p>财官线：财帛${dCai.starStr}，官禄${dGuan.starStr}。</p>`;
            if(dCai.type==='empty' && dGuan.type==='empty') careerHTML += `<p><b>双空格局：</b>适合中介、自由职业或依附大平台。</p>`;
            else careerHTML += `<p>适合在变动中求财，或凭借专业技术立身。</p>`;
            document.getElementById('logicCareer').innerHTML = careerHTML;

            let loveHTML = `<p>夫妻宫坐${dFu.starStr}。</p>`;
            if(dFu.type==='empty') loveHTML += `<p class="special-tip">缘分较淡，或对另一半要求不明确。</p>`;
            else loveHTML += `<p>配偶性格：${dFu.starStr}。相处中需多包容。</p>`;
            document.getElementById('logicLove').innerHTML = loveHTML;
        }

        // === 旗舰级流月渲染 (核心修改) ===
        function renderTab2(astrolabe) {
            const container = document.getElementById('monthlyForecast');
            container.innerHTML = '';
            
            const now = new Date();
            let lastDateStr = '';

            // 生成未来3个月
            for (let i = 0; i < 3; i++) {
                const fDate = new Date();
                fDate.setMonth(now.getMonth() + i);
                const year = fDate.getFullYear();
                const month = fDate.getMonth() + 1;
                const fStr = `${year}-${String(month).padStart(2,'0')}-15 12:00:00`;
                
                let scope;
                try { scope = astrolabe.horoscope(fStr); } catch(e) { continue; }

                if (scope && scope.monthly) {
                    const mIndex = scope.monthly.index;
                    const mPalace = astrolabe.palace(mIndex);
                    
                    // 1. 获取所有星曜 (主星+副星+流年/流月飞星)
                    // 注: iztro basic output doesn't put all small stars in one array easily, 
                    // we manually combine major + minor for analysis
                    const allStars = [...mPalace.majorStars, ...mPalace.minorStars];
                    const starNames = allStars.map(s => s.name);
                    
                    // 2. 吉凶分析
                    const goodStars = starNames.filter(n => LUCKY_STARS.some(ls => n.includes(ls)));
                    const badStars = starNames.filter(n => UNLUCKY_STARS.some(us => n.includes(us)));
                    
                    // 3. 状态判定算法
                    let score = goodStars.length - badStars.length * 1.5; // 凶星权重略大
                    let statusLabel = '平稳过渡';
                    let statusClass = 'status-safe';
                    let statusIcon = '<i class="fas fa-balance-scale"></i>';

                    if (badStars.length >= 2 || starNames.includes('化忌') || starNames.includes('地空') && starNames.includes('地劫')) {
                        statusLabel = '严阵以待'; statusClass = 'status-danger'; statusIcon = '<i class="fas fa-exclamation-triangle"></i>';
                    } else if (score >= 2 || starNames.includes('化禄') || starNames.includes('紫微')) {
                        statusLabel = '吉星高照'; statusClass = 'status-good'; statusIcon = '<i class="fas fa-star"></i>';
                    }

                    // 4. 格局文案
                    let patternTitle = "本月格局";
                    let patternDesc = "运势平稳，按部就班。";
                    if (mPalace.majorStars.length === 0) {
                        patternTitle = "空宫无主"; patternDesc = "心绪不宁，容易受环境左右，宜静不宜动。";
                    } else if (starNames.includes('地空') || starNames.includes('地劫')) {
                        patternTitle = "空劫入命"; patternDesc = "得失心不要太重，财来财去，宜修身养性。";
                    } else if (starNames.includes('擎羊') || starNames.includes('陀罗')) {
                        patternTitle = "羊陀相侵"; patternDesc = "好事多磨，容易有阻碍或拖延，需耐心。";
                    } else if (starNames.includes('紫微') && starNames.includes('七杀')) {
                        patternTitle = "紫杀化权"; patternDesc = "极具开创力，利于掌权和决策。";
                    }

                    // 5. 宜忌生成 (Top 5 stars)
                    let yiList = new Set();
                    let jiList = new Set();
                    
                    // 优先处理强星
                    const logicStars = [...mPalace.majorStars, ...mPalace.minorStars].slice(0, 5); 
                    logicStars.forEach(s => {
                        const logic = STAR_ACTION_MAP[s.name] || STAR_ACTION_MAP[s.name.replace('流','').replace('年','')]; // 模糊匹配
                        if (logic) {
                            logic.yi.forEach(x => yiList.add(x));
                            logic.ji.forEach(x => jiList.add(x));
                        }
                    });
                    
                    // 默认值
                    if(yiList.size === 0) yiList.add('安分');
                    if(jiList.size === 0) jiList.add('冒险');

                    // 6. 农历处理
                    const lunarM = scope.lunarDate ? scope.lunarDate.month : (month - 1); // Fallback
                    const lunarStr = LUNAR_MONTHS[lunarM - 1] ? LUNAR_MONTHS[lunarM - 1] : "未知";

                    // === 构建 HTML ===
                    const card = document.createElement('div');
                    card.className = 'moon-card fade-in';
                    card.innerHTML = `
                        <div class="moon-header">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">${year}年${month}月</h2>
                                <div class="text-xs text-slate-400 mt-1">农历${lunarStr}月 · 流月在【${mPalace.name}】</div>
                            </div>
                            <div class="moon-status ${statusClass}">
                                ${statusIcon} ${statusLabel}
                            </div>
                        </div>

                        <div class="pattern-box">
                            <span class="pattern-tag">${patternTitle}</span>
                            <span class="pattern-desc">${patternDesc}</span>
                        </div>

                        <div class="stars-grid">
                            <div class="bg-emerald-50 p-2 rounded-lg border border-emerald-100">
                                <div class="star-col-header text-emerald-700">吉象 (点击查看)</div>
                                <div>${goodStars.length ? goodStars.map(s => `<span class="star-tag star-good">${s}</span>`).join('') : '<span class="text-xs text-gray-400">无明显吉星</span>'}</div>
                            </div>
                            <div class="bg-rose-50 p-2 rounded-lg border border-rose-100">
                                <div class="star-col-header text-rose-700">凶象 (点击查看)</div>
                                <div>${badStars.length ? badStars.map(s => `<span class="star-tag star-bad">${s}</span>`).join('') : '<span class="text-xs text-gray-400">无明显凶星</span>'}</div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <div class="action-row">
                                <div class="action-icon icon-yi"><i class="fas fa-check"></i></div>
                                <div class="action-tags">
                                    ${Array.from(yiList).slice(0,4).map(t => `<span class="act-tag">${t}</span>`).join('')}
                                </div>
                            </div>
                            <div class="action-row">
                                <div class="action-icon icon-ji"><i class="fas fa-times"></i></div>
                                <div class="action-tags">
                                    ${Array.from(jiList).slice(0,4).map(t => `<span class="act-tag">${t}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                    lastDateStr = `${year}年${month}月`;
                }
            }
            document.getElementById('endMonthLabel').innerText = lastDateStr;
        }

        // 辅助逻辑
        function switchTab(id) {
            ['tab1','tab2'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-3.5 text-sm tab-active' : 'flex-1 py-3.5 text-sm tab-inactive'; 
            });
        }

        // 初始化日期
        (function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1940; i--) y.add(new Option(i+'年', i));
            y.value = 1995; for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=15;
        })();
    </script>
</body>
</html>
