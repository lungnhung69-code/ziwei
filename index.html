            return astrolabe.palaces.find(p => p.name.includes(keyword));
        }
        function _getStars(palace) { return (palace && palace.majorStars) ? palace.majorStars : []; }
        function _getMinors(palace) { return (palace && palace.minorStars) ? palace.minorStars : []; }
        
        function _getSmartStars(palace, astrolabe) {
            if (!palace) return { stars: [], isBorrowed: false, src: '无' };
            const majors = _getStars(palace);
            if (majors.length > 0) return { stars: majors, isBorrowed: false, src: palace.name };
            
            const duiIdx = (palace.index + 6) % 12;
            const duiPalace = astrolabe.palace(duiIdx);
            return { stars: _getStars(duiPalace), isBorrowed: true, src: duiPalace.name };
        }

            y.value = 1983; 
            for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=18;
        }

        function calculate() {
            if (typeof iztro === 'undefined') { alert("资源加载中..."); return; }
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                let longitude = 120, matchedCity = '';
                for (let city in CITY_LONGITUDES) {
                    if (loc.includes(city)) { longitude = CITY_LONGITUDES[city]; matchedCity = city; break; }
                }
                const offset = (longitude - 120) * 4;
                const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
                dateObj.setMinutes(dateObj.getMinutes() + offset);
                let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;

                document.getElementById('solarHint').innerText = matchedCity ? `✅ 真太阳时已校准 (${matchedCity})` : "ℹ️ 默认北京时间";

                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                generateMasterReport(astrolabe, parseInt(y));
                renderPalaceDetail(astrolabe);
                renderDecades(astrolabe, parseInt(y));

                alert('排盘失败: ' + e.message);

            let mingHTML = `<p>您当前命宫在<b>【${pMing.name}】</b>，`;
            
            if (mingData.isBorrowed) {
                mingHTML += `本宫无主星，呈现<b>“借星安宫”</b>的格局。这意味着您的性格可塑性极强，像水一样善于适应环境。`;
                mingHTML += `您的核心性格参考对宫（${mingData.src}）的主星：<b>${mingData.stars.map(s=>s.name).join('、')}</b>。`;
            } else {
                mingHTML += `主星为<b>${mingData.stars.map(s=>s.name).join('、')}</b>坐守。`;
            }

            mingHTML += `</p><div class="mt-4 space-y-4">`;
            
            // 遍历主星，生成深度内容
            mingData.stars.forEach(s => {
                if(MASTER_TEXT[s.name]) {
                    mingHTML += `
                    <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                        <div class="font-bold text-indigo-800 text-lg mb-2">【${s.name}】</div>
                        <p class="text-sm text-slate-700 leading-relaxed mb-2">${MASTER_TEXT[s.name].trait}</p>
                        <div class="advice-box">💡 <b>大师建议：</b>发挥优势，扬长避短。${s.name === '天机' ? '多做运动放松神经，避免钻牛角尖。' : '保持谦逊，广结善缘。'}</div>
                    </div>`;
                }
            });
            mingHTML += `</div>`;
            document.getElementById('reportMing').innerHTML = mingHTML;

            // 2. 事业财运 (联合解读)
            const pGuan = findPalace(astrolabe, '官');
            const pCai = findPalace(astrolabe, '财');
            const guanData = _getSmartStars(pGuan, astrolabe);
            const caiData = _getSmartStars(pCai, astrolabe);
            
            let careerHTML = `<div class="mb-6"><div class="font-bold text-lg text-slate-800 mb-3 border-l-4 border-amber-500 pl-3">官禄宫（事业方向）</div>`;
            
            if(guanData.stars.length > 0) {
                if(guanData.isBorrowed) careerHTML += `<p class="text-xs text-slate-400 mb-2">（本宫无主星，借对宫星曜分析）</p>`;
                guanData.stars.forEach(s => {
                    if(MASTER_TEXT[s.name]) careerHTML += `<div class="mb-3 text-sm text-slate-700"><span class="font-bold text-amber-600">· ${s.name}：</span>${MASTER_TEXT[s.name].career}</div>`;
                });
            } else {
                careerHTML += `<p class="text-sm text-slate-500">事业宫无主星，代表您的职业变动可能较大，或者适合从事自由职业、副业，不宜死守一个岗位。</p>`;
            }
            careerHTML += `</div>`;

            careerHTML += `<div><div class="font-bold text-lg text-slate-800 mb-3 border-l-4 border-amber-500 pl-3">财帛宫（财富来源）</div>`;
            if(caiData.stars.length > 0) {
                if(caiData.isBorrowed) careerHTML += `<p class="text-xs text-slate-400 mb-2">（本宫无主星，借对宫星曜分析）</p>`;
                caiData.stars.forEach(s => {
                    if(MASTER_TEXT[s.name]) careerHTML += `<div class="mb-3 text-sm text-slate-700"><span class="font-bold text-amber-600">· ${s.name}：</span>${MASTER_TEXT[s.name].wealth}</div>`;
                });
            } else {
                careerHTML += `<p class="text-sm text-slate-500">财帛宫无主星，财运需靠积少成多，不宜进行高风险投机。建议多储蓄。</p>`;
            }
            careerHTML += `</div>`;
            document.getElementById('reportCareer').innerHTML = careerHTML;

            // 3. 婚姻情感
            const pFu = findPalace(astrolabe, '夫');
            const fuData = _getSmartStars(pFu, astrolabe);
            let loveHTML = `<div class="font-bold text-lg text-slate-800 mb-3 border-l-4 border-pink-500 pl-3">夫妻宫（缘分深浅）</div>`;
            
            if(fuData.stars.length > 0) {
                if(fuData.isBorrowed) loveHTML += `<p class="text-xs text-slate-400 mb-2">（本宫无主星，借对宫星曜分析）</p>`;
                
                // 双星联合解读逻辑（例如太阳天梁）
                let starNames = fuData.stars.map(s => s.name);
                if (starNames.includes('太阳') && starNames.includes('天梁')) {
                    loveHTML += `<div class="bg-pink-50 p-3 rounded-lg border border-pink-100 mb-3 text-sm text-slate-700">
                        <b>【阳梁昌禄】格局：</b>配偶通常为人正派，有长者风范或公职身份。虽然感情稳定，但可能缺乏浪漫，相处模式比较像“师生”或“兄妹”，对方喜欢管教您。
                    </div>`;
                }

                fuData.stars.forEach(s => {
                    if(MASTER_TEXT[s.name]) loveHTML += `<div class="mb-3 text-sm text-slate-700"><span class="font-bold text-pink-600">· ${s.name}：</span>${MASTER_TEXT[s.name].love}</div>`;
                });
            } else {
                loveHTML += `<div class="text-sm text-slate-600 bg-slate-50 p-4 rounded leading-relaxed">
                    夫妻宫无主星，通常代表缘分来得比较晚，或者您对另一半的要求并不明确（随缘）。两人的相处模式可能比较像朋友，淡淡的，不一定有轰轰烈烈的激情，但细水长流也是一种福气。
                </div>`;
            }
            document.getElementById('reportLove').innerHTML = loveHTML;
        }

        // === Tab 2: 十二宫 (保持精准) ===
        function renderPalaceDetail(astrolabe) {
            const list = document.getElementById('palacesList');
            list.innerHTML = '';
            const order = [
                {k:'命', n:'命宫'}, {k:'兄', n:'兄弟宫'}, {k:'夫', n:'夫妻宫'}, {k:'子', n:'子女宫'},
                {k:'财', n:'财帛宫'}, {k:'疾', n:'疾厄宫'}, {k:'迁', n:'迁移宫'}, {k:'友', n:'交友宫'},
                {k:'官', n:'官禄宫'}, {k:'田', n:'田宅宫'}, {k:'福', n:'福德宫'}, {k:'父', n:'父母宫'}
            ];
            
            order.forEach(obj => {
                const p = findPalace(astrolabe, obj.k);
                if (!p) return;
                const data = _getSmartStars(p, astrolabe);
                const minors = _getMinors(p);
                
                let starsHtml = '';
                if(data.isBorrowed) starsHtml += `<span class="tag tag-jie">借星</span>`;
                starsHtml += data.stars.map(s => `<span class="font-bold text-indigo-700 mr-1 text-base">${s.name}</span><span class="text-xs opacity-50 mr-2 brightness-${s.brightness}">${s.brightness}</span>`).join('');

                const minorsHtml = minors.map(s => {
                    let cls = 'text-slate-400';
                    if(['左辅','右弼','天魁','天钺','禄存'].includes(s.name)) cls = 'tag tag-ji';
                    if(['擎羊','陀罗','火星','铃星'].includes(s.name)) cls = 'tag tag-sha';
                    return `<span class="${cls}">${s.name}</span>`;
                }).join('');

                const div = document.createElement('div');
                div.className = 'bg-white rounded-xl p-4 border border-slate-200 shadow-sm';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <div class="font-bold text-lg text-slate-800 border-l-4 border-indigo-500 pl-2">${obj.n}</div>
                        <div class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500 font-mono">${p.heavenlyStem}${p.earthlyBranch}</div>
                    </div>
                    <div class="palace-def">${PALACE_DEF[obj.n]}</div>
                    <div class="mb-2 min-h-[24px] flex items-center flex-wrap">${starsHtml}</div>
                    <div class="mb-2 flex flex-wrap gap-1">${minorsHtml}</div>
                `;
                list.appendChild(div);
            });
        }

        // === Tab 3: 大运流年 ===
        function renderDecades(astrolabe, birthYear) {
            const currentYear = new Date().getFullYear();
            const age = currentYear - birthYear + 1;
            
            let curDecade = null;
            astrolabe.palaces.forEach(p => {
                if (p.decadal && age >= p.decadal.range[0] && age <= p.decadal.range[1]) curDecade = p;
            });

            const infoDiv = document.getElementById('currentDecadeInfo');
            if(curDecade) {
                const data = _getSmartStars(curDecade, astrolabe);
                const starNames = data.stars.map(s=>s.name).join('、') || '无';
                
                infoDiv.innerHTML = `
                    <div class="text-xs opacity-70 mb-1">CURRENT DECADE (${curDecade.decadal.range[0]}-${curDecade.decadal.range[1]}岁)</div>
                    <div class="text-3xl font-bold mb-2">行运【${curDecade.name}】</div>
                    <div class="text-sm border-t border-white/20 pt-3">
                        <p><b>大限主星：</b>${starNames}</p>
                        <p class="mt-2 text-white/90 text-justify">这十年您的重点在于${curDecade.name}相关领域。<br>运势基调：${data.stars[0] ? MASTER_TEXT[data.stars[0].name].trait.substring(0,40)+'...' : '变动较大，需脚踏实地。'}</p>
                    </div>
                `;
            } else {
                infoDiv.innerHTML = '暂无大运数据';
            }

            const list = document.getElementById('decadeList');
            list.innerHTML = '';
            const sorted = [...astrolabe.palaces].sort((a,b) => a.decadal.range[0] - b.decadal.range[0]);
            
            sorted.slice(0, 8).forEach((p, i) => {
                if(!p.decadal) return;
                const data = _getSmartStars(p, astrolabe);
                const sName = data.stars.map(s=>s.name).join(' ') || '空';
                
                const div = document.createElement('div');
                div.className = 'flex gap-4 border-b border-slate-100 pb-4 mb-4 last:border-0';
                div.innerHTML = `
                    <div class="w-16 pt-1 text-center flex-shrink-0">
                        <div class="text-sm font-bold text-indigo-600 bg-indigo-50 rounded py-1">${p.decadal.range[0]}-${p.decadal.range[1]}岁</div>
                        <div class="text-xs text-slate-400 mt-1">第${i+1}运</div>
                    </div>
                    <div>
                        <div class="font-bold text-slate-800">行运【${p.name}】 <span class="text-xs font-normal text-slate-500">(${sName})</span></div>
                        <div class="text-sm text-slate-600 mt-1 text-justify">
                            重点关注${PALACE_DEF[p.name].split('、')[0].replace('代表您的【','').replace('】','')}。
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function switchTab(id) {
            ['tab1','tab2','tab3'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2','btn-tab3'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        init();
    </script>
</body>
</html>
