                });
            }
            if (analysis.borrowed) mainDesc = `(本宫空亡，借对宫<b>${analysis.stars.join('+')}</b>论断，力量减半)：` + mainDesc;
            analysis.text = mainDesc;

            // 4. 三方四正格局分析 (简易版)
            let pattern = [];
            if (sanFangStars.includes('左辅') || sanFangStars.includes('右弼')) pattern.push('辅弼拱照(有人帮)');
            if (sanFangStars.includes('文昌') || sanFangStars.includes('文曲')) pattern.push('昌曲拱照(利文书)');
            if (sanFangStars.includes('天魁') || sanFangStars.includes('天钺')) pattern.push('魁钺拱照(遇贵人)');
            if (sanFangMinors.some(s=>['擎羊','陀罗','火星','铃星','地空','地劫'].includes(s))) pattern.push('煞星冲照(有隐患)');
            
            // 四化冲照
            sanFangStars.forEach(sName => {
                const sh = getSiHuaDesc(sName, birthYearStem);
                if(sh && sh.type === '忌') pattern.push(`对宫/三合${sName}化忌冲入`);
                if(sh && sh.type === '禄') pattern.push(`对宫/三合${sName}化禄照入`);
            });

            analysis.sfText = pattern.length > 0 ? pattern.join(' · ') : '三方四正格局平稳';

            return analysis;
        }

        function getContextKey(pName) {
            const map = {
                '命宫': 'core', '迁移': 'core', 
                '财帛': 'wealth', '田宅': 'wealth',
                '官禄': 'career',
                '夫妻': 'love', '子女': 'love',
                '疾厄': 'health', '福德': 'health'
            };
            return map[pName] || 'base';
        }

        // === 3. 主程序逻辑 ===

        function calculate() {
            if (typeof iztro === 'undefined') { alert("资源加载中，请稍候..."); return; }
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                let lng = 120; for(let c in CITY_LONGITUDES) if(loc.includes(c)) lng=CITY_LONGITUDES[c];
                const offset = (lng - 120) * 4;
                const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
                dateObj.setMinutes(dateObj.getMinutes() + offset);
                let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;
                
                document.getElementById('solarHint').innerText = `✅ 真太阳时: ${loc} (${lng>120?'+':''}${Math.round(offset)}分)`;

                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                // 获取生年天干 (用于四化)
                const birthStem = astrolabe.chineseDate.yearly[0]; // 甲乙丙丁...

                renderFullProfile(astrolabe, birthStem);
                renderYearlyFortune(astrolabe, parseInt(y));

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1');

            } catch(e) { console.error(e); alert('排盘错误: ' + e.message); }
        }

        // 渲染 Tab 1: 全12宫位解析
        function renderFullProfile(astrolabe, birthStem) {
            const container = document.getElementById('profileContent');
            container.innerHTML = '';

            const groups = { core: [], people: [], body: [] };
            
            // 遍历所有宫位并分组
            astrolabe.palaces.forEach(p => {
                const def = PALACE_DEFS[p.name] || { group: 'body', icon: 'fa-star' };
                const data = analyzePalaceFull(p, astrolabe, birthStem);
                groups[def.group].push({ p, def, data });
            });

            // 渲染分组
            for (const [gKey, items] of Object.entries(groups)) {
                const groupTitle = document.createElement('div');
                groupTitle.className = 'group-title';
                groupTitle.innerHTML = GROUP_NAMES[gKey];
                container.appendChild(groupTitle);

                items.forEach(item => {
                    const { p, def, data } = item;
                    
                    // 标签HTML
                    let tagsHtml = data.tags.map(t => `<span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded mr-1">${t}</span>`).join('');
                    
                    // 主星胶囊
                    let starsHtml = data.stars.map(s => `<span class="keyword-box">${s}</span>`).join('');
                    if (data.stars.length === 0) starsHtml = `<span class="text-xs text-gray-400">无主星</span>`;

                    // 四化HTML
                    let sihuaHtml = '';
                    if (data.sihua.length > 0) {
                        sihuaHtml = `<div class="mt-2 flex flex-wrap gap-2">` + 
                            data.sihua.map(sh => `<span class="${sh.css} text-xs border border-current opacity-90">${sh.label}</span>`).join('') + 
                            `</div>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'synthesis-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-icon"><i class="fas ${def.icon}"></i></div>
                            <div>
                                <div class="card-title">${p.name} <span class="text-sm font-normal text-slate-500">(${p.earthlyBranch})</span></div>
                                <div class="text-xs text-slate-400">${def.desc}</div>
                            </div>
                            <div class="ml-auto flex flex-col items-end">
                                <div>${tagsHtml}</div>
                            </div>
                        </div>
                        <div class="infer-section">
                            <div class="infer-label">格局配置</div>
                            <div class="mb-2">${starsHtml}</div>
                            <div class="infer-text">${data.text}</div>
                            ${sihuaHtml}
                        </div>
                        <div class="sanfang-box">
                            <i class="fas fa-network-wired mr-1"></i> <b>三方四正互动：</b>${data.sfText}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // 渲染 Tab 2: 保持流年功能 (简化演示)
        function renderYearlyFortune(astrolabe, birthYear) {
            const now = new Date();
            const currentYear = now.getFullYear();
            const yearStr = currentYear + '-06-01 12:00:00'; 
            let yearlyScope; try { yearlyScope = astrolabe.horoscope(yearStr); } catch(e){}

            if (yearlyScope && yearlyScope.yearly) {
                 const yIndex = yearlyScope.yearly.index;
                 const yPalace = astrolabe.palace(yIndex);
                 const stars = yPalace.majorStars.map(s=>s.name).join('、') || '无主星';
                 
                 document.getElementById('yearContent').innerHTML = `
                    <div class="synthesis-card bg-gradient-to-r from-purple-50 to-white">
                        <h2 class="text-xl font-bold mb-2">${currentYear} 流年运势</h2>
                        <p class="text-sm text-slate-600 mb-4">流年命宫落在<b>${yPalace.name}</b>，主星：<b>${stars}</b></p>
                        <div class="infer-text">此处显示简略流年（详细流年请见全息画像中的运限盘分析，本版本重点展示命盘全貌）。建议关注流年四化对本命盘的引动。</div>
                    </div>
                 `;
            }
        }

        function switchTab(id) {
            ['tab1','tab2'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        (function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1940; i--) y.add(new Option(i+'年', i));
            y.value = 1995; for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=15;
        })();
    </script>
</body>
</html>
