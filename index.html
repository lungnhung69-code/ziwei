    <style>
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .tab-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; font-weight: 800; background: white; }
        .tab-inactive { color: #6b7280; background: #f9fafb; font-weight: 500; }
        
        .tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 4px; display: inline-block; font-weight: bold;}
        .tag-ji { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .tag-sha { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .tag-jie { background: #f3f4f6; color: #4b5563; border: 1px dashed #9ca3af; }

        .report-card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .report-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dashed #e5e7eb; }
        .report-icon { width: 32px; height: 32px; background: #eef2ff; color: #4338ca; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .report-title { font-size: 18px; font-weight: 800; color: #111827; }
        .report-content { font-size: 15px; line-height: 1.8; color: #4b5563; text-align: justify; }
        
        .advice-box { background: #fff7ed; border-left: 4px solid #f97316; padding: 12px; margin-top: 15px; border-radius: 4px; font-size: 14px; color: #9a3412; }
        .palace-def { font-size: 12px; color: #9ca3af; margin-bottom: 8px; border-bottom: 1px dashed #f3f4f6; padding-bottom: 6px;}
    </style>
</head>
<body class="pb-20 bg-slate-100">

    <div class="bg-white sticky top-0 z-50 shadow-sm border-b border-slate-200">

            <div class="relative">
                <input type="text" id="location" value="河南周口" placeholder="出生地" class="border p-3 rounded-lg text-sm w-full pl-10 outline-none bg-slate-50">

                <button onclick="switchTab('tab2')" id="btn-tab2" class="flex-1 py-4 text-sm tab-inactive">十二宫详解</button>

            },
            '破军': {
                ming: '喜新厌旧，创意无限，不按常理出牌。',
                career: '利设计、爆破、创新、前卫行业。',
                wealth: '先破后立，财来财去，不宜守财。',
                love: '感情不稳定，易波折，适合晚婚。',
                summary: '破旧立新，波动较大。'
            }
        };

        // === 2. 安全卫士函数 ===
        // 安全设置HTML，防止ID不存在报错
        function safeSetHTML(id, html) {
            const el = document.getElementById(id);
            if (el) el.innerHTML = html;
        }

        function findPalace(astrolabe, keyword) {
            return astrolabe.palaces.find(p => p.name.includes(keyword));
        }
        function _getStars(palace) { return (palace && palace.majorStars) ? palace.majorStars : []; }
        function _getMinors(palace) { return (palace && palace.minorStars) ? palace.minorStars : []; }
        
        function _getSmartStars(palace, astrolabe) {
            if (!palace) return { stars: [], isBorrowed: false, src: '无' };
            const majors = _getStars(palace);
            if (majors.length > 0) return { stars: majors, isBorrowed: false, src: palace.name };
            
            const duiIdx = (palace.index + 6) % 12;
            const duiPalace = astrolabe.palace(duiIdx);
            return { stars: _getStars(duiPalace), isBorrowed: true, src: duiPalace.name };
        }

        // 初始化
        function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1940; i--) y.add(new Option(i+'年', i));
            y.value = 1983; 
            for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=18;
        }

        // === 3. 核心逻辑 ===
        function calculate() {
            if (typeof iztro === 'undefined') { alert("资源加载中..."); return; }
            
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            
            // 简单真太阳时校准
            const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
            let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;

            try {
                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');
                generateMasterReport(astrolabe);
                renderPalaceDetail(astrolabe);
                renderDecades(astrolabe);
                
                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1');
                document.getElementById('solarHint').innerText = "✅ 排盘成功";
            } catch(e) {
                console.error(e);
                alert('排盘失败: ' + e.message);
            }
        }

        // 1. 专家总评
        function generateMasterReport(astrolabe) {
            const pMing = findPalace(astrolabe, '命');
            const mingData = _getSmartStars(pMing, astrolabe);
            
            // 命宫
            let mingHTML = `<p>您当前命宫在<span class="font-bold text-indigo-700">【${pMing.name}】</span>。`;
            if (mingData.isBorrowed) mingHTML += `本宫无主星，为<b>借星安宫</b>，性格可塑性强，善于适应环境。`;
            mingHTML += `核心性格参考：<b>${mingData.stars.map(s=>s.name).join('、')}</b>。</p>`;
            
            mingHTML += `<div class="mt-4 space-y-4">`;
            mingData.stars.forEach(s => {
                if(STAR_INFO[s.name]) {
                    mingHTML += `
                    <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                        <div class="font-bold text-indigo-800 text-lg mb-2">【${s.name}】</div>
                        <p class="text-sm text-slate-700 leading-relaxed mb-2">${STAR_INFO[s.name].ming}</p>
                        <div class="advice-box">💡 <b>建议：</b>发挥优势，扬长避短。</div>
                    </div>`;
                }
            });
            mingHTML += `</div>`;
            safeSetHTML('reportMing', mingHTML);

            // 事业财运
            const pGuan = findPalace(astrolabe, '官');
            const pCai = findPalace(astrolabe, '财');
            const guanData = _getSmartStars(pGuan, astrolabe);
            const caiData = _getSmartStars(pCai, astrolabe);
            
            let careerHTML = `<div class="mb-6"><div class="font-bold text-lg text-slate-800 mb-3 border-l-4 border-amber-500 pl-3">官禄宫（事业）</div>`;
            if(guanData.stars.length > 0) {
                if(guanData.isBorrowed) careerHTML += `<p class="text-xs text-slate-400 mb-2">（借对宫星曜）</p>`;
                guanData.stars.forEach(s => {
                    if(STAR_INFO[s.name]) careerHTML += `<div class="mb-3 text-sm text-slate-700"><span class="font-bold text-amber-600">· ${s.name}：</span>${STAR_INFO[s.name].career}</div>`;
                });
            } else { careerHTML += `<p class="text-sm text-slate-500">事业宫无主星，职业变动可能较大。</p>`; }
            careerHTML += `</div>`;

            careerHTML += `<div><div class="font-bold text-lg text-slate-800 mb-3 border-l-4 border-amber-500 pl-3">财帛宫（财运）</div>`;
            if(caiData.stars.length > 0) {
                if(caiData.isBorrowed) careerHTML += `<p class="text-xs text-slate-400 mb-2">（借对宫星曜）</p>`;
                caiData.stars.forEach(s => {
                    if(STAR_INFO[s.name]) careerHTML += `<div class="mb-3 text-sm text-slate-700"><span class="font-bold text-amber-600">· ${s.name}：</span>${STAR_INFO[s.name].wealth}</div>`;
                });
            } else { careerHTML += `<p class="text-sm text-slate-500">财帛宫无主星，财运需积少成多。</p>`; }
            careerHTML += `</div>`;
            safeSetHTML('reportCareer', careerHTML);

            // 婚姻
            const pFu = findPalace(astrolabe, '夫');
            const fuData = _getSmartStars(pFu, astrolabe);
            let loveHTML = `<div class="font-bold text-lg text-slate-800 mb-3 border-l-4 border-pink-500 pl-3">夫妻宫（缘分）</div>`;
            if(fuData.stars.length > 0) {
                if(fuData.isBorrowed) loveHTML += `<p class="text-xs text-slate-400 mb-2">（借对宫星曜）</p>`;
                fuData.stars.forEach(s => {
                    if(STAR_INFO[s.name]) loveHTML += `<div class="mb-3 text-sm text-slate-700"><span class="font-bold text-pink-600">· ${s.name}：</span>${STAR_INFO[s.name].love}</div>`;
                });
            } else {
                loveHTML += `<div class="text-sm text-slate-600 bg-slate-50 p-4 rounded">夫妻宫无主星，缘分可能较晚，或相处平淡如水。</div>`;
            }
            safeSetHTML('reportLove', loveHTML);
        }

        // 2. 十二宫详解
        function renderPalaceDetail(astrolabe) {
            const list = document.getElementById('palacesList');
            if(list) list.innerHTML = '';
            const order = ['命宫','兄弟宫','夫妻宫','子女宫','财帛宫','疾厄宫','迁移宫','交友宫','官禄宫','田宅宫','福德宫','父母宫'];
            
            order.forEach(name => {
                const p = findPalace(astrolabe, name.substr(0,1));
                if (!p) return;
                const data = _getSmartStars(p, astrolabe);
                
                let starsHtml = '';
                if(data.isBorrowed) starsHtml += `<span class="tag tag-jie">借星</span>`;
                starsHtml += data.stars.map(s => `<span class="font-bold text-indigo-700 mr-1 text-base">${s.name}</span>`).join('');

                let desc = "本宫力量较弱，吉凶参考对宫。";
                if(data.stars.length > 0) {
                    desc = data.stars.map(s => {
                        const ctx = STAR_INFO[s.name];
                        if (!ctx) return `${s.name}：特质独特。`;
                        if (name.includes('命')) return `<b>${s.name}</b>：${ctx.ming}`;
                        if (name.includes('财')) return `<b>${s.name}</b>：${ctx.wealth}`;
                        if (name.includes('官')) return `<b>${s.name}</b>：${ctx.career}`;
                        if (name.includes('夫')) return `<b>${s.name}</b>：${ctx.love}`;
                        return `<b>${s.name}</b>：${ctx.summary}`;
                    }).join('<br><br>');
                }

                const div = document.createElement('div');
                div.className = 'bg-white rounded-xl p-4 border border-slate-200 shadow-sm';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <div class="font-bold text-lg text-slate-800 border-l-4 border-indigo-500 pl-2">${name}</div>
                        <div class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500 font-mono">${p.heavenlyStem}${p.earthlyBranch}</div>
                    </div>
                    <div class="palace-def">${PALACE_DEF[name]}</div>
                    <div class="mb-2 min-h-[24px] flex items-center flex-wrap">${starsHtml}</div>
                    <div class="text-sm text-slate-600 bg-slate-50 p-3 rounded leading-relaxed text-justify">${desc}</div>
                `;
                if(list) list.appendChild(div);
            });
        }

        // 3. 大运流年
        function renderDecades(astrolabe) {
            const list = document.getElementById('decadeList');
            if(list) list.innerHTML = '';
            
            const sorted = [...astrolabe.palaces].sort((a,b) => a.decadal.range[0] - b.decadal.range[0]);
            sorted.slice(0, 8).forEach((p, i) => {
                if(!p.decadal) return;
                const data = _getSmartStars(p, astrolabe);
                const sName = data.stars.map(s=>s.name).join(' ') || '空';
                
                // 安全获取定义，防止substring报错
                let defRaw = PALACE_DEF[p.name] || "宫位";
                let cleanDef = defRaw; 

                // 运势简评
                let luck = "运势平稳。";
                if(data.stars.length > 0 && STAR_INFO[data.stars[0].name]) {
                    luck = STAR_INFO[data.stars[0].name].summary;
                }

                const div = document.createElement('div');
                div.className = 'flex gap-4 border-b border-slate-100 pb-4 mb-4 last:border-0';
                div.innerHTML = `
                    <div class="w-16 pt-1 text-center flex-shrink-0">
                        <div class="text-sm font-bold text-indigo-600 bg-indigo-50 rounded py-1">${p.decadal.range[0]}-${p.decadal.range[1]}岁</div>
                        <div class="text-xs text-slate-400 mt-1">第${i+1}运</div>
                    </div>
                    <div>
                        <div class="font-bold text-slate-800">行运【${p.name}】 <span class="text-xs font-normal text-slate-500">(${sName})</span></div>
                        <div class="text-sm text-slate-600 mt-1 text-justify">重点关注${cleanDef.split('、')[0].replace('【','').replace('】','')}。<br>运势：${luck}</div>
                    </div>
                `;
                if(list) list.appendChild(div);
            });
            
            // 当前大运头图
            const curAge = new Date().getFullYear() - parseInt(document.getElementById('selYear').value) + 1;
            const curDecade = astrolabe.palaces.find(p => p.decadal && curAge >= p.decadal.range[0] && curAge <= p.decadal.range[1]);
            
            if(curDecade) {
                safeSetHTML('currentDecadeInfo', `
                    <div class="text-xs opacity-70 mb-1">CURRENT DECADE (${curDecade.decadal.range[0]}-${curDecade.decadal.range[1]}岁)</div>
                    <div class="text-3xl font-bold mb-2">行运【${curDecade.name}】</div>
                    <div class="text-sm border-t border-white/20 pt-3">此十年为您人生的重要转折点，主要受${curDecade.name}相关事务影响。</div>
                `);
            }
            
            // 未来三月
            const forecastDiv = document.getElementById('monthlyForecast');
            if(forecastDiv) {
                forecastDiv.innerHTML = '';
                const now = new Date();
                for (let i = 0; i < 3; i++) {
                    let fDate = new Date(); fDate.setMonth(now.getMonth() + i);
                    let fStr = fDate.getFullYear() + '-' + String(fDate.getMonth()+1).padStart(2,'0') + '-15 12:00:00';
                    let scope; try { scope = astrolabe.horoscope(fStr); } catch(e) {}

                    if (scope && scope.monthly) {
                        const mPalace = astrolabe.palace(scope.monthly.index);
                        const stars = _getStars(mPalace).map(s=>s.name).join(' ') || '空宫';
                        const item = document.createElement('div');
                        item.className = 'flex justify-between items-center bg-slate-50 rounded-lg p-3 border border-slate-100 mb-2';
                        item.innerHTML = `<div><div class="font-bold text-slate-700 text-sm">${fDate.getFullYear()}年${fDate.getMonth()+1}月</div><div class="text-xs text-slate-400 mt-0.5">农历${scope.lunarDate.month}月</div></div><div class="text-right"><div class="text-xs text-indigo-600 font-bold mb-1">流月在${mPalace.name}</div><div class="text-xs text-slate-500">${stars}</div></div>`;
                        forecastDiv.appendChild(item);
                    }
                }
            }
        }

        function switchTab(id) {
            ['tab1','tab2','tab3'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2','btn-tab3'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        init();
    </script>
</body>
</html>
