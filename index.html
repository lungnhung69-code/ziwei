            if(!astrolabe || !astrolabe.palaces) return null;
            return astrolabe.palaces.find(p => p.name.includes(keyword));
        }
        
        function _getStars(palace) { return (palace && palace.majorStars) ? palace.majorStars : []; }

            if (!palace) return { stars: [], type: 'error', starStr: '未知' };
            const majors = _getStars(palace);
            if (majors.length > 0) {
                const names = majors.map(s => s.name);
                const comboKey = names.length > 1 ? names.join('+') : names[0];
                return { stars: majors, type: 'solid', key: comboKey, starStr: names.join('、') };
            }
            const duiIdx = (palace.index + 6) % 12;
            const duiPalace = astrolabe.palace(duiIdx);
            const duiMajors = _getStars(duiPalace);
            const names = duiMajors.map(s => s.name);
            const comboKey = names.length > 1 ? names.join('+') : (names[0] || '无主星');
            return { stars: duiMajors, type: 'empty', key: comboKey, starStr: names.join('、'), duiName: duiPalace.name };
        }

            let text = "";
            if (COMBO_LOGIC[data.key]) {
                text += COMBO_LOGIC[data.key][category] || COMBO_LOGIC[data.key]['base'];
            } else {
                data.stars.forEach(s => {
                    // 默认使用性格特质作为基础描述
                    if (MASTER_DB[s.name]) text += `<b>${s.name}</b>：${MASTER_DB[s.name].ming.substring(0, 30)}... `;
                });
            }
            if (data.type === 'empty') {
                text = `(本宫无主星，借对宫【${data.starStr}】) ` + text;
                text += ` <br><span class="text-xs text-slate-500">注：借星安宫意味着该领域（${category === 'career' ? '事业' : '感情'}）变数较大，力量减半，需依赖外部环境。</span>`;
            }
            return text;
        }

        function generateMonthlyAdvice(data, palaceName) {
            let wealthTip = MONTHLY_GUIDE.wealth['default'];
            let warnTip = MONTHLY_GUIDE.warn['default'];
            
            for (let s of data.stars) {
                if (MONTHLY_GUIDE.wealth[s.name]) wealthTip = MONTHLY_GUIDE.wealth[s.name];
                if (MONTHLY_GUIDE.warn[s.name]) warnTip = MONTHLY_GUIDE.warn[s.name];
            }
            if (MONTHLY_GUIDE.warn[palaceName]) warnTip = MONTHLY_GUIDE.warn[palaceName];

            return { wealth: wealthTip, warn: warnTip };
        }

        // 初始化
        function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1940; i--) y.add(new Option(i+'年', i));
            y.value = 1983; for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=18;
            document.getElementById('debugInfo').style.display='none';
        }

        function calculate() {
            document.getElementById('debugInfo').style.display='none';
            if (typeof iztro === 'undefined') { alert("资源加载中..."); return; }
            
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                let longitude = 120, matchedCity = '';
                for (let city in CITY_LONGITUDES) {
                    if (loc.includes(city)) { longitude = CITY_LONGITUDES[city]; matchedCity = city; break; }
                }
                const offset = (longitude - 120) * 4;
                const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
                dateObj.setMinutes(dateObj.getMinutes() + offset);
                let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;

                safeText('solarHint', matchedCity ? `✅ 真太阳时已校准 (${matchedCity})` : "ℹ️ 默认北京时间");

                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                // 分舱运行，防止一个模块报错导致全部挂掉
                try { renderHolographicReport(astrolabe); } catch(e) { showError('全息画像生成失败:'+e.message); }
                try { renderFocusFortune(astrolabe, parseInt(y)); } catch(e) { showError('运势推演生成失败:'+e.message); }

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1');

            } catch(e) {
                showError('主程序错误: ' + e.message);
            }
        }

        // === Tab 1: 全息画像 ===
        function renderHolographicReport(astrolabe) {
            const pMing = findPalace(astrolabe, '命');
            const pGuan = findPalace(astrolabe, '官');
            const pCai = findPalace(astrolabe, '财');
            const pFu = findPalace(astrolabe, '夫');
            const pQian = findPalace(astrolabe, '迁');

            const dMing = _analyzeStars(pMing, astrolabe);
            const dGuan = _analyzeStars(pGuan, astrolabe);
            const dCai = _analyzeStars(pCai, astrolabe);
            const dFu = _analyzeStars(pFu, astrolabe);
            const dQian = _analyzeStars(pQian, astrolabe);

            let mingHTML = `<p>您是<span class="keyword">${dMing.starStr}</span>坐命。`;
            if (dMing.type === 'empty') {
                mingHTML += `命无正曜，这意味着您的性格像水一样，容器是什么形状，您就是什么形状。您非常善于适应环境，但也容易感到迷茫。<b>您的真实性格往往体现在迁移宫（对外表现）上。</b></p>`;
                mingHTML += `<p class="mt-2">核心特质参考：${synthesize(dQian, 'base')}</p>`;
            } else {
                mingHTML += `核心特质：${synthesize(dMing, 'base')}</p>`;
            }
            // 建议
            let advice = "发挥优势，扬长避短。";
            if (dMing.stars[0] && MASTER_DB[dMing.stars[0].name]) {
                advice = MASTER_DB[dMing.stars[0].name].advice;
            }
            mingHTML += `<div class="suggestion-box">💡 <b>发展建议：</b>${advice}</div>`;
            safeHTML('logicMing', mingHTML);

            let careerHTML = `<p><b>格局判断：</b>您的事业宫（${dGuan.starStr}）与财帛宫（${dCai.starStr}）形成了`;
            if (dGuan.type === 'empty' && dCai.type === 'empty') {
                careerHTML += `<b>“双空”格局</b>。这并不代表没钱，而是代表您的财富和事业往往不是通过“按部就班”得来的。您非常适合<b>自由职业、中介、咨询、或依附于大平台</b>。`;
            } else if (dCai.key.includes('同') || dCai.key.includes('巨')) {
                careerHTML += `<b>“白手起家”格局</b>。天同主福，巨门主口舌。您适合靠<b>嘴巴（销售、讲师）、技术、或服务业</b>赚钱。`;
            } else {
                careerHTML += `<b>标准格局</b>。${synthesize(dGuan, 'career')}`;
            }
            safeHTML('logicCareer', careerHTML);

            let loveHTML = `<p><b>缘分逻辑：</b>夫妻宫坐${dFu.starStr}。</p>`;
            loveHTML += `<p>${synthesize(dFu, 'love')}</p>`;
            if (dFu.type === 'empty') {
                loveHTML += `<p class="mt-2">空宫代表您对伴侣的要求其实很模糊，或者缘分比较淡薄（聚少离多反而是好事）。</p>`;
            }
            if (dFu.key.includes('阳') && dFu.key.includes('梁')) {
                 loveHTML += `<div class="mt-2 bg-pink-50 p-2 rounded text-sm text-pink-800"><b>特别提示：</b>阳梁在卯，日照雷门。这是一组很好的星，代表配偶正直、有名望。但“天梁”是孤独之星，你们的感情可能更像“亲情”或“师生情”，少了点浪漫。</div>`;
            }
            safeHTML('logicLove', loveHTML);
        }

        // === Tab 2: 当下运势聚焦 ===
        function renderFocusFortune(astrolabe, birthYear) {
            const now = new Date();
            const currentYear = now.getFullYear();
            const age = currentYear - birthYear + 1;
            
            // 1. 找大限
            let curDecade = null;
            astrolabe.palaces.forEach(p => {
                if (p.decadal && age >= p.decadal.range[0] && age <= p.decadal.range[1]) curDecade = p;
            });

            if (curDecade) {
                const dData = _analyzeStars(curDecade, astrolabe);
                let content = `<p><b>本大限（${curDecade.decadal.range[0]}-${curDecade.decadal.range[1]}岁）行运至【${curDecade.name}】。</b></p>`;
                content += `<p>大限主星：<span class="keyword">${dData.starStr}</span> ${dData.type==='empty'?'(借星)':''}</p>`;
                
                if (dData.key.includes('破') || dData.key.includes('杀')) {
                    content += `<p class="highlight">这是动荡变化的十年。破军/七杀主变，您可能会经历换工作、搬家甚至行业大洗牌。宜动不宜静，只有改变才能生存。</p>`;
                } else if (dData.key.includes('机') || dData.key.includes('阴')) {
                    content += `<p>这是相对平稳但内心纠结的十年。适合学习、积淀。财运上宜守成。</p>`;
                } else {
                    content += `<p>${synthesize(dData, 'base')}</p>`;
                }
                safeHTML('logicDecade', content);
            }

            // 2. 找流年
            const yearStr = currentYear + '-01-01 12:00:00';
            let yearlyScope;
            try { yearlyScope = astrolabe.horoscope(yearStr); } catch(e){}
            
            if (yearlyScope && yearlyScope.yearly) {
                const yPalace = astrolabe.palace(yearlyScope.yearly.index);
                const yData = _analyzeStars(yPalace, astrolabe);
                
                safeText('yearLabel', `${currentYear} 乙巳年`); // 修复：确保ID存在
                
                let yText = `<p><b>流年命宫在【${yPalace.name}】，主星 ${yData.starStr}。</b></p>`;
                if (yData.key.includes('七杀')) {
                    yText += `<p class="highlight"><b>杀气腾腾的一年。</b>这一年您会非常有冲劲，想做大事。但要注意身体受伤，开车小心。</p>`;
                } else {
                     yText += `<p>今年运势相对平稳。重点关注${yPalace.name}相关的事务。</p>`;
                }
                safeHTML('logicYear', yText);
            }

            // 3. 未来三月
            const forecastDiv = document.getElementById('monthlyForecast');
            if (forecastDiv) {
                forecastDiv.innerHTML = '';
                for(let i=0; i<3; i++) {
                    let fDate = new Date(); fDate.setMonth(now.getMonth() + i);
                    let fStr = fDate.getFullYear() + '-' + String(fDate.getMonth()+1).padStart(2,'0') + '-15 12:00:00';
                    let scope; try { scope = astrolabe.horoscope(fStr); } catch(e){}

                    if(scope && scope.monthly) {
                        const mPalace = astrolabe.palace(scope.monthly.index);
                        const mData = _analyzeStars(mPalace, astrolabe);
                        
                        const advice = generateMonthlyAdvice(mData, mPalace.name);
                        const lunarM = (scope.lunarDate && scope.lunarDate.month) ? scope.lunarDate.month : '未知';
                        const tagClass = advice.wealth.includes('利') ? 'tag-wealth' : 'tag-normal';

                        const item = document.createElement('div');
                        item.className = 'timeline-box';
                        item.innerHTML = `
                            <div class="timeline-dot"></div>
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-indigo-700 text-lg">${fDate.getMonth()+1}月</span>
                                <span class="text-xs bg-slate-200 px-2 py-1 rounded">农历${lunarM}月 · ${mPalace.name}</span>
                            </div>
                            <div class="text-sm text-slate-600 mt-2">
                                <b>主星：</b>${mData.starStr}
                            </div>
                            <div class="mt-2 flex flex-wrap gap-2">
                                 <span class="month-tag ${tagClass}">💰 ${advice.wealth}</span>
                                 <span class="month-tag tag-warn">⚠️ ${advice.warn}</span>
                            </div>
                        `;
                        forecastDiv.appendChild(item);
                    }
                }
            }
        }

        function switchTab(id) {
            ['tab1','tab2'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        init();
    </script>
</body>
</html>
