        function _getSmartStars(palace, astrolabe) {
            if (!palace) return { stars: [], isBorrowed: false, src: '无' };
            const majors = _getStars(palace);
            if (majors.length > 0) return { stars: majors, isBorrowed: false, src: palace.name };
            
            const duiIdx = (palace.index + 6) % 12;
            const duiPalace = astrolabe.palace(duiIdx);

                // 排盘
                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                renderMasterAnalysis(astrolabe);
                renderFortuneFocus(astrolabe, parseInt(y));

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1');

            } catch(e) {
                console.error(e);
                alert('分析遇到问题，请尝试更换日期重试。');
            }
        }

        // === Tab 1: 大师犀利总评 ===
        function renderMasterAnalysis(astrolabe) {
            const pMing = findPalace(astrolabe, '命');
            const pGuan = findPalace(astrolabe, '官');
            const pCai = findPalace(astrolabe, '财');
            const pFu = findPalace(astrolabe, '夫');

            renderSection('reportMing', pMing, astrolabe, 'ming');
            renderSection('reportCareer', pGuan, astrolabe, 'career', pCai); // 事业+财运合并
            renderSection('reportLove', pFu, astrolabe, 'love');
        }

        function renderSection(elId, palace, astrolabe, type, extraPalace = null) {
            const data = _getSmartStars(palace, astrolabe);
            let html = ``;
            
            // 1. 主星显示
            let starNames = data.stars.map(s => s.name).join(' + ');
            if (data.stars.length === 0) starNames = "无主星";
            let borrowTag = data.isBorrowed ? `<span class="bg-gray-200 text-gray-600 text-xs px-2 py-0.5 rounded ml-2">借对宫看</span>` : '';
            
            html += `<div class="mb-3"><span class="text-lg font-bold text-indigo-900">主星：${starNames}</span>${borrowTag}</div>`;

            // 2. 核心断语 (循环处理双星)
            if (data.stars.length > 0) {
                html += `<div class="space-y-4">`;
                data.stars.forEach(s => {
                    if (SHARP_TEXT[s.name]) {
                        let text = SHARP_TEXT[s.name][type];
                        if (type === 'career') text = SHARP_TEXT[s.name]['career']; // 强制读取career字段
                        
                        html += `<div><span class="keyword-tag">${s.name}</span> ${text}</div>`;
                    }
                });
                html += `</div>`;
            } else {
                html += `<div class="warn-box">此宫位无主星，代表该领域变数大、受环境影响深，或者缘分较薄。需参考对宫星曜。</div>`;
            }

            // 3. 额外处理 (如事业+财运合并)
            if (extraPalace) {
                const extraData = _getSmartStars(extraPalace, astrolabe);
                html += `<div class="mt-5 pt-4 border-t border-dashed border-slate-300">
                    <div class="mb-2 font-bold text-slate-800">💰 财运补充（财帛宫）：${extraData.stars.map(s=>s.name).join('+')||'无'}</div>
                    <div class="space-y-2">`;
                extraData.stars.forEach(s => {
                     if (SHARP_TEXT[s.name]) {
                        html += `<div><span class="keyword-tag">${s.name}</span> ${SHARP_TEXT[s.name].wealth}</div>`;
                     }
                });
                html += `</div></div>`;
            }

            document.getElementById(elId).innerHTML = html;
        }

        // === Tab 2: 当下运势聚焦 (修复版) ===
        function renderFortuneFocus(astrolabe, birthYear) {
            const now = new Date();
            const currentYear = now.getFullYear();
            const age = currentYear - birthYear + 1;

            // 1. 找大限
            let curDecade = null;
            astrolabe.palaces.forEach(p => {
                if (p.decadal && age >= p.decadal.range[0] && age <= p.decadal.range[1]) curDecade = p;
            });

            if (curDecade) {
                const dData = _getSmartStars(curDecade, astrolabe);
                const starName = dData.stars.map(s=>s.name).join('、') || '无主星';
                
                // 大限运势基调
                let luckText = "本大限运势起伏，需稳中求进。";
                if(dData.stars.length > 0 && SHARP_TEXT[dData.stars[0].name]) {
                    luckText = SHARP_TEXT[dData.stars[0].name].luck;
                }

                document.getElementById('decadeTitle').innerText = `行运【${curDecade.name}】 (${curDecade.decadal.range[0]}-${curDecade.decadal.range[1]}岁)`;
                document.getElementById('decadeContent').innerHTML = `
                    <p class="mb-2"><b>大限主星：</b>${starName} ${dData.isBorrowed?'(借星)':''}</p>
                    <p class="text-justify"><b>大师断语：</b>${luckText}</p>
                    <p class="mt-2 text-xs opacity-80">注：此十年您的人生重心在${PALACE_DEF[curDecade.name]?.split('、')[0].replace('【','').replace('】','')||'该宫位'}相关事务。</p>
                `;
            } else {
                document.getElementById('decadeTitle').innerText = "大运数据计算中...";
            }

            // 2. 找流年 (2025)
            const yearStr = currentYear + '-01-01 12:00:00';
            let yearlyScope;
            try { yearlyScope = astrolabe.horoscope(yearStr); } catch(e){}
            
            if (yearlyScope && yearlyScope.yearly) {
                const yPalace = astrolabe.palace(yearlyScope.yearly.index);
                const yData = _getSmartStars(yPalace, astrolabe);
                
                document.getElementById('yearLabel').innerText = `${currentYear} 乙巳年`;
                
                let yContent = `<p class="mb-2"><b>流年命宫：</b>在【${yPalace.name}】，主星 ${yData.stars.map(s=>s.name).join('、')||'无'}。</p>`;
                
                // 简单的流年断语逻辑
                if(yData.stars.some(s=>['紫微','太阳','天府'].includes(s.name))) {
                    yContent += `<div class="good-box">🌟 <b>吉运：</b>今年贵人运旺，利于事业突破、升职加薪。</div>`;
                } else if(yData.stars.some(s=>['七杀','破军','贪狼'].includes(s.name))) {
                    yContent += `<div class="warn-box">⚡ <b>变动：</b>今年是变动之年，即使不想动也会被环境推着走。宜守不宜攻。</div>`;
                } else if(yData.stars.some(s=>['天机','天同','太阴'].includes(s.name))) {
                    yContent += `<div class="bg-slate-50 p-2 rounded">🍵 <b>平稳：</b>今年运势相对平缓，适合学习、积淀，处理家庭事务。</div>`;
                } else {
                    yContent += `<div class="bg-slate-50 p-2 rounded">🔄 <b>借力：</b>今年自身力量较弱，多依赖外部环境，随波逐流。</div>`;
                }
                document.getElementById('yearContent').innerHTML = yContent;
            }

            // 3. 未来三月
            const forecastDiv = document.getElementById('monthlyForecast');
            forecastDiv.innerHTML = '';
            for(let i=0; i<3; i++) {
                let fDate = new Date(); fDate.setMonth(now.getMonth() + i);
                let fStr = fDate.getFullYear() + '-' + String(fDate.getMonth()+1).padStart(2,'0') + '-15 12:00:00';
                let scope; try { scope = astrolabe.horoscope(fStr); } catch(e){}

                if(scope && scope.monthly) {
                    const mPalace = astrolabe.palace(scope.monthly.index);
                    const stars = _getStars(mPalace).map(s=>s.name).join(' ') || '空宫';
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center bg-slate-50 rounded p-3 border border-slate-200';
                    item.innerHTML = `
                        <div>
                            <div class="font-bold text-slate-700">${fDate.getMonth()+1}月</div>
                            <div class="text-xs text-slate-400">农历${scope.lunarDate.month}月</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-indigo-600 font-bold">流月在${mPalace.name}</div>
                            <div class="text-xs text-slate-500">${stars}</div>
                        </div>
                    `;
                    forecastDiv.appendChild(item);
                }
            }
        }

        function switchTab(id) {
            ['tab1','tab2'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-4 text-sm tab-active' : 'flex-1 py-4 text-sm tab-inactive'; 
            });
        }

        init();
    </script>
</body>
</html>
