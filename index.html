<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>紫微斗数 - 终极详解(防崩溃版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/iztro@2.5.3/dist/iztro.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        select { -webkit-appearance: none; appearance: none; background-color: #fff; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3E%3Cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3E%3C/svg%3E"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem; }
        .tab-active { color: #4f46e5; border-bottom: 2px solid #4f46e5; font-weight: bold; background-color: #eef2ff; }
        .tab-inactive { color: #64748b; background-color: white; }
        
        .brightness-庙 { color: #dc2626; } 
        .brightness-旺 { color: #d97706; } 
        .brightness-得 { color: #16a34a; } 
        .brightness-利 { color: #0891b2; } 
        .brightness-平 { color: #4b5563; } 
        .brightness-不 { color: #6b7280; } 
        .brightness-陷 { color: #1f2937; opacity: 0.7; }

        .ziwei-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, minmax(100px, auto)); gap: 2px; background-color: #e2e8f0; border: 2px solid #cbd5e1; font-size: 10px; }
        .grid-cell { background-color: #fff; padding: 4px; position: relative; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: background 0.2s; }
        .grid-cell:active { background-color: #f8fafc; }
        .grid-center { grid-column: 2 / span 2; grid-row: 2 / span 2; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #f8fafc; padding: 10px; text-align: center; }
        
        @media (max-width: 400px) { .ziwei-grid { font-size: 9px; } .grid-cell { min-height: 100px; padding: 2px; } .star-major { font-size: 10px; } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 500px; max-height: 85vh; border-radius: 12px; overflow-y: auto; }
    </style>
</head>
<body class="min-h-screen pb-10 flex flex-col items-center">

    <div class="w-full bg-slate-900 p-4 text-center text-white shadow-lg sticky top-0 z-40">
        <h1 class="text-lg font-bold tracking-wide"><i class="fas fa-star-of-david text-purple-400"></i> 紫微斗数 · 稳定版</h1>
    </div>

    <div class="w-full max-w-lg p-3 space-y-4">
        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200">
            <div class="flex flex-col space-y-3">
                <div class="flex gap-2">
                    <input type="text" id="userName" placeholder="姓名 (选填)" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    <button onclick="toggleHistory()" class="px-3 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200">📂 记录</button>
                </div>
                <div id="historyPanel" class="hidden bg-slate-50 p-2 rounded-lg text-xs space-y-2 max-h-40 overflow-y-auto border border-slate-200 shadow-inner"></div>

                <div class="flex space-x-2">
                    <select id="selYear" class="w-[38%] border border-slate-300 rounded-lg px-2 text-sm h-10"></select>
                    <select id="selMonth" class="w-[30%] border border-slate-300 rounded-lg px-2 text-sm h-10"></select>
                    <select id="selDay" class="w-[32%] border border-slate-300 rounded-lg px-2 text-sm h-10"></select>
                </div>
                <div class="flex space-x-2">
                    <input type="time" id="birthTime" value="10:15" class="w-2/3 border border-slate-300 rounded-lg px-3 py-2 text-sm h-10">
                    <select id="gender" class="w-1/3 border border-slate-300 rounded-lg px-2 text-sm h-10">
                        <option value="女">女</option>
                        <option value="男">男</option>
                    </select>
                </div>
                <input type="text" id="location" placeholder="出生地 (如: 河南周口)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm h-10">
                
                <button id="calcBtn" onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition">🚀 开始全盘解析</button>
                <p id="solarTimeHint" class="text-[10px] text-slate-400 text-center min-h-[15px]"></p>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-4">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex text-sm overflow-hidden sticky top-[60px] z-30">
                <button onclick="switchTab('tab0')" id="btn-tab0" class="tab-active flex-1 py-3 text-center">命盘图</button>
                <button onclick="switchTab('tab1')" id="btn-tab1" class="tab-inactive flex-1 py-3 text-center">人生底色</button>
                <button onclick="switchTab('tab2')" id="btn-tab2" class="tab-inactive flex-1 py-3 text-center">十二宫</button>
                <button onclick="switchTab('tab3')" id="btn-tab3" class="tab-inactive flex-1 py-3 text-center">运势</button>
            </div>

            <div id="tab0" class="fade-in"><div class="bg-white p-1 rounded-xl shadow-sm border border-slate-200 overflow-hidden"><div id="visualChart" class="ziwei-grid rounded-lg"></div></div></div>
            <div id="tab1" class="hidden space-y-4 fade-in"><div id="fateBasic" class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-purple-500"></div><div id="fateLaiYin" class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-amber-500"></div><div id="fateSiHua" class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-blue-500"></div></div>
            <div id="tab2" class="hidden space-y-4 fade-in"><div id="palacesList" class="grid grid-cols-1 gap-3"></div></div>
            <div id="tab3" class="hidden space-y-4 fade-in"><div id="decadeFortune" class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl shadow-lg p-5 text-white"></div><div id="forecastContent" class="space-y-4 mt-4"></div></div>
        </div>
    </div>

    <div id="detailModal" class="modal" onclick="closeModal(event)"><div class="modal-content"><div class="flex justify-between items-center p-4 border-b border-slate-100"><h3 id="modalTitle" class="font-bold text-lg text-slate-800"></h3><button onclick="document.getElementById('detailModal').style.display='none'" class="text-slate-400"><i class="fas fa-times"></i></button></div><div id="modalBody" class="p-5 text-sm space-y-4"></div></div></div>

    <script>
        // === 究极防崩溃 Helper ===
        // 无论传什么进来，只要是 undefined 就返回空，绝对不报错
        function _safeIdx(obj) { try { if(obj && (Array.isArray(obj) || typeof obj === 'string') && obj.length > 0) return obj[0]; return ''; } catch(e) { return ''; } }
        function _safeGet(obj, path, defaultVal='') { try { return path.split('.').reduce((o, i) => o[i], obj) || defaultVal; } catch(e) { return defaultVal; } }
        
        const CITY_LONGITUDES = {'北京':116.40,'上海':121.47,'天津':117.20,'重庆':106.55,'周口':114.65,'郑州':113.62,'开封':114.30,'武汉':114.31,'长沙':112.93,'广州':113.26,'深圳':114.05,'成都':104.06,'西安':108.93,'南京':118.78,'杭州':120.15,'沈阳':123.43,'哈尔滨':126.63,'济南':117.02,'香港':114.16,'台北':121.50,'河南':113.62};
        const MING_STAR_KEYWORDS = {'紫微':'【帝王】','天机':'【智谋】','太阳':'【奉献】','武曲':'【刚毅】','天同':'【福星】','廉贞':'【交际】','天府':'【财库】','太阴':'【内敛】','贪狼':'【欲望】','巨门':'【口才】','天相':'【辅佐】','天梁':'【荫庇】','七杀':'【肃杀】','破军':'【先破后立】'};
        const PALACE_TEMPLATE = {'财帛宫':{icon:'💰'},'官禄宫':{icon:'💼'},'夫妻宫':{icon:'💕'},'迁移宫':{icon:'✈️'},'疾厄宫':{icon:'🏥'},'福德宫':{icon:'🍀'},'父母宫':{icon:'👪'},'兄弟宫':{icon:'🤝'},'子女宫':{icon:'👶'},'交友宫':{icon:'🌐'},'田宅宫':{icon:'🏠'},'命宫':{icon:'🧬'}};
        const SHI_GAN_SI_HUA = {'甲':['廉贞','破军','武曲','太阳'],'乙':['天机','天梁','紫微','太阴'],'丙':['天同','天机','文昌','廉贞'],'丁':['太阴','天同','天机','巨门'],'戊':['贪狼','太阴','右弼','天机'],'己':['武曲','贪狼','天梁','文曲'],'庚':['太阳','武曲','太阴','天同'],'辛':['巨门','太阳','文曲','文昌'],'壬':['天梁','紫微','左辅','武曲'],'癸':['破军','巨门','太阴','贪狼']};
        const HISTORY_KEY = 'ziwei_history_v4_safe';

        function init() {
            const selYear=document.getElementById('selYear'),selMonth=document.getElementById('selMonth'),selDay=document.getElementById('selDay');
            for(let i=new Date().getFullYear();i>=1930;i--) selYear.add(new Option(i+'年',i));
            selYear.value=1983; 
            for(let i=1;i<=12;i++) selMonth.add(new Option(i+'月',i));
            selYear.onchange=selMonth.onchange=() => {
                const days=new Date(selYear.value,selMonth.value,0).getDate();
                selDay.innerHTML=''; for(let i=1;i<=days;i++) selDay.add(new Option(i+'日',i));
            };
            selYear.onchange(); selDay.value=18;
            loadHistory();
        }

        function calculate() {
            const y=document.getElementById('selYear').value, m=document.getElementById('selMonth').value.padStart(2,'0'), d=document.getElementById('selDay').value.padStart(2,'0');
            const timeStr=document.getElementById('birthTime').value, location=document.getElementById('location').value||'', genderVal=document.getElementById('gender').value;
            const name=document.getElementById('userName').value.trim()||'命主';
            
            if(!timeStr){alert("请选择时间");return;}
            saveRecord({name,y,m,d,time:timeStr,loc:location,gender:genderVal});
            const btn=document.getElementById('calcBtn'); btn.innerHTML='⏳ 计算中...'; btn.disabled=true;

            setTimeout(()=>{
                try {
                    // 真太阳时
                    let longitude=120; for(let c in CITY_LONGITUDES) if(location.includes(c)) longitude=CITY_LONGITUDES[c];
                    const dt=new Date(`${y}-${m}-${d}T${timeStr}:00`);
                    dt.setMinutes(dt.getMinutes()+(longitude-120)*4);
                    let timeIndex=Math.floor((dt.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;
                    document.getElementById('solarTimeHint').innerText=`真太阳时: ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')} (时辰: ${['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'][timeIndex]})`;

                    if(typeof iztro==='undefined') throw new Error("组件未加载");
                    
                    // 核心算法
                    const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, genderVal==='男'?'男':'女', true, 'zh-CN');
                    
                    // 分步渲染，互不影响
                    try { renderVisualChart(astrolabe, name, genderVal, y, m, d); } catch(e) { console.error('Chart Err',e); }
                    try { renderTab1(astrolabe, parseInt(y)); } catch(e) { console.error('Tab1 Err',e); }
                    try { renderTab2(astrolabe); } catch(e) { console.error('Tab2 Err',e); }
                    
                    const nowStr = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')} 12:00:00`;
                    try { renderTab3(astrolabe, nowStr); } catch(e) { console.error('Tab3 Err',e); }

                    document.getElementById('resultArea').classList.remove('hidden');
                    switchTab('tab0');
                    setTimeout(()=>document.getElementById('resultArea').scrollIntoView({behavior:'smooth'}),100);
                } catch(e) {
                    alert("计算出错: " + e.message + "\n请尝试调整出生地或重试。");
                } finally {
                    btn.innerHTML='🚀 开始全盘解析'; btn.disabled=false;
                }
            }, 200);
        }

        function renderVisualChart(astrolabe, name, gender, y, m, d) {
            const grid=document.getElementById('visualChart'); grid.innerHTML='';
            const map={'巳':{r:1,c:1},'午':{r:1,c:2},'未':{r:1,c:3},'申':{r:1,c:4},'辰':{r:2,c:1},'酉':{r:2,c:4},'卯':{r:3,c:1},'戌':{r:3,c:4},'寅':{r:4,c:1},'丑':{r:4,c:2},'子':{r:4,c:3},'亥':{r:4,c:4}};
            
            // 安全获取农历
            const cnY = _safeIdx(_safeGet(astrolabe, 'chineseDate.yearly'));
            const cnM = _safeIdx(_safeGet(astrolabe, 'chineseDate.monthly'));
            const cnD = _safeIdx(_safeGet(astrolabe, 'chineseDate.daily'));

            grid.innerHTML += `<div class="grid-center border rounded shadow-sm"><div class="font-bold text-indigo-900">${name}</div><div class="text-[10px] text-slate-500">${gender} | ${_safeGet(astrolabe,'fiveElementsClass','-')}</div><div class="text-[10px] text-slate-400 mt-1">${y}/${m}/${d}<br>农历:${cnY}年${cnM}月${cnD}日</div></div>`;

            astrolabe.palaces.forEach(p => {
                const pos=map[p.earthlyBranch]; if(!pos) return;
                const cell=document.createElement('div');
                cell.className='grid-cell rounded border border-slate-100';
                cell.style.gridRow=pos.r; cell.style.gridColumn=pos.c;
                
                // 星曜渲染 (使用 _safeIdx 保护 brightness)
                const majors=p.majorStars.map(s => `<div class="font-bold brightness-${_safeIdx(s.brightness)} text-[10px]">${s.name}<span class="text-[8px] opacity-60 font-normal scale-75 inline-block">${_safeIdx(s.brightness)}</span>${s.mutagen?`<span class="bg-red-500 text-white rounded-full px-[2px] text-[8px] scale-75 inline-block">${s.mutagen}</span>`:''}</div>`).join('');
                
                const minors=p.minorStars.filter(s=>['文昌','文曲','左辅','右弼','天魁','天钺','禄存','擎羊','陀罗','火星','铃星'].includes(s.name)).map(s=>`<span class="text-[9px] mr-1 ${['擎羊','陀罗','火星','铃星'].includes(s.name)?'text-slate-700 font-bold':'text-blue-600'}">${s.name}</span>`).join('');

                // 大限范围 (使用 _safeGet 保护)
                const rangeStart = _safeGet(p, 'decadal.range.0', 0);
                const rangeEnd = _safeGet(p, 'decadal.range.1', 0);

                cell.innerHTML=`<div class="leading-tight pt-1 pl-1">${majors||'<span class="text-[9px] text-slate-300">借对宫</span>'}</div><div class="px-1 flex flex-wrap mt-1">${minors}</div><div class="mt-auto flex justify-between items-end bg-slate-50 border-t border-slate-100 px-1"><div class="text-[9px] text-slate-400">${p.heavenlyStem}<br>${rangeStart}-${rangeEnd}</div><div class="text-right"><div class="font-bold text-[10px] text-slate-700">${p.name}</div><div class="text-[9px] text-slate-400">${p.earthlyBranch}</div></div></div>`;
                cell.onclick=()=>showModal(p, astrolabe);
                grid.appendChild(cell);
            });
        }

        function showModal(p, astrolabe) {
            const m=document.getElementById('detailModal');
            document.getElementById('modalTitle').innerText = p.name + " · 详情";
            const fmt = (pal) => pal.majorStars.map(s=>s.name).join('、') || '无主星';
            const dui = astrolabe.palace((p.index+6)%12);
            document.getElementById('modalBody').innerHTML = `<div class="bg-indigo-50 p-3 rounded mb-3"><div class="font-bold text-indigo-800">本宫星曜</div>${fmt(p)}<div class="text-xs text-slate-500 mt-1">天干:${p.heavenlyStem} 地支:${p.earthlyBranch}</div></div><div class="text-xs text-slate-500">对宫: ${fmt(dui)}</div>`;
            m.style.display='flex';
        }
        function closeModal(e){if(e.target.id==='detailModal')document.getElementById('detailModal').style.display='none';}

        function renderTab1(astrolabe, birthYear) {
            const stem = ['庚','辛','壬','癸','甲','乙','丙','丁','戊','己'][birthYear%10];
            const sihua = SHI_GAN_SI_HUA[stem] || [];
            let html = '<h3 class="font-bold text-blue-900 mb-2">🌟 生年四化</h3><div class="grid grid-cols-2 gap-2">';
            const types = ['化禄','化权','化科','化忌'];
            sihua.forEach((star, i) => {
                let pName = '未知';
                astrolabe.palaces.forEach(p => { if([...p.majorStars,...p.minorStars].some(s=>s.name===star)) pName=p.name; });
                html += `<div class="bg-blue-50 p-2 rounded text-xs"><span class="font-bold text-blue-700">${star}${types[i]}</span> ➜ ${pName}</div>`;
            });
            document.getElementById('fateSiHua').innerHTML = html + '</div>';
            document.getElementById('fateBasic').innerHTML = `<h3 class="font-bold text-purple-900 mb-2">🧬 命宫主星</h3>${astrolabe.palaces.find(p=>p.name==='命宫').majorStars.map(s=>s.name).join('、')||'命无正曜 (借对宫)'}`;
            document.getElementById('fateLaiYin').innerHTML = ''; // 简化逻辑
        }

        function renderTab2(astrolabe) {
            const div = document.getElementById('palacesList'); div.innerHTML='';
            ['命宫','财帛宫','官禄宫','夫妻宫','迁移宫','福德宫','田宅宫','疾厄宫','父母宫','兄弟宫','子女宫','交友宫'].forEach(n => {
                const p = astrolabe.palaces.find(x=>x.name===n);
                if(!p) return;
                const d = document.createElement('div');
                d.className='bg-white p-3 rounded border border-slate-100 shadow-sm flex justify-between items-center';
                d.innerHTML = `<div><div class="font-bold text-slate-700">${PALACE_TEMPLATE[n]?.icon||''} ${n}</div><div class="text-xs text-slate-400 mt-1">${p.majorStars.map(s=>s.name).join(' ')||'无主星'}</div></div><div class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500">${p.heavenlyStem}${p.earthlyBranch}</div>`;
                d.onclick=()=>showModal(p, astrolabe);
                div.appendChild(d);
            });
        }

        function renderTab3(astrolabe, dateStr) {
            const h = astrolabe.horoscope(dateStr);
            if(!h) return;
            const dec = h.decadal;
            const pName = astrolabe.palace(dec.index)?.name || '未知';
            const rStart = _safeGet(dec, 'range.0', 0);
            const rEnd = _safeGet(dec, 'range.1', 0);
            
            document.getElementById('decadeFortune').innerHTML = `<h3 class="font-bold text-lg">当前大运 (${rStart}-${rEnd}岁)</h3><p class="text-xs opacity-80 mt-1">行运至: ${pName}</p>`;
            
            const list = document.getElementById('forecastContent'); list.innerHTML='';
            const now = new Date();
            for(let i=0; i<3; i++) {
                let dt = new Date(now.getFullYear(), now.getMonth()+i, 15);
                const scope = astrolabe.horoscope(`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-15 12:00:00`);
                if(scope) {
                    const mp = astrolabe.palace(scope.monthly.index);
                    list.innerHTML += `<div class="bg-slate-50 p-2 rounded flex justify-between text-xs mb-2"><span>${dt.getFullYear()}年${dt.getMonth()+1}月</span><span class="font-bold text-indigo-600">流月在${mp.name}</span></div>`;
                }
            }
        }

        function switchTab(t){ ['tab0','tab1','tab2','tab3'].forEach(x=>document.getElementById(x).classList.add('hidden')); document.getElementById(t).classList.remove('hidden'); ['btn-tab0','btn-tab1','btn-tab2','btn-tab3'].forEach(b=>document.getElementById(b).className = (b==='btn-'+t ? 'tab-active' : 'tab-inactive') + ' flex-1 py-3 text-center'); }
        function toggleHistory(){document.getElementById('historyPanel').classList.toggle('hidden');}
        function saveRecord(d){let l=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); l=l.filter(x=>x.time!==d.time); l.unshift(d); if(l.length>5)l.pop(); localStorage.setItem(HISTORY_KEY,JSON.stringify(l)); loadHistory();}
        function loadHistory(){const p=document.getElementById('historyPanel'); const l=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); p.innerHTML=l.map(x=>`<div class="border-b p-1 cursor-pointer" onclick='fill(${JSON.stringify(x)})'>${x.name} <span class="text-gray-400">${x.y}.${x.m}</span></div>`).join('')||'无记录';}
        window.fill=(d)=>{document.getElementById('userName').value=d.name; document.getElementById('selYear').value=d.y; document.getElementById('selMonth').value=parseInt(d.m); document.getElementById('selYear').onchange(); document.getElementById('selDay').value=parseInt(d.d); document.getElementById('birthTime').value=d.time; document.getElementById('location').value=d.loc; document.getElementById('gender').value=d.gender; toggleHistory();}

        init();
    </script>
</body>
</html>
