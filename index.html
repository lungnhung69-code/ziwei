<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>紫微斗数 - 深度填充版 V16.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/iztro@2.5.3/dist/iztro.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #f8fafc; color: #334155; }
        .tab-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; background: #eef2ff; font-weight: 800; }
        .tab-inactive { color: #64748b; background: #fff; font-weight: 500; }
        
        .tag { padding: 2px 5px; border-radius: 4px; font-size: 11px; margin-right: 4px; display: inline-block; font-weight: bold;}
        .tag-ji { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .tag-sha { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .tag-jie { background: #f3f4f6; color: #6b7280; border: 1px dashed #d1d5db; }

        .brightness-庙 { color: #dc2626; font-weight: 800; }
        .brightness-旺 { color: #d97706; font-weight: 700; }
        .brightness-平 { color: #475569; }
        .brightness-陷 { color: #1e293b; opacity: 0.7; }

        .analysis-card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .ac-title { font-size: 18px; font-weight: 800; color: #1e293b; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9; }
        .ac-content { font-size: 15px; line-height: 1.8; color: #475569; text-align: justify; }
        
        .yun-card { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; border-radius: 16px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); margin-bottom: 20px; }
        
        /* 宫位解释专用样式 */
        .palace-def { font-size: 12px; color: #94a3b8; margin-bottom: 8px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }
        .star-detail { margin-top: 8px; font-size: 14px; color: #475569; line-height: 1.6; background: #f8fafc; padding: 10px; border-radius: 8px; }
        .aux-star-detail { font-size: 13px; color: #b91c1c; margin-top: 4px; display: block; }
    </style>
</head>
<body class="pb-20 bg-slate-50">

    <div class="bg-white sticky top-0 z-50 shadow-sm border-b border-slate-200">
        <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-lg text-slate-800"><i class="fas fa-book-open text-indigo-600 mr-2"></i>紫微斗数 · 深度填充版 V16.0</h1>
        </div>
    </div>

    <div class="max-w-xl mx-auto p-4 space-y-4">
        
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="grid grid-cols-3 gap-3">
                <select id="selYear" class="border p-2.5 rounded-lg text-sm outline-none"></select>
                <select id="selMonth" class="border p-2.5 rounded-lg text-sm outline-none"></select>
                <select id="selDay" class="border p-2.5 rounded-lg text-sm outline-none"></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <input type="time" id="birthTime" value="10:15" class="border p-2.5 rounded-lg text-sm w-full outline-none">
                <select id="gender" class="border p-2.5 rounded-lg text-sm outline-none"><option value="女">女</option><option value="男">男</option></select>
            </div>
            <div class="relative">
                <input type="text" id="location" value="河南周口" placeholder="出生地" class="border p-2.5 rounded-lg text-sm w-full pl-9 outline-none">
                <i class="fas fa-map-marker-alt absolute left-3 top-3 text-indigo-400"></i>
            </div>
            <button onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 transform transition text-white py-3.5 rounded-xl font-bold shadow-lg flex justify-center items-center gap-2">
                <i class="fas fa-check-circle"></i> <span>开始深度解析</span>
            </button>
            <div id="solarHint" class="text-[11px] text-center text-slate-400 font-medium"></div>
        </div>

        <div id="resultArea" class="hidden space-y-5 fade-in">
            <div class="flex bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden sticky top-[60px] z-40">
                <button onclick="switchTab('tab1')" id="btn-tab1" class="flex-1 py-3.5 text-sm tab-active">专家总评</button>
                <button onclick="switchTab('tab2')" id="btn-tab2" class="flex-1 py-3.5 text-sm tab-inactive">十二宫详解</button>
                <button onclick="switchTab('tab3')" id="btn-tab3" class="flex-1 py-3.5 text-sm tab-inactive">大运流年</button>
            </div>

            <!-- Tab 1 -->
            <div id="tab1" class="space-y-4">
                <div class="analysis-card">
                    <div class="ac-title"><i class="fas fa-fingerprint text-purple-600"></i> 命宫 · 核心人格</div>
                    <div id="expertMing" class="ac-content"></div>
                </div>
                <div class="analysis-card">
                    <div class="ac-title"><i class="fas fa-briefcase text-amber-600"></i> 事业财运 · 格局</div>
                    <div id="expertCareer" class="ac-content"></div>
                </div>
                <div class="analysis-card">
                    <div class="ac-title"><i class="fas fa-heart text-pink-600"></i> 婚姻情感 · 缘分</div>
                    <div id="expertLove" class="ac-content"></div>
                </div>
            </div>

            <!-- Tab 2 -->
            <div id="tab2" class="hidden space-y-4"><div id="palacesList" class="grid gap-4"></div></div>

            <!-- Tab 3 -->
            <div id="tab3" class="hidden space-y-4">
                <div id="decadeCard" class="yun-card"></div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-lg mb-4">前八步大运</h3>
                    <div id="decadeList" class="space-y-0"></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mt-4">
                    <h3 class="font-bold text-slate-800 text-lg mb-4">未来三个月</h3>
                    <div id="monthlyForecast" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 1. 核心数据库 (情境化内容库) ===
        const PALACE_DEF = {
            '命宫': '【本我】性格核心、天赋才能及人生总基调',
            '兄弟宫': '【手足】兄弟姐妹、合作伙伴及现金流',
            '夫妻宫': '【情感】婚姻缘分、配偶特质及相处模式',
            '子女宫': '【晚辈】子女缘分、合伙生意及桃花位',
            '财帛宫': '【钱财】理财能力、赚钱模式及金钱价值观',
            '疾厄宫': '【身心】身体体质、潜在疾病及深层潜意识',
            '迁移宫': '【外出】对外关系、出差旅游及第一印象',
            '交友宫': '【人际】朋友层次、下属关系及众生缘',
            '官禄宫': '【事业】工作模式、职位高低及职场气场',
            '田宅宫': '【家宅】不动产运、居住环境及存钱能力',
            '福德宫': '【精神】内心世界、兴趣爱好及祖荫福气',
            '父母宫': '【长辈】父母缘分、上司关系及文书运'
        };

        const STAR_CONTEXT = {
            '紫微': { ming: '尊贵有主见，喜主导。', wealth: '财运稳健，多贵人助。', career: '宜管理、公职、创业。', love: '配偶气质高雅有傲气。', other: '尊贵、领导力强。' },
            '天机': { ming: '反应快，善谋略，多虑。', wealth: '靠脑力、技术生财。', career: '宜策划、设计、咨询。', love: '配偶聪明但心思重。', other: '机变、变动多。' },
            '太阳': { ming: '热情豪爽，博爱劳碌。', wealth: '名气大于财气，花钱大方。', career: '宜公职、传播、外交。', love: '配偶爽朗，易因公忘私。', other: '贵气、奔波。' },
            '武曲': { ming: '刚毅果决，重义气。', wealth: '正财星，理财能力强。', career: '宜金融、实业、军警。', love: '配偶个性强，不够浪漫。', other: '执行力强，孤克。' },
            '天同': { ming: '温和慵懒，知足常乐。', wealth: '财运平稳，积少成多。', career: '宜服务、休闲、餐饮。', love: '配偶温和体贴。', other: '福气、享受。' },
            '廉贞': { ming: '爱憎分明，社交手腕高。', wealth: '财运带投机性，偏财。', career: '宜公关、设计、精密技术。', love: '感情浓烈，占有欲强。', other: '次桃花，原则性。' },
            '天府': { ming: '稳重保守，善于守成。', wealth: '财库坐守，越老越有钱。', career: '宜行政、管理、房产。', love: '配偶稳重顾家。', other: '包容、享受。' },
            '太阴': { ming: '温柔细腻，重情感，洁癖。', wealth: '财运如细水长流，宜储蓄。', career: '宜房产、内勤、美业。', love: '配偶体贴，异性缘佳。', other: '富足、内敛。' },
            '贪狼': { ming: '多才多艺，八面玲珑。', wealth: '易发横财，但也易破耗。', career: '宜娱乐、销售、艺术。', love: '桃花旺，配偶有才艺。', other: '欲望、交际。' },
            '巨门': { ming: '观察敏锐，心思缜密，口才好。', wealth: '靠嘴巴赚钱，竞争生财。', career: '宜律师、讲师、研究。', love: '易有口角，沟通是关键。', other: '是非、暗昧。' },
            '天相': { ming: '公正无私，形象好，耳根软。', wealth: '财运平稳，靠人脉生财。', career: '宜秘书、辅助、服务。', love: '配偶多为同事同学。', other: '印星、辅助。' },
            '天梁': { ming: '老成持重，喜照顾人。', wealth: '赚清高之财，或继承祖产。', career: '宜医药、公益、监督。', love: '配偶年长成熟。', other: '荫星、解厄。' },
            '七杀': { ming: '冲动独断，行动力强。', wealth: '财运大起大落，险中求财。', career: '宜业务、创业、外勤。', love: '感情来去快，配偶强势。', other: '肃杀、开创。' },
            '破军': { ming: '喜新厌旧，创意无限。', wealth: '先破后立，财来财去。', career: '宜设计、创新、爆破。', love: '感情不稳定，易波折。', other: '耗星、变动。' }
        };

        const AUX_DESC = {
            '擎羊': '【煞】易有竞争、争执或外伤，过程辛苦。',
            '陀罗': '【煞】事情易拖延、纠结，内心戏多。',
            '火星': '【煞】突发状况多，脾气急躁，但也主爆发力。',
            '铃星': '【煞】性格隐忍，易生闷气，暗中算计。',
            '地空': '【空】不利聚财，想法天马行空，半途而废。',
            '地劫': '【劫】容易破财，得而复失，如浪里行舟。',
            '文昌': '【吉】利于考运、文书、正统学术发展。',
            '文曲': '【吉】利于口才、艺术、非正统才艺。',
            '左辅': '【吉】有平辈贵人助力，办事顺利。',
            '右弼': '【吉】有人缘，异性贵人多。',
            '禄存': '【吉】天生财禄，稳重保守，利于积蓄。',
            '天魁': '【吉】有长辈、上司提拔的机遇。',
            '天钺': '【吉】有暗中贵人相助，逢凶化吉。'
        };

        const CITY_LONGITUDES={'北京':116.40,'上海':121.47,'天津':117.20,'重庆':106.55,'哈尔滨':126.63,'沈阳':123.43,'西安':108.95,'南京':118.78,'杭州':120.19,'武汉':114.31,'广州':113.23,'成都':104.06,'香港':114.17,'台北':121.50,'周口':114.65,'郑州':113.65};

        // === 2. 核心辅助函数 ===
        function findPalace(astrolabe, keyword) {
            return astrolabe.palaces.find(p => p.name.includes(keyword));
        }
        function _getStars(palace) { return (palace && palace.majorStars) ? palace.majorStars : []; }
        function _getMinors(palace) { return (palace && palace.minorStars) ? palace.minorStars : []; }
        
        function _getSmartStars(palace, astrolabe) {
            if (!palace) return { stars: [], isBorrowed: false, src: '无' };
            const majors = _getStars(palace);
            if (majors.length > 0) return { stars: majors, isBorrowed: false, src: palace.name };
            const duiIdx = (palace.index + 6) % 12;
            const duiPalace = astrolabe.palace(duiIdx);
            return { stars: _getStars(duiPalace), isBorrowed: true, src: duiPalace.name };
        }

        // 初始化
        function init() {
            const y=document.getElementById('selYear'), m=document.getElementById('selMonth'), d=document.getElementById('selDay');
            for(let i=new Date().getFullYear(); i>=1940; i--) y.add(new Option(i+'年', i));
            y.value = 1983; 
            for(let i=1; i<=12; i++) m.add(new Option(i+'月', i));
            const updateD = () => {
                const days = new Date(y.value, m.value, 0).getDate();
                d.innerHTML = ''; for(let i=1; i<=days; i++) d.add(new Option(i+'日', i));
            };
            y.onchange = m.onchange = updateD; updateD(); d.value=18;
        }

        function calculate() {
            if (typeof iztro === 'undefined') { alert("资源加载中..."); return; }
            
            const y = document.getElementById('selYear').value;
            const m = document.getElementById('selMonth').value.padStart(2,'0');
            const d = document.getElementById('selDay').value.padStart(2,'0');
            const t = document.getElementById('birthTime').value;
            const gender = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            try {
                let longitude = 120, matchedCity = '';
                for (let city in CITY_LONGITUDES) {
                    if (loc.includes(city)) { longitude = CITY_LONGITUDES[city]; matchedCity = city; break; }
                }
                const offset = (longitude - 120) * 4;
                const dateObj = new Date(`${y}-${m}-${d}T${t}:00`);
                dateObj.setMinutes(dateObj.getMinutes() + offset);
                let timeIndex = Math.floor((dateObj.getHours()+1)/2); if(timeIndex>=12) timeIndex=0;

                document.getElementById('solarHint').innerText = matchedCity ? `✅ 真太阳时已校准 (${matchedCity})` : "ℹ️ 默认北京时间";

                const astrolabe = iztro.astro.bySolar(`${y}-${m}-${d}`, timeIndex, gender, true, 'zh-CN');

                generateMasterReport(astrolabe, parseInt(y));
                renderPalaceDetail(astrolabe);
                renderDecades(astrolabe, parseInt(y));

                document.getElementById('resultArea').classList.remove('hidden');
                switchTab('tab1');

            } catch(e) {
                alert('排盘失败: ' + e.message);
            }
        }

        // === 3. 大师级报告生成器 ===
        function generateMasterReport(astrolabe, birthYear) {
            // 1. 命格总局
            const pMing = findPalace(astrolabe, '命');
            const mingData = _getSmartStars(pMing, astrolabe);
            let mingHTML = `<p>您当前命宫在<span class="font-bold">【${pMing.name}】</span>。`;
            
            if (mingData.isBorrowed) {
                mingHTML += `由于本宫无主星，呈现“借星安宫”的格局，性格可塑性强，核心性格参考对宫（${mingData.src}）的主星：<span class="font-bold">${mingData.stars.map(s=>s.name).join('、')}</span>。`;
            } else {
                mingHTML += `主星为<span class="font-bold">${mingData.stars.map(s=>s.name).join('、')}</span>坐守。`;
            }
            mingHTML += `</p>`;

            // 命宫性格组合
            mingData.stars.forEach(s => {
                if(STAR_CONTEXT[s.name]) {
                    mingHTML += `<div class="mt-2 text-sm text-slate-700">● <b>${s.name}</b>：${STAR_CONTEXT[s.name].ming}</div>`;
                }
            });
            document.getElementById('reportMing').innerHTML = mingHTML;

            // 2. 事业财运 (双星全解析)
            const pGuan = findPalace(astrolabe, '官');
            const pCai = findPalace(astrolabe, '财');
            const guanData = _getSmartStars(pGuan, astrolabe);
            const caiData = _getSmartStars(pCai, astrolabe);
            
            let careerHTML = `<div class="mb-4">
                <div class="font-bold text-slate-800 mb-2 border-l-4 border-amber-500 pl-2">官禄宫（事业）</div>
                <div class="text-sm text-slate-600 mb-2">主星：${guanData.stars.map(s=>s.name).join('、') || '无'} ${guanData.isBorrowed?'(借星)':''}</div>`;
            
            if(guanData.stars.length > 0) {
                guanData.stars.forEach(s => {
                    if(STAR_CONTEXT[s.name]) careerHTML += `<div class="mb-2 text-sm text-slate-700">· <b>${s.name}</b>：${STAR_CONTEXT[s.name].career}</div>`;
                });
            } else {
                careerHTML += `<div class="text-sm text-slate-500">事业宫无主星，职业变动可能较大，适合自由职业或副业。</div>`;
            }
            careerHTML += `</div>`;

            careerHTML += `<div>
                <div class="font-bold text-slate-800 mb-2 border-l-4 border-amber-500 pl-2">财帛宫（财运）</div>
                <div class="text-sm text-slate-600 mb-2">主星：${caiData.stars.map(s=>s.name).join('、') || '无'} ${caiData.isBorrowed?'(借星)':''}</div>`;
            if(caiData.stars.length > 0) {
                caiData.stars.forEach(s => {
                    if(STAR_CONTEXT[s.name]) careerHTML += `<div class="mb-2 text-sm text-slate-700">· <b>${s.name}</b>：${STAR_CONTEXT[s.name].wealth}</div>`;
                });
            } else {
                careerHTML += `<div class="text-sm text-slate-500">财帛宫无主星，财运需靠积少成多，不宜高风险投机。</div>`;
            }
            careerHTML += `</div>`;
            document.getElementById('reportCareer').innerHTML = careerHTML;

            // 3. 婚姻情感
            const pFu = findPalace(astrolabe, '夫');
            const fuData = _getSmartStars(pFu, astrolabe);
            let loveHTML = `<div class="font-bold text-slate-800 mb-2 border-l-4 border-pink-500 pl-2">夫妻宫（缘分）</div>
                            <div class="text-sm text-slate-600 mb-2">主星：${fuData.stars.map(s=>s.name).join('、') || '无'} ${fuData.isBorrowed?'(借星)':''}</div>`;
            
            if(fuData.stars.length > 0) {
                fuData.stars.forEach(s => {
                    if(STAR_CONTEXT[s.name]) loveHTML += `<div class="mb-2 text-sm text-slate-700">· <b>${s.name}</b>：${STAR_CONTEXT[s.name].love}</div>`;
                });
            } else {
                loveHTML += `<div class="text-sm text-slate-500">夫妻宫无主星，缘分可能较晚，或相处模式平淡如水。</div>`;
            }
            document.getElementById('reportLove').innerHTML = loveHTML;
        }

        // === Tab 2: 十二宫 (全面填充) ===
        function renderPalaceDetail(astrolabe) {
            const list = document.getElementById('palacesList');
            list.innerHTML = '';
            const order = ['命宫','兄弟宫','夫妻宫','子女宫','财帛宫','疾厄宫','迁移宫','交友宫','官禄宫','田宅宫','福德宫','父母宫'];
            
            order.forEach(name => {
                const p = findPalace(astrolabe, name.substr(0,1));
                if (!p) return;
                
                const data = _getSmartStars(p, astrolabe);
                const minors = _getMinors(p);
                
                let starsHtml = '';
                if(data.isBorrowed) starsHtml += `<span class="tag tag-jie">借星</span>`;
                starsHtml += data.stars.map(s => `<span class="font-bold text-indigo-700 mr-1 text-base">${s.name}</span><span class="text-xs opacity-50 mr-2 brightness-${s.brightness}">${s.brightness}</span>`).join('');

                const minorsHtml = minors.map(s => {
                    let cls = 'text-slate-400';
                    if(['左辅','右弼','天魁','天钺','禄存'].includes(s.name)) cls = 'tag tag-ji';
                    if(['擎羊','陀罗','火星','铃星'].includes(s.name)) cls = 'tag tag-sha';
                    return `<span class="${cls}">${s.name}</span>`;
                }).join('');

                // 核心：动态生成解释文案
                let desc = "";
                let auxDesc = "";

                // 主星解释
                if(data.stars.length > 0) {
                    desc = data.stars.map(s => {
                        const ctx = STAR_CONTEXT[s.name];
                        if (!ctx) return `${s.name}：特质独特。`;
                        // 根据宫位取不同解释
                        if (name.includes('命')) return `<b>${s.name}</b>：${ctx.ming}`;
                        if (name.includes('财')) return `<b>${s.name}</b>：${ctx.wealth}`;
                        if (name.includes('官')) return `<b>${s.name}</b>：${ctx.career}`;
                        if (name.includes('夫')) return `<b>${s.name}</b>：${ctx.love}`;
                        return `<b>${s.name}</b>：${ctx.other || ctx.base}`; 
                    }).join('<br>');
                } else {
                    desc = "本宫力量较弱，吉凶主要参考对宫星曜。";
                }

                // 辅星解释 (煞星/吉星)
                const auxList = minors.filter(s => AUX_DESC[s.name]).map(s => `<b>${s.name}</b>：${AUX_DESC[s.name]}`);
                if (auxList.length > 0) {
                    auxDesc = `<div class="aux-star-detail">🔍 辅星影响：${auxList.join('；')}</div>`;
                }

                const div = document.createElement('div');
                div.className = 'bg-white rounded-xl p-4 border border-slate-200 shadow-sm';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <div class="font-bold text-lg text-slate-800 border-l-4 border-indigo-500 pl-2">${name}</div>
                        <div class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500 font-mono">${p.heavenlyStem}${p.earthlyBranch}</div>
                    </div>
                    <div class="palace-def">${PALACE_DEF[name]}</div>
                    <div class="mb-2 min-h-[24px] flex items-center flex-wrap">${starsHtml}</div>
                    <div class="mb-2 flex flex-wrap gap-1">${minorsHtml}</div>
                    <div class="star-detail">${desc}${auxDesc}</div>
                `;
                list.appendChild(div);
            });
        }

        // === Tab 3: 大运流年 ===
        function renderDecades(astrolabe, birthYear) {
            const currentYear = new Date().getFullYear();
            const age = currentYear - birthYear + 1;
            
            let curDecade = null;
            astrolabe.palaces.forEach(p => {
                if (p.decadal && age >= p.decadal.range[0] && age <= p.decadal.range[1]) curDecade = p;
            });

            const infoDiv = document.getElementById('currentDecadeInfo');
            if(curDecade) {
                const data = _getSmartStars(curDecade, astrolabe);
                const starNames = data.stars.map(s=>s.name).join('、') || '无';
                
                // 运势文案
                let luckBase = "运势变动较大，需脚踏实地。";
                if(data.stars.length > 0 && STAR_CONTEXT[data.stars[0].name]) {
                    luckBase = STAR_CONTEXT[data.stars[0].name].base;
                }

                infoDiv.innerHTML = `
                    <div class="text-xs opacity-70 mb-1">CURRENT DECADE (${curDecade.decadal.range[0]}-${curDecade.decadal.range[1]}岁)</div>
                    <div class="text-3xl font-bold mb-2">行运【${curDecade.name}】</div>
                    <div class="text-sm border-t border-white/20 pt-3">
                        <p><b>大限主星：</b>${starNames}</p>
                        <p class="mt-2 text-white/90 text-justify">这十年您的重点在于${curDecade.name}相关领域（${PALACE_DEF[curDecade.name].substring(0,10)}...）。<br>运势关键词：${luckBase}。</p>
                    </div>
                `;
            } else {
                infoDiv.innerHTML = '暂无大运数据';
            }

            const list = document.getElementById('decadeList');
            list.innerHTML = '';
            const sorted = [...astrolabe.palaces].sort((a,b) => a.decadal.range[0] - b.decadal.range[0]);
            
            sorted.slice(0, 8).forEach((p, i) => {
                if(!p.decadal) return;
                const data = _getSmartStars(p, astrolabe);
                const sName = data.stars.map(s=>s.name).join(' ') || '空';
                
                const div = document.createElement('div');
                div.className = 'flex gap-4 border-b border-slate-100 pb-4 mb-4 last:border-0';
                div.innerHTML = `
                    <div class="w-16 pt-1 text-center flex-shrink-0">
                        <div class="text-sm font-bold text-indigo-600 bg-indigo-50 rounded py-1">${p.decadal.range[0]}-${p.decadal.range[1]}岁</div>
                        <div class="text-xs text-slate-400 mt-1">第${i+1}运</div>
                    </div>
                    <div>
                        <div class="font-bold text-slate-800">行运【${p.name}】 <span class="text-xs font-normal text-slate-500">(${sName})</span></div>
                        <div class="text-sm text-slate-600 mt-1 text-justify">
                            ${PALACE_DEF[p.name].split('、')[0].replace('代表您的【','').replace('】','')}
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function switchTab(id) {
            ['tab1','tab2','tab3'].forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            ['btn-tab1','btn-tab2','btn-tab3'].forEach(b => { 
                const btn = document.getElementById(b);
                btn.className = b==='btn-'+id ? 'flex-1 py-3.5 text-sm tab-active' : 'flex-1 py-3.5 text-sm tab-inactive'; 
            });
        }

        init();
    </script>
</body>
</html>
